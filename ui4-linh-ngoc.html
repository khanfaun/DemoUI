<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linh Ngọc Giới</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

/* Bộ ảnh 2D vẽ bằng SVG + dữ liệu mẫu dùng chung cho 4 bản demo UI */
(function () {
  const shade = (h, p) => {
    let n = parseInt(h.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = v => Math.max(0, Math.min(255, Math.round(v + (p < 0 ? v : 255 - v) * p / 100)));
    return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
  };
  const P = {
    sword: `<path d="M48 6h10v10L28 46l-10-10z" fill="C"/><path d="M51 9h4v4L28 40l-4-4z" fill="#fff" opacity=".4"/><path d="M12 34l18 18-4 4-18-18z" fill="D"/><path d="M14 46l4 4-9 9-4-4z" fill="#6b4423"/>`,
    helm: `<path d="M12 40a20 22 0 0 1 40 0v6H12z" fill="C"/><rect x="8" y="44" width="48" height="8" rx="3" fill="D"/><path d="M32 6l4 12h-8z" fill="D"/><rect x="29" y="22" width="6" height="22" fill="#fff" opacity=".3"/>`,

    ring: `<circle cx="32" cy="38" r="18" fill="none" stroke="C" stroke-width="7"/><path d="M24 12h16l4 8-12 10-12-10z" fill="D"/>`,
    jade: `<path d="M32 4v10" stroke="#c0392b" stroke-width="3"/><circle cx="32" cy="34" r="20" fill="C"/><circle cx="32" cy="34" r="7" fill="D"/><path d="M28 54l4 8 4-8" fill="#c0392b"/>`,

    flag: `<path d="M14 4v56" stroke="D" stroke-width="5"/><path d="M16 8h38l-8 12 8 12H16z" fill="C"/>`,

    wave: `<path d="M4 40q8-12 16 0t16 0 16 0 8 0v20H4z" fill="C"/><path d="M4 26q8-12 16 0t16 0 16 0 8 0" stroke="D" stroke-width="4" fill="none"/>`,

    bolt: `<path d="M38 2L12 36h16l-4 26 28-36H36z" fill="C"/>`,
    mountain: `<path d="M2 56L22 18l10 14 8-10 22 34z" fill="C"/><path d="M22 18l-6 12h12z" fill="#fff"/>`,
    crane: `<path d="M8 40q20-30 44-22-10 2-14 10 14 4 22 22-20-10-34-4z" fill="C"/><path d="M52 18l8-6" stroke="D" stroke-width="3"/><circle cx="52" cy="17" r="3" fill="#e53935"/>`,
    star: `<path d="M32 4l8 18 20 2-15 13 5 20-18-11-18 11 5-20L4 24l20-2z" fill="C"/>`,
    coin: `<circle cx="32" cy="32" r="26" fill="C"/><circle cx="32" cy="32" r="20" fill="none" stroke="D" stroke-width="3"/><rect x="25" y="25" width="14" height="14" fill="D"/>`,
    gem: `<path d="M12 22l10-12h20l10 12-20 32z" fill="C"/><path d="M12 22h40M22 10l10 44 10-44" stroke="#fff" stroke-width="2" opacity=".5" fill="none"/>`,

    skull: `<path d="M32 6c14 0 24 10 24 24 0 8-4 12-8 14v10H16V44c-4-2-8-6-8-14C8 16 18 6 32 6z" fill="C"/><circle cx="23" cy="30" r="6" fill="D"/><circle cx="41" cy="30" r="6" fill="D"/><path d="M26 50v6M32 50v6M38 50v6" stroke="D" stroke-width="2"/>`,
    fist: `<rect x="14" y="20" width="36" height="28" rx="8" fill="C"/><path d="M23 20v14M32 20v14M41 20v14" stroke="D" stroke-width="3"/><rect x="20" y="46" width="24" height="14" fill="D"/>`,

    paw: `<ellipse cx="32" cy="42" rx="14" ry="12" fill="C"/><circle cx="14" cy="28" r="6" fill="C"/><circle cx="24" cy="16" r="6" fill="C"/><circle cx="40" cy="16" r="6" fill="C"/><circle cx="50" cy="28" r="6" fill="C"/>`,
    yin: `<circle cx="32" cy="32" r="26" fill="D"/><path d="M32 6a26 26 0 0 1 0 52a13 13 0 0 1 0-26a13 13 0 0 0 0-26z" fill="C"/><circle cx="32" cy="19" r="4" fill="D"/><circle cx="32" cy="45" r="4" fill="C"/>`,
    clock: `<circle cx="32" cy="32" r="26" fill="C"/><path d="M32 14v18l12 8" stroke="D" stroke-width="5" fill="none"/>`,
    battle: `<path d="M8 8h6l34 34-6 6L8 14zM56 8h-6L16 42l6 6L56 14z" fill="C"/><path d="M40 46l10-10 6 6-10 10zM24 46L14 36l-6 6 10 10z" fill="D"/>`,
    orb: `<circle cx="32" cy="32" r="24" fill="C"/><circle cx="24" cy="24" r="8" fill="#fff" opacity=".5"/>`,
    dragon: `<path d="M6 44q10-30 30-24t22-10q-2 18-18 20t-24 20z" fill="C"/><path d="M20 34l-4-8M30 28l-2-8" stroke="D" stroke-width="3"/><circle cx="50" cy="16" r="2.5" fill="#fff"/>`,
    tower: `<path d="M32 2l10 10H22z" fill="D"/><rect x="24" y="12" width="16" height="10" fill="C"/><path d="M18 22h28l-6 6H24z" fill="D"/><rect x="22" y="28" width="20" height="12" fill="C"/><path d="M14 40h36l-6 6H20z" fill="D"/><rect x="20" y="46" width="24" height="14" fill="C"/>`,
    shop: `<path d="M6 22l6-14h40l6 14z" fill="D"/><rect x="10" y="22" width="44" height="34" fill="C"/><rect x="18" y="32" width="12" height="24" fill="D"/><rect x="36" y="30" width="12" height="10" fill="#fff" opacity=".6"/>`,
    lock: `<rect x="12" y="28" width="40" height="30" rx="5" fill="C"/><path d="M20 28v-8a12 12 0 0 1 24 0v8" stroke="C" stroke-width="6" fill="none"/><circle cx="32" cy="42" r="5" fill="D"/>`
  };
  const icon = (name, c = '#c9a25a', cls = 'ic') =>
    `<svg viewBox="0 0 64 64" class="${cls}" aria-hidden="true">${(P[name] || P.orb).replace(/="C"/g, `="${c}"`).replace(/="D"/g, `="${shade(c, -40)}"`)}</svg>`;

  let uid = 0;
  /* Nhân vật ngồi thiền / đứng (2D vector) */
  function hero(o = {}) {
    const k = ++uid, robe = o.robe || '#e9eef3', robe2 = o.robe2 || '#9fb3c8', hair = o.hair || '#1d1b22', skin = o.skin || '#f6dcc6',
      aura = o.aura || '#8fd3ff', sash = o.sash || '#4a5c8a', orb = o.orb || '#6ae0ff', gold = o.gold || '#e8c25a';
    const vb = o.vb || '0 0 200 260';
    return `<svg viewBox="${vb}" class="${o.cls || 'hero'}" aria-hidden="true"><defs>
<radialGradient id="ha${k}"><stop offset="0" stop-color="${aura}" stop-opacity=".75"/><stop offset="1" stop-color="${aura}" stop-opacity="0"/></radialGradient>
<linearGradient id="hr${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${robe}"/><stop offset="1" stop-color="${robe2}"/></linearGradient>
<radialGradient id="ho${k}"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="${orb}"/><stop offset="1" stop-color="${orb}" stop-opacity="0"/></radialGradient></defs>
${o.noAura ? '' : `<circle cx="100" cy="120" r="100" fill="url(#ha${k})"/>`}
${o.halo ? `<circle cx="100" cy="68" r="44" fill="none" stroke="${gold}" stroke-width="3" opacity=".8"/>` : ''}
<path d="M80 60Q62 120 70 160L86 110ZM120 60Q138 120 130 160L114 110Z" fill="${hair}"/>
<path d="M28 232Q100 184 172 232Q170 252 100 254Q30 252 28 232Z" fill="url(#hr${k})"/>
<path d="M70 108Q100 96 130 108L150 222Q100 238 50 222Z" fill="url(#hr${k})"/>
<path d="M66 160H134L136 172H64Z" fill="${sash}"/>
<path d="M70 112Q38 150 50 204L88 200Q76 160 88 128ZM130 112Q162 150 150 204L112 200Q124 160 112 128Z" fill="url(#hr${k})" stroke="${robe2}" stroke-width="1"/>
<path d="M86 104L100 140L114 104" fill="none" stroke="${gold}" stroke-width="3"/>
<ellipse cx="86" cy="198" rx="10" ry="7" fill="${skin}"/><ellipse cx="114" cy="198" rx="10" ry="7" fill="${skin}"/>
<circle cx="100" cy="190" r="26" fill="url(#ho${k})"/>
<rect x="93" y="86" width="14" height="20" fill="${skin}"/>
<ellipse cx="100" cy="70" rx="22" ry="26" fill="${skin}"/>
<path d="M77 72Q72 38 100 38Q128 38 123 72Q120 50 100 50Q80 50 77 72Z" fill="${hair}"/>
<circle cx="100" cy="34" r="11" fill="${hair}"/><rect x="88" y="26" width="24" height="5" rx="2" fill="${gold}"/>
${o.horns ? `<path d="M82 46L70 14L90 40ZM118 46L130 14L110 40Z" fill="${gold}"/>` : ''}
${o.mask ? `<path d="M80 62H120V78Q100 88 80 78Z" fill="${o.mask}"/><path d="M86 68h10M104 68h10" stroke="#ff3b3b" stroke-width="3"/>` :
        `<path d="M87 72q5 3 10 0M103 72q5 3 10 0" stroke="#3a2a2a" stroke-width="2" fill="none"/><path d="M96 84q4 2 8 0" stroke="#c46a6a" stroke-width="2" fill="none"/>`}
</svg>`;
  }

  /* Tọa kỵ */
  function mount(type, c = '#ffffff') {
    const d = shade(c, -35);
    const m = {
      crane: `<path d="M40 90Q60 60 110 70L150 40Q160 36 162 44L130 80Q140 100 110 108Q70 116 40 90Z" fill="${c}"/><path d="M60 80Q20 40 10 20Q60 30 100 72Z" fill="${d}"/><path d="M90 76Q110 20 170 10Q150 50 112 82Z" fill="${c}" stroke="${d}"/><path d="M150 40L176 34L152 46Z" fill="#e8a33a"/><circle cx="156" cy="38" r="5" fill="#e53935"/><path d="M95 108L90 136M110 106L112 136" stroke="#555" stroke-width="3"/><path d="M40 90L14 100L44 96Z" fill="#222"/>`,
      qilin: `<ellipse cx="96" cy="78" rx="52" ry="26" fill="${c}"/><path d="M58 92v38M76 98v32M116 98v32M134 92v38" stroke="${d}" stroke-width="10" stroke-linecap="round"/><path d="M140 66Q160 30 178 40Q186 60 160 74Z" fill="${c}"/><path d="M168 36L176 12L172 38Z" fill="#ffd54f"/><circle cx="170" cy="48" r="3" fill="#222"/><path d="M44 72Q10 60 20 30Q30 60 50 64Z" fill="#ff7043"/><path d="M120 56Q130 40 150 50Q140 60 128 66Z" fill="#ff7043"/><path d="M70 70q26 -10 52 0" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>`,
      sword: `<path d="M20 100L170 40L178 48L30 112Z" fill="${c}"/><path d="M30 104L172 44" stroke="#fff" stroke-width="2" opacity=".7"/><path d="M28 92L40 120M20 100L8 108" stroke="${d}" stroke-width="8"/><ellipse cx="80" cy="116" rx="60" ry="12" fill="#fff" opacity=".6"/><ellipse cx="120" cy="120" rx="40" ry="9" fill="#fff" opacity=".5"/>`,
      cloud: `<g fill="${c}"><circle cx="60" cy="90" r="26"/><circle cx="96" cy="76" r="34"/><circle cx="136" cy="90" r="26"/><rect x="40" y="90" width="120" height="26" rx="13"/></g><path d="M54 112q46 14 92 0" stroke="${d}" stroke-width="4" fill="none"/><path d="M150 100q30 0 36 -20" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round"/>`,
      phoenix: `<path d="M30 96Q70 40 120 60L160 30Q168 40 150 58Q150 96 110 104Q70 112 30 96Z" fill="${c}"/><path d="M70 70Q40 10 10 10Q40 50 60 90Z" fill="${d}"/><path d="M100 64Q120 0 180 6Q150 40 116 80Z" fill="${d}"/><path d="M30 96Q0 120 6 136Q30 120 50 104Z" fill="${c}"/><circle cx="156" cy="40" r="3" fill="#fff"/>`
    };
    return `<svg viewBox="0 0 200 140" class="mnt" aria-hidden="true">${m[type] || m.cloud}</svg>`;
  }

  /* Phong cảnh núi non */
  function scenery(cols = ['#c9d6dc', '#9fb2bb', '#6f858f'], sun = '#f6e7c8', cls = 'scn') {
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" class="${cls}" aria-hidden="true">
<circle cx="300" cy="90" r="56" fill="${sun}" opacity=".85"/>
<path d="M0 190L40 120L70 150L120 70L170 140L210 110L260 170L300 100L350 150L400 120V300H0Z" fill="${cols[0]}"/>
<path d="M0 230L50 170L90 200L140 150L200 210L250 160L310 220L360 180L400 200V300H0Z" fill="${cols[1]}"/>
<rect x="0" y="210" width="400" height="22" fill="#fff" opacity=".35"/>
<path d="M0 270L60 230L120 260L190 220L260 262L330 230L400 255V300H0Z" fill="${cols[2]}"/></svg>`;
  }

  /* Lầu các / kiến trúc */
  function pagoda(c = '#a8322a', w = '#e9dcc2', tiers = 3) {
    let s = '', y = 90;
    for (let i = 0; i < tiers; i++) {
      const wd = 70 - i * 14, x = 50 - wd / 2;
      s += `<rect x="${x + 6}" y="${y - 16}" width="${wd - 12}" height="16" fill="${w}"/><rect x="${x + 14}" y="${y - 12}" width="6" height="12" fill="${shade(c, -30)}"/><rect x="${x + wd - 20}" y="${y - 12}" width="6" height="12" fill="${shade(c, -30)}"/>`;
      s += `<path d="M${x - 6} ${y - 14}Q50 ${y - 30} ${x + wd + 6} ${y - 14}L${x + wd - 4} ${y - 22}H${x + 4}Z" fill="${c}"/>`;
      y -= 24;
    }
    return `<svg viewBox="0 0 100 100" class="pgd" aria-hidden="true"><rect x="10" y="90" width="80" height="6" fill="${shade(w, -30)}"/>${s}<path d="M50 ${y - 12}V${y + 4}" stroke="#e8c25a" stroke-width="3"/></svg>`;
  }

  const RAR = [
    { n: 'Phàm phẩm', c: '#9aa0a6' }, { n: 'Lương phẩm', c: '#43a047' }, { n: 'Tinh phẩm', c: '#2f8fe0' },
    { n: 'Huyền phẩm', c: '#9c4fe0' }, { n: 'Địa phẩm', c: '#f0901e' }, { n: 'Thiên phẩm', c: '#e53935' }
  ];
  const T = { pill: 'Đan dược', mat: 'Nguyên liệu', eq: 'Trang bị', book: 'Bí tịch', spe: 'Đặc biệt' };
  const it = (n, i, c, r, t, q, d) => ({ n, i, c, r, t, q, d });
  const ITEMS = [
    it('Tụ Khí Đan', 'pill', '#7fd0ff', 1, 'pill', 128, 'Tăng 500 tu vi khi dùng. Thích hợp cho tu sĩ Luyện Khí.'),
    it('Trúc Cơ Đan', 'pill', '#ffd166', 2, 'pill', 6, 'Tăng 20% tỉ lệ đột phá Trúc Cơ.'),
    it('Kết Kim Đan', 'pill', '#f4a261', 3, 'pill', 3, 'Ngưng tụ kim đan, tăng 15% tỉ lệ độ kiếp.'),
    it('Phá Chướng Đan', 'pill', '#c77dff', 4, 'pill', 2, 'Xóa 30 điểm tâm ma ngay lập tức.'),
    it('Cửu Chuyển Hoàn Hồn Đan', 'pill', '#ff4d6d', 5, 'pill', 1, 'Hồi sinh khi độ kiếp thất bại, giữ lại toàn bộ tu vi.'),
    it('Hồi Xuân Đan', 'pill', '#8ce99a', 1, 'pill', 45, 'Hồi 30% khí huyết trong chiến đấu.'),
    it('Linh Chi Nghìn Năm', 'herb', '#e76f51', 3, 'mat', 12, 'Linh dược nghìn năm, nguyên liệu luyện Kết Kim Đan.'),

  return SKILLS.map(s=>`<div class="sk glass"><div class="orb" style="--r:${s.c}">${icon(s.i,s.c)}</div><div class="tx"><b class="one">${s.n} · Lv${s.lv}</b><p>${s.d}</p></div><button class="b" onclick="skA('${s.n}')">Nâng</button></div>`).join('')}},
 toaky:{t:'Tọa Kỵ',tabs:['Bộ sưu tập','Bồi dưỡng'],r(tab){
  if(tab==='Bộ sưu tập')return `<div class="msw">${MOUNTS.map((m,i)=>`<div class="mcd glass ${m.own?'':'lk'}"><div class="im">${mount(m.t,m.c)}</div><span class="rr" style="color:${RAR[m.r].c}">${RAR[m.r].n}</span><div class="tx"><b class="one">${m.n}</b><div class="kv"><span>Tốc độ</span><b>${m.sp}</b></div><div class="kv"><span>Thuộc tính</span><b>${m.st}</b></div><p style="font-size:12px;color:var(--mut);margin:6px 0" class="one">${m.d}</p><div style="display:flex;gap:6px">${m.own?`<button class="b" onclick="toast('Đã cưỡi ${m.n}')">Cưỡi</button><button class="b g" onclick="S('toaky','Bồi dưỡng')">Bồi dưỡng</button>`:`<button class="b y" onclick="A('cachnhan',${i})">Cách nhận</button>`}</div></div></div>`).join('')}</div><p style="text-align:center;color:var(--mut);font-size:12px">← Vuốt để xem tọa kỵ khác →</p>`;
  return `<div class="gc glass"><div style="height:150px">${mount('crane','#ffffff')}</div><div class="kv"><span>Tiên Hạc · Bậc</span><b>3 → 4</b></div><div class="kv"><span>Kinh nghiệm</span><b>1.240 / 3.000</b></div><div class="hpb"><i style="width:41%;background:var(--gold)"></i></div></div><div class="lbl">Nguyên liệu</div><div style="display:flex;gap:10px">${['Lông Tiên Hạc','Tụ Khí Đan','Linh Thạch Thượng Phẩm'].map(n=>`<div style="width:60px">${orb(GA.item(n),1)}</div>`).join('')}</div><br><div style="text-align:center"><button class="b y" onclick="toast('+120 kinh nghiệm')">Bồi dưỡng</button></div>`}},
 bicanh:{t:'Bí Cảnh',tabs:['Phù Đảo','Thí Luyện'],r(tab){
  if(tab==='Phù Đảo')return DUNGEONS.map((d,i)=>`<button class="isl glass ${d.st==='Khóa'?'lk':''}" onclick="dunA(${i})"><div class="im">${scenery(['#bff3e4','#7fd8c4',d.c],'#fff')}<i>${icon(d.i,'#fff')}</i></div><div class="tx"><b class="one">${d.n}</b>Yêu cầu: ${d.req}<br><span class="tag" style="color:${d.st==='Khóa'?'#aaa':d.st==='Đang mở'?'var(--gold)':'var(--jade)'}">${d.st}</span></div></button>`).join('');
  return `<div style="text-align:center"><div style="width:140px;height:180px;margin:0 auto">${icon('tower','#7fd8c4')}</div><b class="lo" style="font-size:22px">Linh Tháp · Tầng 37</b><p style="color:var(--mut)">Kỷ lục máy chủ: tầng 82</p><br><button class="b y" onclick="combat()">Khiêu chiến</button></div>`}},
 dongphu:{t:'Động Phủ',tabs:['Công trình','Tông môn'],r(tab){
  if(tab==='Công trình')return `<div class="tiles">${BUILD.map((b,i)=>`<button class="tile glass" onclick="A('build',${i})">${pagoda(b.c,'#e6fff8',(i%3)+1)}<b class="one">${b.n}</b><span class="lv">Cấp ${b.lv}</span><div class="one" style="color:var(--mut)">${b.t}</div></button>`).join('')}</div>`;
  return `<div class="gc glass" style="margin-bottom:10px"><b class="lo" style="font-size:18px">${P.sect}</b><div class="kv"><span>Cấp</span><b>7</b></div><div class="kv"><span>Cống hiến</span><b>2.450</b></div></div><div class="lbl">Nhiệm vụ tông môn</div>${TASKS.map(t=>`<div class="row glass"><div class="tx"><b>${t.n}</b><small>${t.r} · ${t.p}</small></div><button class="b" onclick="toast('Đã nhận')">Nhận</button></div>`).join('')}<div class="lbl">Đồng môn</div>${MEMBERS.map(m=>`<div class="row glass"><div class="tx"><b>${m[0]}</b><small>${m[1]} · ${m[2]}</small></div><button class="b g" onclick="combat()">Tỉ thí</button></div>`).join('')}`}}
};
function S(k,tab){closeA();const s=SH[k];tab=tab||s.tabs[0];$('st').textContent=s.t;$('sg').innerHTML=s.tabs.map(t=>`<button class="${t===tab?'on':''}" onclick="S('${k}','${t}')">${t}</button>`).join('');$('sc').innerHTML=s.r(tab);$('sc').scrollTop=0;$('sh').classList.add('on')}
function closeS(){$('sh').classList.remove('on')}
// DIALOG
function dlg(t,c,a){$('dt').textContent=t;$('dc').innerHTML=c;$('da').innerHTML=a??`<button class="b" onclick="closeA()">Đóng</button>`;$('dlg').classList.add('on')}
function closeA(){$('dlg').classList.remove('on')}
const ok=(m,l='Xác nhận')=>`<button class="b g" onclick="closeA()">Hủy</button><button class="b y" onclick="closeA();toast('${m}')">${l}</button>`;
function itemA(n){const x=GA.item(n);dlg(x.n,`<div style="width:90px;margin:0 auto 10px">${orb(x)}</div><p style="text-align:center;color:${RAR[x.r].c};font-weight:700">${RAR[x.r].n} · ${T[x.t]} · x${fmt(x.q)}</p><p>${x.d}</p>`,x.t==='eq'?`<button class="b g" onclick="closeA();A('cuonghoa')">Cường hóa</button><button class="b y" onclick="closeA();toast('Đã trang bị')">Trang bị</button>`:`<button class="b g" onclick="closeA();toast('Đã bán')">Bán</button><button class="b y" onclick="closeA();toast('Đã dùng ${x.n}')">Dùng</button>`)}
function gongA(i){const g=GONG[i];dlg(g.n,`<div class="gn" style="position:static;transform:none;width:80px;margin:0 auto;--c:${g.c}"><div class="o">${g.k}</div></div><div class="kv"><span>Cấp</span><b>${g.lv}/30</b></div><div class="kv"><span>Hiệu quả</span><b>${g.b}</b></div><div class="kv"><span>Tiêu hao</span><b>${fmt(g.lv*1200)} tu vi</b></div>`,ok('Tu luyện thành công','Tu luyện'))}
function skA(n){const s=SKILLS.find(x=>x.n===n);dlg(s.n,`<div style="width:80px;margin:0 auto 10px"><div class="orb" style="--r:${s.c}">${icon(s.i,s.c)}</div></div><p>${s.d}</p><div class="kv"><span>Cấp</span><b>${s.lv}/${s.max}</b></div><div class="kv"><span>Hồi chiêu</span><b>${s.cd} hiệp</b></div>`,`<button class="b g" onclick="closeA();toast('${s.on?'Đã gỡ':'Đã lắp'}')">${s.on?'Gỡ':'Lắp'}</button><button class="b y" onclick="closeA();toast('Lên cấp!')">Nâng cấp</button>`)}
function dunA(i){const d=DUNGEONS[i];if(d.st==='Khóa')return dlg(d.n,`<p style="text-align:center">🔒 Cần cảnh giới <b>${d.req}</b></p>`);
 dlg(d.n,`<div style="height:130px;border-radius:16px;overflow:hidden">${scenery(['#bff3e4','#7fd8c4',d.c],'#fff')}</div><div class="kv"><span>Yêu cầu</span><b>${d.req}</b></div><div class="kv"><span>Lượt</span><b>3/5</b></div><div class="lbl">Rơi đồ</div><div style="display:flex;gap:10px">${d.drop.map(k=>`<div style="width:54px">${orb(ITEMS.find(y=>y.i===k)||ITEMS[0])}</div>`).join('')}</div>`,`<button class="b g" onclick="closeA();toast('Quét nhanh: +3 vật phẩm')">Quét</button><button class="b y" onclick="closeA();combat()">Tiến vào</button>`)}
const AD={
 thu:()=>dlg('Truyền Âm',MAILS.map(m=>`<div class="row glass"><div style="width:32px;height:32px;flex:none">${icon('mail','#bff3e4')}</div><div class="tx"><b class="one">${m.t}</b><small class="one" style="display:block">${m.f}: ${m.d}</small></div>${m.g.length?`<button class="b" onclick="this.textContent='✔';toast('Đã nhận')">Nhận</button>`:''}</div>`).join(''),`<button class="b y" onclick="closeA();toast('Nhận tất cả')">Nhận tất cả</button>`),
 sukien:()=>dlg('Quà 7 Ngày',`<div class="days">${DAYS.map((d,i)=>`<div class="${i<1?'got':i==1?'now':''}">Ngày ${i+1}<i>${icon(d[0],'#f3d58a')}</i><span class="one" style="display:block">${d[1]}</span></div>`).join('')}</div>`,`<button class="b y" onclick="closeA();toast('Nhận quà ngày 2')">Nhận</button>`),
 caidat:()=>dlg('Cài Đặt',['Âm nhạc','Âm thanh','Hạt linh khí','Rung'].map(s=>`<div class="kv"><span>${s}</span><button class="b" style="padding:2px 12px" onclick="this.textContent=this.textContent==='Bật'?'Tắt':'Bật'">Bật</button></div>`).join(''),`<button class="b y" onclick="closeA()">Lưu</button>`),
 xephang:()=>dlg('Thiên Bảng',RANK.map((r,i)=>`<div class="kv"><span class="one">${i+1}. ${r[0]} · ${r[1]}</span><b>${r[2]}</b></div>`).join('')),
 shop:()=>dlg('Linh Bảo Các',`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${ITEMS.slice(0,12).map(x=>`<div style="text-align:center;font-size:11px;font-weight:700">${orb(x)}${(x.r+1)*30} ngọc</div>`).join('')}</div>`),
 tamma:()=>dlg('Tâm Ma',`<div style="height:150px">${hero({robe:'#2a0a2a',robe2:'#000',aura:'#ff4a8a',orb:'#ff4a8a',horns:1,mask:'#111'})}</div><p style="text-align:center">Tâm ma 18/100</p>`,`<button class="b g" onclick="closeA();itemA('Phá Chướng Đan')">Dùng đan</button><button class="b y" onclick="closeA();combat()">Trấn áp</button>`),
 dokiep:()=>dlg('Đột Phá',`<p style="text-align:center">Kết Đan ${P.layer} → Kết Đan ${P.layer+1}</p><div class="kv"><span>Tu vi</span><b>${fmt(P.tuvi)}/${fmt(P.need)}</b></div><div class="kv"><span>Tỉ lệ</span><b>68%</b></div>`,ok('Tu vi chưa đủ','Đột phá')),
 mo:()=>dlg('Mở ô',`<p style="text-align:center">Mở 10 ô với 100 ngọc?</p>`,ok('Đã mở','Mở')),
 trong:s=>dlg(s,`<p style="text-align:center">Chưa có ${s}.</p>`,`<button class="b y" onclick="closeA();S('dongphu')">Đến Động Phủ</button>`),
 cuonghoa:()=>dlg('Cường Hóa',`<div style="width:80px;margin:0 auto">${orb(GA.item('Thanh Phong Kiếm'))}</div><div class="kv"><span>Cấp</span><b>+7 → +8</b></div><div class="kv"><span>Tỉ lệ</span><b>75%</b></div>`,ok('Cường hóa thành công!','Cường hóa')),
 kham:()=>dlg('Khảm Ngọc',`<div style="display:flex;gap:10px;justify-content:center">${[1,0,0,0].map(f=>`<div style="width:54px">${f?orb(GA.item('Huyết Ngọc')):'<div class="orb empty"></div>'}</div>`).join('')}</div>`),
 tay:()=>dlg('Tẩy Linh Căn',`<p>Dùng Tẩy Tủy Dịch x1?</p>`,ok('Đã tẩy','Tẩy')),
 cachnhan:i=>dlg(MOUNTS[i].n,`<p>${MOUNTS[i].d}</p>`,`<button class="b y" onclick="A('sukien')">Đến sự kiện</button>`),
 build:i=>{const b=BUILD[i];dlg(b.n,`<div style="width:120px;height:120px;margin:0 auto">${pagoda(b.c,'#e6fff8',3)}</div><p style="text-align:center">${b.d}</p><div class="kv"><span>Cấp</span><b>${b.lv}</b></div><div class="kv"><span>Trạng thái</span><b>${b.t}</b></div>`,`<button class="b g" onclick="closeA();toast('Đã thu hoạch')">Thu hoạch</button><button class="b y" onclick="closeA();toast('Bắt đầu nâng cấp')">Nâng cấp</button>`)}
};
function A(k,a){AD[k](a)}
// COMBAT
let eh,ph,rd;
function combat(){closeS();closeA();eh=ENEMY.hp;ph=84598;rd=1;
 $('cb').innerHTML=`<div class="ec glass" id="fe">${hero({robe:'#3a0a2a',robe2:'#000',aura:'#ff4a6a',orb:'#ff4a6a',horns:1,mask:'#111'})}<div class="tx"><b class="one">${ENEMY.n}</b><small style="color:var(--mut)">${ENEMY.realm}</small><div class="hpb"><i id="eh" style="width:100%"></i></div></div></div>
 <div class="mid"><div class="rd" id="rd">Hiệp 1</div><div id="fx" style="position:absolute;left:50%;top:40%"></div></div>
 <div class="ec glass pc">${hero({...H,noAura:1})}<div class="tx"><b class="one">${P.name}</b><small style="color:var(--mut)">${P.realm} ${P.layer}</small><div class="hpb"><i id="ph" style="width:100%"></i></div></div><button class="b g" onclick="$('cb').classList.remove('on')">Rời</button></div>
 <div class="elw">${SKILLS.filter(s=>s.on).slice(0,5).map(s=>`<button onclick="hit('${s.n}')"><div class="orb" style="--r:${s.c}">${icon(s.i,s.c)}</div><span class="one" style="display:block">${s.n.split(' ').slice(0,2).join(' ')}</span></button>`).join('')}</div>
 <div class="clog glass" id="clog">Linh khí cuồn cuộn, trận đấu bắt đầu!</div>`;$('cb').classList.add('on')}
function hit(n){if(eh<=0)return;const d=Math.round(20000+Math.random()*14000),r=Math.round(3000+Math.random()*5000);eh=Math.max(0,eh-d);ph=Math.max(1,ph-r);
 $('eh').style.width=eh/ENEMY.hp*100+'%';$('ph').style.width=ph/84598*100+'%';const fe=$('fe');fe.classList.remove('hitfx');void fe.offsetWidth;fe.classList.add('hitfx');
 $('fx').innerHTML=`<div class="dmg">-${fmt(d)}</div>`;$('clog').insertAdjacentHTML('afterbegin',`<div>Hiệp ${rd}: <u>${P.name}</u> dùng <b>${n}</b> gây ${fmt(d)}; bị phản ${fmt(r)}.</div>`);rd++;$('rd').textContent='Hiệp '+rd;
 if(eh<=0)setTimeout(()=>dlg('Chiến Thắng',`<p style="text-align:center">Đánh bại ${ENEMY.n}!</p><div style="display:flex;gap:10px;justify-content:center">${[ITEMS[2],ITEMS[13],ITEMS[29]].map(x=>`<div style="width:56px">${orb(x,1)}</div>`).join('')}</div>`,`<button class="b g" onclick="closeA();combat()">Đánh lại</button><button class="b y" onclick="closeA();$('cb').classList.remove('on')">Về</button>`),500)}
</script></body></html>
