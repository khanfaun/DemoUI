<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thủy Mặc Ngọc Giới</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Prata&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--tx:#18352f;--tx2:#4f6f66;--jd:#2f8f74;--jd2:#1c5a48;--gd:#c49a3e;--gd2:#8a6420;--cr:#fbfaf3;--ln:#d9e3da;--rd:#c0392b;--bl:#2f6fb0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0e2a24;font:400 10.5px/1.35 Lexend,sans-serif;color:var(--tx);display:flex;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%;user-select:none;-webkit-user-drag:none}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-family:Prata,serif;font-weight:400}
.app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;overflow:hidden;background:#cfe0d8}
@media(min-width:520px){.app{height:min(932px,100vh);margin:auto 0;border-radius:22px;box-shadow:0 0 0 8px #071712,0 30px 80px #000}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:26px;padding:0 10px;border:9px solid transparent;border-image:url(assets/ui-b-nut.webp) 30 38 fill / 9px 13px stretch;font-weight:600;font-size:10.5px;color:#4a2e06;white-space:nowrap}
.btn.j{border-image-source:url(assets/ui-b-nut2.webp);color:#0e3a2c}
.btn.s{height:21px;font-size:9.5px;padding:0 4px}
.btn:active{transform:translateY(1px);filter:brightness(.95)}
.ic{width:100%;height:100%;object-fit:contain}
/* ===== TU LUYỆN (màn chính) ===== */
.home{position:absolute;inset:0 0 58px;background:url(assets/dp-ngay.webp) center 32%/cover;overflow:hidden}
.home::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.28),transparent 20%,transparent 62%,rgba(14,42,36,.55));pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:6px 6px 0}
.prof{display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,rgba(251,250,243,.96),rgba(251,250,243,.84));border:1px solid #e6d7a8;border-radius:12px;padding:4px 6px;box-shadow:0 2px 6px rgba(14,42,36,.2)}
.ava{width:40px;height:40px;flex:none;border-radius:50%;background:#e8f1ea url(assets/nv-nam.webp) 50% 12%/180%;box-shadow:0 0 0 2px var(--gd),0 0 0 3px #fff}
.prof .tx{flex:1;min-width:0}.prof b{font-family:Prata;font-size:14px;display:block;line-height:1.1}.prof small{font-size:9px;color:var(--tx2);display:block}
.pw{text-align:right;line-height:1.15;flex:none}.pw b{font-size:13px;color:var(--gd2)}.pw small{display:block;font-size:8.5px;color:var(--tx2)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:4px}
.res button{display:flex;align-items:center;gap:2px;background:rgba(14,42,36,.72);color:#f2f7ee;border-radius:10px;padding:1px 4px 1px 1px;font-size:9px;font-weight:600;min-width:0}
.res img{width:16px;height:16px;flex:none}.res span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feat{position:absolute;left:6px;right:6px;top:84px;z-index:5;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.fb{position:relative;text-align:center;font-size:8.5px;font-weight:600;color:#fff;text-shadow:0 1px 2px #0e2a24,0 0 4px #0e2a24}
.fb i{position:relative;display:block;width:36px;height:36px;margin:0 auto 1px;border-radius:11px;padding:5px;background:linear-gradient(#fffdf5,#e9f1eb);box-shadow:0 0 0 1.5px var(--gd),0 3px 5px rgba(14,42,36,.35)}
.fb i.n::after{content:attr(data-n);position:absolute;right:-4px;top:-4px;min-width:14px;height:14px;border-radius:7px;background:var(--rd);color:#fff;font-size:8px;line-height:14px;font-style:normal;padding:0 3px;box-shadow:0 0 0 1.5px #fff;text-shadow:none}
.stage{position:absolute;left:0;right:0;top:136px;bottom:150px;z-index:3}
.stage .hero{position:absolute;left:50%;bottom:8%;height:78%;transform:translateX(-50%);filter:drop-shadow(0 10px 14px rgba(14,42,36,.35));animation:br 4s ease-in-out infinite}
@keyframes br{50%{transform:translate(-50%,-6px)}}
.stage .dai{position:absolute;left:50%;bottom:0;width:78%;transform:translateX(-50%);opacity:.95}
.gain{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:700;font-size:12px;color:#fff;text-shadow:0 0 6px var(--jd),0 1px 2px #0e2a24;animation:gup 1.4s forwards;pointer-events:none;white-space:nowrap;z-index:4}
@keyframes gup{to{transform:translate(-50%,-40px);opacity:0}}
.orbb{position:absolute;top:8%;width:84px;text-align:center;z-index:4}
.orbb.l{left:4px}.orbb.r{right:4px}
.orbb .o{position:relative;width:76px;height:76px;margin:0 auto;animation:fl 3s ease-in-out infinite}
.orbb.r .o{animation-delay:-1.5s}@keyframes fl{50%{transform:translateY(-5px)}}
.orbb .o img{position:absolute;inset:-14px;width:104px;height:104px;max-width:none}
.orbb .o b{position:absolute;inset:0;display:grid;place-items:center;font-family:Prata;font-size:15px;color:#fff;text-shadow:0 0 6px #000,0 1px 2px #000;line-height:1}
.orbb small{display:inline-block;margin-top:2px;font-size:8.5px;font-weight:600;background:rgba(251,250,243,.92);border:1px solid var(--gd);border-radius:8px;padding:0 6px;white-space:nowrap;color:var(--tx)}
.sidea{position:absolute;right:6px;bottom:4px;z-index:4;display:grid;gap:6px}
.sidea button,.sideb button{width:44px;text-align:center;font-size:8.5px;font-weight:600;color:#fff;text-shadow:0 1px 2px #0e2a24}
.sidea i,.sideb i{display:block;width:40px;height:40px;margin:0 auto;border-radius:50%;padding:6px;background:radial-gradient(#fffdf5,#e8f0ea);box-shadow:0 0 0 1.5px var(--gd),0 3px 6px rgba(14,42,36,.4)}
.sideb{position:absolute;left:6px;bottom:4px;z-index:4;display:grid;gap:6px}
.cult{position:absolute;left:6px;right:6px;bottom:72px;z-index:5;display:flex;align-items:center;gap:6px;background:linear-gradient(rgba(251,250,243,.96),rgba(236,242,236,.94));border:1px solid #e6d7a8;border-radius:14px;padding:5px 6px;box-shadow:0 3px 10px rgba(14,42,36,.3)}
.cult .rb{width:50px;flex:none;text-align:center;font-size:8.5px;font-weight:600;color:var(--jd2)}
.cult .rb i{display:block;width:38px;height:38px;margin:0 auto 1px;border-radius:50%;padding:5px;background:linear-gradient(var(--jd),var(--jd2));box-shadow:0 0 0 2px var(--gd)}
.cult .mid{flex:1;min-width:0;text-align:center}
.cult .mid b{font-family:Prata;font-size:12.5px;display:block;color:var(--tx)}
.cult .mid small{font-size:9px;color:var(--tx2)}
.tv{position:relative;height:12px;border-radius:6px;background:#dfe9e2;overflow:hidden;margin:3px 0;box-shadow:inset 0 0 0 1px #c8d6cc}
.tv i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--jd),#7ad0b0,#e8d890);transition:width .5s}
.tv span{position:absolute;inset:0;font-size:8.5px;font-weight:700;line-height:12px;color:#0e2a24;text-shadow:0 0 2px #fff}
.log{position:absolute;left:6px;right:6px;bottom:4px;z-index:5;height:64px;overflow:auto;font-size:9px;line-height:1.45;color:#eef7f2;background:linear-gradient(rgba(14,42,36,.55),rgba(14,42,36,.8));border-radius:10px;padding:4px 8px;border-left:3px solid var(--gd)}
.log b{color:#ffe08a;font-weight:600}.log u{color:#9ff0c8;text-decoration:none}
/* nav 7 ô, ô giữa nổi */
.nav{position:absolute;left:0;right:0;bottom:0;height:58px;z-index:20;display:grid;grid-template-columns:repeat(7,1fr);padding:4px 2px 6px;background:linear-gradient(#fbfaf3,#ecf2ec);border-top:2px solid var(--gd);box-shadow:0 -4px 12px rgba(14,42,36,.25)}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:8.5px;font-weight:600;color:var(--tx2);min-width:0}
.nv i{width:30px;height:30px;padding:2px;display:block;transition:.15s}
.nv span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv.on{color:var(--jd2)}.nv.on i{transform:translateY(-6px) scale(1.15);filter:drop-shadow(0 4px 3px rgba(14,42,36,.35))}
.nv.on::before{content:'';position:absolute;top:-10px;left:50%;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:radial-gradient(#fff,#f1ead3);box-shadow:0 0 0 2px var(--gd);z-index:-1}
.nv.c i{width:40px;height:40px;margin-top:-14px;border-radius:50%;padding:4px;background:radial-gradient(#fff,#e6f1ea);box-shadow:0 0 0 2px var(--gd),0 3px 8px rgba(14,42,36,.35)}
.nv.c.on i{transform:translateY(-4px)}.nv.c.on::before{display:none}
.nv em{position:absolute;right:8px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--rd);box-shadow:0 0 0 1.5px #fff}
/* ===== TRANG ===== */
.page{position:absolute;inset:0 0 58px;z-index:10;background:linear-gradient(#eef4ef,#e3ece5);display:none;flex-direction:column}
.page.on{display:flex}
.pgh{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;background:linear-gradient(#fbfaf3,#f1f5ef);border-bottom:1px solid #e6d7a8}
.pgh h2{flex:1;font-family:Prata;font-size:17px;min-width:0;line-height:1.05}.pgh h2 small{display:block;font:400 9px Lexend;color:var(--tx2)}
.pgh .rs{display:flex;gap:4px;font-size:9px;font-weight:600}.pgh .rs span{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:0 5px 0 1px}.pgh .rs img{width:15px;height:15px}
.seg{display:flex;gap:4px;padding:6px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.seg button{flex:none;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;color:var(--tx2);background:#fff;border:1px solid var(--ln)}
.seg button.on{color:#fff;background:linear-gradient(var(--jd),var(--jd2));border-color:var(--jd2)}
.pb{flex:1;overflow:auto;padding:4px 10px 12px}
.h3{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:Prata;font-size:12.5px;color:var(--jd2);margin:8px 0 5px}
.h3 small{font:400 9px Lexend;color:var(--tx2)}
.card{background:var(--cr);border:1px solid #e3e9e0;border-radius:10px;box-shadow:0 1px 2px rgba(14,42,36,.08)}
.sl{position:relative;aspect-ratio:1;border-radius:8px;padding:4px;background:radial-gradient(circle at 50% 35%,#fff,color-mix(in srgb,var(--rc,#9aa) 22%,#f4f6f0));box-shadow:inset 0 0 0 1.5px var(--rc,#cfd8d0),0 1px 2px rgba(14,42,36,.12)}
.sl em{position:absolute;right:2px;bottom:0;font-style:normal;font-size:8.5px;font-weight:700;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.sl u{position:absolute;left:2px;top:1px;font-size:7.5px;font-weight:700;color:var(--rc);text-decoration:none}
.sl.e{background:#eef2ec;box-shadow:inset 0 0 0 1px #d4ddd4}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cap{display:flex;align-items:center;gap:6px;font-size:9.5px;margin-bottom:5px}.cap .t{flex:1;height:6px;border-radius:3px;background:#dfe8e0;overflow:hidden}.cap i{display:block;height:100%;background:linear-gradient(90deg,var(--gd),#e8c870)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--ln);font-size:10px}.kv span{color:var(--tx2)}
.st2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.tg{display:inline-block;font-size:8px;font-weight:600;padding:0 4px;border-radius:4px;background:#e6f0ea;color:var(--jd2);white-space:nowrap}.tg.g{background:#f6edd2;color:var(--gd2)}.tg.r{background:#f8e0dc;color:var(--rd)}
/* nhân vật */
.doll{display:grid;grid-template-columns:50px 1fr 50px;gap:4px;align-items:center}
.doll .col{display:grid;gap:7px}.doll .sl{width:48px}
.lbl{font-size:8px;text-align:center;color:var(--tx2);margin-top:1px}
.dm{position:relative;height:270px;border-radius:14px;background:radial-gradient(circle at 50% 60%,#fff,rgba(255,255,255,0) 65%),url(assets/dd-thac.webp) center/cover;box-shadow:inset 0 0 0 1.5px #e6d7a8;overflow:hidden}
.dm img.h{position:absolute;left:0;right:0;bottom:22px;width:100%;height:82%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(14,42,36,.4))}
.dm img.d{position:absolute;left:8%;right:8%;bottom:0;width:84%}
.dm .tag{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:rgba(251,250,243,.94);border:1px solid var(--gd);border-radius:10px;padding:0 10px;font-weight:700;color:var(--gd2);white-space:nowrap}
.roots .r{display:flex;align-items:center;gap:6px;margin:4px 0}.roots b{width:34px;font-family:Prata}.roots .t{flex:1;height:8px;border-radius:4px;background:#dfe8e0;overflow:hidden}.roots i{display:block;height:100%}
/* công pháp cây */
.tree{position:relative;width:100%;max-width:340px;aspect-ratio:1/1.02;margin:4px auto;border-radius:16px;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%)}
.tree .ln{position:absolute;inset:0;background:linear-gradient(var(--gd),var(--gd)) 50% 14%/2px 78% no-repeat,linear-gradient(90deg,var(--gd),var(--gd)) 50% 34%/68% 2px no-repeat,linear-gradient(90deg,var(--gd),var(--gd)) 50% 71%/68% 2px no-repeat,linear-gradient(var(--gd),var(--gd)) 16% 52%/2px 37% no-repeat,linear-gradient(var(--gd),var(--gd)) 84% 52%/2px 37% no-repeat;opacity:.55}
.gn{position:absolute;width:23%;transform:translate(-50%,-50%);text-align:center;font-size:8.5px;font-weight:600}
.gn .c{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:Prata;font-size:24px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4);background:radial-gradient(circle at 38% 32%,#fff8,var(--c) 45%,color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--gd),0 4px 10px rgba(14,42,36,.35)}
.gn .c em{position:absolute;right:-4px;bottom:-2px;font:700 8px Lexend;font-style:normal;background:var(--cr);color:var(--gd2);border:1px solid var(--gd);border-radius:6px;padding:0 3px;text-shadow:none}
.gn small{display:block;margin-top:5px;background:rgba(251,250,243,.95);border:1px solid #e6d7a8;border-radius:6px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn.mid .c{background:radial-gradient(circle at 40% 35%,#3a6a5a,#0e2a24);font-size:18px}
.load{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:8px;margin-bottom:8px}
.load button{width:48px;text-align:center;font-size:8px}
.load img{width:44px;height:44px;margin:0 auto 1px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--gd)}
.load .e{width:44px;height:44px;margin:0 auto 1px;border-radius:50%;border:1.5px dashed var(--gd);display:grid;place-items:center;font-size:18px;color:var(--gd2)}
.skr{display:flex;gap:7px;align-items:center;padding:5px 6px;margin-bottom:5px}
.skr>img{width:42px;height:42px;flex:none;border-radius:50%;box-shadow:0 0 0 1.5px var(--gd)}
.skr .tx{flex:1;min-width:0}.skr b{font-size:11px}.skr p{font-size:9px;color:var(--tx2)}
/* tọa kỵ */
.mst{position:relative;height:200px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 85%,#fff,rgba(255,255,255,0) 55%),url(assets/dd-thanh-son.webp) center/cover;box-shadow:inset 0 0 0 1.5px #e6d7a8}
.mst img{position:absolute;left:10%;right:10%;bottom:10px;width:80%;height:78%;object-fit:contain;animation:fl 3s ease-in-out infinite}
.mst b{position:absolute;right:8px;top:8px;writing-mode:vertical-rl;font-family:Prata;font-size:17px;background:rgba(251,250,243,.94);border:1px solid var(--gd);border-radius:8px;padding:6px 2px;letter-spacing:2px}
.mst .rk{position:absolute;left:8px;top:8px}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0}
.mrow button{position:relative;aspect-ratio:4/3;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--ln);padding:4px}
.mrow button.on{box-shadow:inset 0 0 0 2px var(--gd),0 0 8px rgba(196,154,62,.4)}
.mrow button.lk img{filter:grayscale(1) opacity(.45)}.mrow button.lk::after{content:'🔒';position:absolute;right:3px;top:1px;font-size:9px}
/* môn phái */
.smap{position:relative;height:380px;border-radius:14px;overflow:hidden;background:url(assets/dd-thac.webp) center/cover;box-shadow:inset 0 0 0 1.5px #e6d7a8}
.smap::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.15),rgba(14,42,36,.15))}
.sb{position:absolute;z-index:1;width:84px;transform:translate(-50%,-50%);text-align:center}
.sb img{width:84px;height:84px;filter:drop-shadow(0 6px 5px rgba(14,42,36,.4))}
.sb span{display:inline-block;margin-top:-10px;position:relative;background:linear-gradient(#fffdf5,#f1ead3);border:1px solid var(--gd);border-radius:8px;padding:0 6px;font-size:9px;font-weight:600;white-space:nowrap}
.row{display:flex;gap:7px;align-items:center;padding:5px 6px;margin-bottom:5px}
.row .tx{flex:1;min-width:0}.row b{font-size:11px}.row small{display:block;font-size:9px;color:var(--tx2)}
.por{width:40px;height:40px;flex:none;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fff,#d8e6dc);box-shadow:inset 0 0 0 1.5px var(--gd)}
.por img{width:150%;max-width:none;margin:-2px 0 0 -25%}
.tbar{height:5px;border-radius:3px;background:#dfe8e0;overflow:hidden;margin-top:2px}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--jd),#7ad0b0)}
/* động phủ */
.bg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bd{padding:6px;text-align:center}
.bd img{width:84px;height:84px;margin:0 auto}
.bd b{display:block;font-family:Prata;font-size:12.5px}
.bd small{display:block;font-size:9px;color:var(--tx2)}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;border-radius:12px;background:url(assets/dd-ha-lam.webp) center/cover;box-shadow:inset 0 0 0 1.5px #e6d7a8}
.plot{position:relative;aspect-ratio:1;border-radius:10px;background:radial-gradient(ellipse at 50% 70%,#8a6a42,#5a3e22 70%);box-shadow:inset 0 -5px 8px rgba(0,0,0,.35),0 0 0 2px #fff8;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px;color:#fff;font-size:8.5px;font-weight:600;text-shadow:0 1px 2px #000}
.plot img{width:60%;margin:8% auto auto}
.plot.rd{box-shadow:inset 0 -5px 8px rgba(0,0,0,.35),0 0 0 2px var(--gd),0 0 10px rgba(196,154,62,.6)}
.plot.e::before{content:'+';position:absolute;top:26%;font-size:22px}.plot.lk::before{content:'🔒';position:absolute;top:30%;font-size:15px}
/* lịch luyện: đường bí cảnh */
.path{position:relative;padding:6px 0}
.path::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--gd)}
.dn{position:relative;display:flex;align-items:center;gap:8px;width:66%;margin-bottom:12px;padding:5px;text-align:left}
.dn:nth-child(odd){margin-left:auto;flex-direction:row-reverse;text-align:right}
.dn .th{width:58px;height:58px;flex:none;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--gd)}
.dn .tx{flex:1;min-width:0}.dn b{font-family:Prata;font-size:12px;display:block}.dn small{font-size:9px;color:var(--tx2);display:block}
.dn.lk{opacity:.55;filter:grayscale(.9)}
.dn.cur .th{animation:pulse 1.6s infinite}@keyframes pulse{50%{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--gd),0 0 0 8px rgba(47,143,116,.25)}}
/* chiến đấu */
.cb{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;background:#0e2a24}
.cb.on{display:flex}
.cbh{display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(#fbfaf3,#ecf2ec);border-bottom:2px solid var(--gd)}
.cbh b{flex:1;font-family:Prata;font-size:15px}

 sk:n=>{const s=SK.find(x=>x.n===n);sh(s.n,`<div class="ih"><img src="${I(s.i)}" style="width:64px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--gd)"><div><b>${s.n}</b>Cấp ${s.lv}/10 · Hồi chiêu ${s.cd} hiệp</div></div><p style="color:var(--tx2)">${s.d}</p><div class="kv"><span>Nâng cấp cần</span><b>Bí tịch x${s.lv+1}</b></div>`,`<button class="btn j" onclick="closeS();toast('${s.on?'Đã gỡ':'Đã lắp'} chiêu')">${s.on?'Gỡ':'Lắp'} chiêu</button><button class="btn" onclick="closeS();toast('Nâng cấp thành công')">Nâng cấp</button>`)},
 tay:()=>sh('Tẩy Linh Căn',`<p>Dùng Tẩy Tủy Dịch để ngẫu nhiên lại 5 linh căn.</p>`,ok('Linh căn đã thay đổi','Tẩy')),
 cuonghoa:()=>sh('Cường Hóa',`<div class="ih">${sl(it('Thanh Phong Kiếm'),0)}<div><b>Thanh Phong Kiếm +7 → +8</b>Công +1.240 → +1.364</div></div><div class="kv"><span>Tiêu hao</span><b>Huyền Thiết x6</b></div><div class="kv"><span>Tỉ lệ</span><b>75%</b></div>`,ok('Cường hóa thành công!','Cường hóa')),
 khamngoc:()=>sh('Khảm Ngọc',`<div class="g6" style="grid-template-columns:repeat(4,1fr)">${sl(it('Huyết Ngọc'),0)}<div class="sl e"></div><div class="sl e"></div><div class="sl e"></div></div><p style="margin-top:6px;color:var(--tx2)">Mỗi trang bị có 4 lỗ khảm. Lỗ thứ 2 mở ở cường hóa +10.</p>`),
 nangky:()=>sh('Nâng Cấp Tọa Kỵ',`<p>Dùng <b>Lông Tiên Hạc x5</b> để nâng tọa kỵ lên bậc tiếp theo.</p>`,ok('Tọa kỵ lên bậc!','Nâng cấp')),
 huanluyen:()=>sh('Huấn Luyện',`<p>Huấn luyện tọa kỵ 4 giờ, nhận 1.200 điểm thuần thục.</p>`,ok('Bắt đầu huấn luyện','Bắt đầu')),
 morong:()=>sh('Mở rộng túi',`<p>Mở thêm 10 ô với giá 100 Tiên Ngọc.</p>`,ok('Đã mở rộng túi','Mở rộng')),
 gieo:()=>sh('Gieo hạt',`<div class="g6" style="grid-template-columns:repeat(4,1fr)">${['Linh Chi Nghìn Năm','Huyết Sâm','Băng Tâm Thảo','Long Tiên Hoa'].map(n=>sl(it(n))).join('')}</div>`,ok('Đã gieo hạt','Gieo')),
 dun:i=>{const d=DUN[i];if(d[3]==='Khóa')return sh(d[0],`<div class="mst" style="height:130px;background:url(${I(d[1])}) center/cover;filter:grayscale(.7)"></div><p style="text-align:center;margin-top:6px">🔒 Cần đạt cảnh giới <b>${d[2]}</b> để mở bí cảnh này.</p>`);
  sh(d[0],`<div class="mst" style="height:130px;background:url(${I(d[1])}) center/cover"></div><div class="kv"><span>Yêu cầu</span><b>${d[2]}</b></div><div class="kv"><span>Lượt hôm nay</span><b>2/3</b></div><div class="h3">Có thể rơi</div><div class="g6">${['Thanh Phong Kiếm','Linh Chi Nghìn Năm','Linh Thạch Thượng Phẩm','Rương Bí Cảnh'].map(n=>sl(it(n),0)).join('')}</div>`,`<button class="btn j" onclick="closeS();toast('Quét nhanh xong, nhận 3 vật phẩm')">Quét nhanh</button><button class="btn" onclick="combat('mo-huyet-ma','Thủ Vệ ${d[0]}')">Tiến vào</button>`)}
};
function S(k,a){SS[k](a)}
// ---------- CHIẾN ĐẤU THEO LƯỢT ----------
let eh,ph2,rd,EN;
function combat(img='mo-huyet-ma',name='Huyết Ma Lão Tổ'){closeS();eh=120000;ph2=84598;rd=1;EN=name;
 $('cb').innerHTML=`<div class="cbh"><button class="x" onclick="$('cb').classList.remove('on')">←</button><b class="one">Chiến Đấu</b><button class="btn s j" onclick="toast('Đã bật tự động')">Tự động ▶</button></div>
 <div class="arena"><div class="fs e" id="fe"><div class="hpb"><b>${name}</b> · Kết Đan 5<div class="t"><i id="eh" style="width:100%"></i></div></div><img src="${I(img)}"></div><div class="round" id="rd">Hiệp 1 / 30</div>
 <div class="fs p"><img src="${I('nv-nam')}"><div class="hpb"><b>Lâm Thanh Vân</b> · Kết Đan 3<div class="t"><i id="ph" style="width:100%"></i></div></div></div></div>
 <div class="cbar">${SK.filter(s=>s.on).slice(0,5).map(s=>`<button onclick="hit('${s.n}')"><img src="${I(s.i)}"><span class="one" style="display:block">${s.n.split(' ').slice(0,2).join(' ')}</span></button>`).join('')}</div>
 <div class="clog" id="clog">Trận đấu bắt đầu. Chọn chiêu thức để ra đòn.</div>`;$('cb').classList.add('on')}
function hit(n){if(eh<=0)return;const d=18000+Math.random()*14000|0,r=3000+Math.random()*5000|0;eh=Math.max(0,eh-d);ph2=Math.max(1,ph2-r);
 $('eh').style.width=eh/1200+'%';$('ph').style.width=ph2/845.98+'%';const fe=$('fe');fe.classList.remove('hit');void fe.offsetWidth;fe.classList.add('hit');setTimeout(()=>fe.classList.remove('hit'),150);
 $('cb').querySelector('.arena').insertAdjacentHTML('beforeend',`<div class="dmg">-${fmt(d)}</div>`);setTimeout(()=>$('cb').querySelector('.dmg')?.remove(),900);
 $('clog').insertAdjacentHTML('afterbegin',`<div>[Hiệp ${rd}] <u>Lâm Thanh Vân</u> thi triển <b>${n}</b>, gây ${fmt(d)} sát thương. ${EN} phản đòn ${fmt(r)}.</div>`);rd++;$('rd').textContent=`Hiệp ${rd} / 30`;
 if(eh<=0)setTimeout(()=>sh('Chiến Thắng',`<p style="text-align:center;font-family:Prata;font-size:15px;color:var(--jd2)">Đánh bại ${EN} sau ${rd-1} hiệp!</p><div class="h3">Phần thưởng</div><div class="g6">${['Kết Kim Đan','Linh Chi Nghìn Năm','Linh Thạch Thượng Phẩm','Rương Bí Cảnh'].map(n=>sl(it(n))).join('')}</div>`,`<button class="btn j" onclick="combat()">Đánh lại</button><button class="btn" onclick="closeS();$('cb').classList.remove('on')">Rời trận</button>`),450)}
drawNav('home');
</script></body></html>
