<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tông Môn Chí</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Prata&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--tx:#18352f;--tx2:#4f6f66;--jd:#2f8f74;--jd2:#1c5a48;--gd:#c49a3e;--gd2:#8a6420;--cr:#fbfaf3;--ln:#d9e3da;--rd:#c0392b;--bl:#2f6fb0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0e2a24;font:400 10.5px/1.35 Lexend,sans-serif;color:var(--tx);display:flex;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%;user-select:none;-webkit-user-drag:none}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-family:Prata,serif;font-weight:400}
.app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;overflow:hidden;background:#cfe0d8}
@media(min-width:520px){.app{height:min(932px,100vh);margin:auto 0;border-radius:22px;box-shadow:0 0 0 8px #071712,0 30px 80px #000}}
.jf{border:14px solid transparent;border-image:url(assets/ui-b-khung.webp) 64 fill / 14px stretch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:26px;padding:0 10px;border:9px solid transparent;border-image:url(assets/ui-b-nut.webp) 30 38 fill / 9px 13px stretch;font-weight:600;font-size:10.5px;color:#4a2e06;white-space:nowrap}
.btn.j{border-image-source:url(assets/ui-b-nut2.webp);color:#0e3a2c}
.btn.s{height:21px;font-size:9.5px;padding:0 4px}
.btn:active{transform:translateY(1px);filter:brightness(.95)}
.ic{width:100%;height:100%;object-fit:contain}
/* ===== HOME ===== */
.home{position:absolute;inset:0;background:url(assets/dp-ngay.webp) center 30%/cover}
.home::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.25),transparent 18%,transparent 70%,rgba(14,42,36,.5));pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:6px 6px 0}
.sect{display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,rgba(251,250,243,.96),rgba(251,250,243,.82));border:1px solid #e6d7a8;border-radius:12px;padding:4px 6px;box-shadow:0 2px 6px rgba(14,42,36,.2)}
.emb{width:38px;height:38px;flex:none;border-radius:50%;background:radial-gradient(#fff,#e8f1ea);box-shadow:0 0 0 2px var(--gd),0 0 0 3px #fff;padding:4px}
.sect .tx{flex:1;min-width:0}.sect b{font-family:Prata;font-size:14px;display:block;line-height:1.1}.sect small{font-size:9px;color:var(--tx2)}
.lvb{display:flex;align-items:center;gap:4px;margin-top:2px}.lvb .t{flex:1;height:5px;border-radius:3px;background:#dfe9e2;overflow:hidden}.lvb i{display:block;height:100%;width:64%;background:linear-gradient(90deg,var(--jd),#7ad0b0)}
.pw{text-align:right;line-height:1.15}.pw b{font-size:13px;color:var(--gd2)}.pw small{display:block;font-size:8.5px;color:var(--tx2)}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:4px}
.res button{display:flex;align-items:center;gap:2px;background:rgba(14,42,36,.72);color:#f2f7ee;border-radius:10px;padding:1px 4px 1px 1px;font-size:9px;font-weight:600;min-width:0}
.res img{width:16px;height:16px;flex:none}.res span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl{position:absolute;transform:translate(-50%,-50%);z-index:3;width:82px;text-align:center}
.bl>img{width:82px;height:82px;filter:drop-shadow(0 6px 5px rgba(14,42,36,.4));transition:transform .15s}
.bl:active>img{transform:scale(.95)}
.bl .pl{display:inline-flex;align-items:center;gap:2px;margin-top:-10px;position:relative;background:linear-gradient(#fffdf5,#f1ead3);border:1px solid var(--gd);border-radius:8px;padding:0 5px;font-size:9px;font-weight:600;white-space:nowrap;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.bl .pl em{font-style:normal;color:#fff;background:var(--jd);border-radius:5px;padding:0 3px;font-size:8px}
.bub{position:absolute;right:2px;top:-2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--jd),0 2px 4px rgba(0,0,0,.3);padding:3px;animation:hop 1.4s infinite}
.bub.w{box-shadow:0 0 0 2px var(--gd)}@keyframes hop{50%{transform:translateY(-3px)}}
.news{position:absolute;left:6px;top:94px;z-index:5;width:176px;max-height:70px;overflow:hidden;transition:max-height .25s;background:rgba(251,250,243,.92);border-radius:10px;border:1px solid #e6d7a8;padding:5px 6px;box-shadow:0 2px 6px rgba(14,42,36,.2)}
.news.open{max-height:200px}.news h4{cursor:pointer;display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--jd2);margin-bottom:2px}
.nw{display:flex;gap:5px;align-items:center;padding:3px 0;border-top:1px dashed var(--ln);width:100%;text-align:left}
.nw img{width:22px;height:22px;flex:none;border-radius:50%;background:#eaf2ec}
.nw span{flex:1;min-width:0;font-size:9px;line-height:1.2}.nw b{color:var(--jd2)}
.qk{position:absolute;right:6px;top:96px;z-index:5;display:grid;gap:5px}
.qb{width:44px;text-align:center;font-size:8.5px;font-weight:600;color:#fff;text-shadow:0 1px 2px #0e2a24}
.qb i{position:relative;display:block;width:40px;height:40px;margin:0 auto;border-radius:12px;padding:5px;background:linear-gradient(#fffdf5,#e9f1eb);box-shadow:0 0 0 1.5px var(--gd),0 3px 5px rgba(14,42,36,.35)}
.qb i.n::after{content:attr(data-n);position:absolute;right:-4px;top:-4px;min-width:14px;height:14px;border-radius:7px;background:var(--rd);color:#fff;font-size:8px;line-height:14px;font-style:normal;padding:0 3px;box-shadow:0 0 0 1.5px #fff}
.ev{position:absolute;left:6px;bottom:78px;z-index:5;display:flex;gap:5px}
.ev button{display:flex;align-items:center;gap:4px;background:linear-gradient(90deg,#1c5a48ee,#2f8f74cc);color:#fff;border-radius:16px;padding:2px 9px 2px 2px;font-size:9px;font-weight:600;box-shadow:0 0 0 1px #e6d7a8}
.ev img{width:26px;height:26px;border-radius:50%;background:#fff}
.ev small{display:block;font-size:8px;opacity:.85;font-weight:400}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px 8px;background:linear-gradient(#fbfaf3,#ecf2ec);border-top:2px solid var(--gd);box-shadow:0 -4px 12px rgba(14,42,36,.25)}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;font-size:9.5px;font-weight:600;color:var(--tx2)}
.nv i{width:34px;height:34px;padding:2px;display:block;transition:.15s}
.nv.on{color:var(--jd2)}.nv.on i{transform:translateY(-8px) scale(1.18);filter:drop-shadow(0 4px 3px rgba(14,42,36,.35))}
.nv.on::before{content:'';position:absolute;top:-12px;width:50px;height:50px;border-radius:50%;background:radial-gradient(#fff,#f1ead3);box-shadow:0 0 0 2px var(--gd);z-index:-1}
.nv em{position:absolute;right:12px;top:0;width:8px;height:8px;border-radius:50%;background:var(--rd);box-shadow:0 0 0 1.5px #fff}
/* ===== PAGES ===== */
.page{position:absolute;inset:0 0 56px;z-index:10;background:linear-gradient(#eef4ef,#e3ece5);display:none;flex-direction:column}
.page.on{display:flex}
.pgh{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;background:linear-gradient(#fbfaf3,#f1f5ef);border-bottom:1px solid #e6d7a8}
.pgh h2{flex:1;font-family:Prata;font-size:17px;min-width:0;line-height:1.05}.pgh h2 small{display:block;font:400 9px Lexend;color:var(--tx2)}
.pgh .rs{display:flex;gap:4px;font-size:9px;font-weight:600}.pgh .rs span{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:0 5px 0 1px}.pgh .rs img{width:15px;height:15px}
.seg{display:flex;gap:4px;padding:6px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.seg button{flex:none;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;color:var(--tx2);background:#fff;border:1px solid var(--ln)}
.seg button.on{color:#fff;background:linear-gradient(var(--jd),var(--jd2));border-color:var(--jd2)}
.pb{flex:1;overflow:auto;padding:4px 10px 12px}
.h3{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:Prata;font-size:12.5px;color:var(--jd2);margin:8px 0 5px}
.h3 small{font:400 9px Lexend;color:var(--tx2)}
.card{background:var(--cr);border:1px solid #e3e9e0;border-radius:10px;box-shadow:0 1px 2px rgba(14,42,36,.08)}
/* disciple rows */
.dr{display:flex;gap:7px;align-items:center;padding:5px 6px;margin-bottom:5px;width:100%;text-align:left}
.por{position:relative;width:44px;height:44px;flex:none;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fff,#d8e6dc);box-shadow:inset 0 0 0 1.5px var(--rc,var(--gd))}
.por img{width:150%;max-width:none;margin:-2px 0 0 -25%}
.por b{position:absolute;left:0;bottom:0;font-size:7.5px;color:#fff;background:var(--rc,var(--gd));padding:0 3px;border-radius:0 5px 0 0}
.dr .tx{flex:1;min-width:0}.dr .nm{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600}
.tg{display:inline-block;font-size:8px;font-weight:600;padding:0 4px;border-radius:4px;background:#e6f0ea;color:var(--jd2);white-space:nowrap}
.tg.g{background:#f6edd2;color:var(--gd2)}.tg.r{background:#f8e0dc;color:var(--rd)}.tg.b{background:#dfeaf6;color:var(--bl)}
.dr .ln{display:flex;gap:4px;margin-top:2px;flex-wrap:nowrap;overflow:hidden}
.dr .st{text-align:right;flex:none;font-size:9px;color:var(--tx2)}.dr .st b{display:block;font-size:11px;color:var(--gd2)}
.roots{display:flex;gap:1px}.roots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
/* detail */
.dhero{position:relative;height:190px;background:url(assets/dd-thac.webp) center/cover;border-radius:12px;overflow:hidden}
.dhero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,42,36,.65),transparent 55%)}
.dhero img{position:absolute;right:-6px;bottom:-4px;height:104%;width:auto;max-width:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.dhero .info{position:relative;padding:8px 10px;color:#fff;width:58%}
.dhero .info>b{font-family:Prata;font-size:18px;display:block;line-height:1.1}
.dhero .info small{font-size:9px;opacity:.9}
.dhero .pwr{display:inline-block;margin-top:4px;font-weight:700;font-size:12px;background:rgba(0,0,0,.35);border:1px solid var(--gd);border-radius:8px;padding:0 6px;color:#ffe9a8}
.dst{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;margin-top:6px;font-size:9px}
.dst div{display:flex;justify-content:space-between;gap:2px}.dst b{font-weight:600}
.eq{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.sl{position:relative;aspect-ratio:1;border-radius:8px;padding:4px;background:radial-gradient(circle at 50% 35%,#fff,color-mix(in srgb,var(--rc,#9aa) 22%,#f4f6f0));box-shadow:inset 0 0 0 1.5px var(--rc,#cfd8d0),0 1px 2px rgba(14,42,36,.12)}
.sl em{position:absolute;right:2px;bottom:0;font-style:normal;font-size:8.5px;font-weight:700;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.sl.e{background:#eef2ec;box-shadow:inset 0 0 0 1px #d4ddd4}
.sl.e span{position:absolute;inset:0;display:grid;place-items:center;font-size:8px;color:#9aaba2}
.sl u{position:absolute;left:2px;top:1px;font-size:7.5px;font-weight:700;color:var(--rc);text-decoration:none}
.lbl{font-size:8px;text-align:center;color:var(--tx2);margin-top:1px}
.skr{display:flex;gap:6px;align-items:center;padding:5px 6px;margin-bottom:5px}
.skr img{width:38px;height:38px;flex:none;border-radius:50%;box-shadow:0 0 0 1.5px var(--gd)}
.skr .tx{flex:1;min-width:0}.skr b{font-size:11px}.skr p{font-size:9px;color:var(--tx2)}
.pip{display:flex;gap:1px;margin-top:2px}.pip i{width:10px;height:4px;border-radius:2px;background:#dfe8e0}.pip i.f{background:var(--jd)}
/* bag */
.cap{display:flex;align-items:center;gap:6px;font-size:9.5px;margin-bottom:5px}.cap .t{flex:1;height:6px;border-radius:3px;background:#dfe8e0;overflow:hidden}.cap i{display:block;height:100%;background:linear-gradient(90deg,var(--gd),#e8c870)}
.bg5{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
/* library */
.lib{display:flex;gap:7px;align-items:center;padding:6px;margin-bottom:5px}
.lib>img{width:40px;height:40px;flex:none}
.lib .tx{flex:1;min-width:0}.lib b{font-size:11px}.lib small{display:block;font-size:9px;color:var(--tx2)}
.who{display:flex}.who img{width:16px;height:16px;border-radius:50%;margin-left:-4px;box-shadow:0 0 0 1px #fff;background:#e8f0ea;object-fit:cover;object-position:50% 15%}
.tree{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:6px 4px}
.tn{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:8.5px;font-weight:600}
.tn i{width:44px;height:44px;border-radius:12px;padding:6px;background:linear-gradient(#fff,#eef4ef);box-shadow:0 0 0 1.5px var(--c,var(--gd));display:block;margin-bottom:2px}
.tn.lk{opacity:.45;filter:grayscale(1)}.tn.ok i{background:linear-gradient(#fff9e6,#f1e2b4)}
.tn small{font-weight:400;color:var(--tx2);font-size:8px}
.tn:not(:nth-child(4n))::after{content:'';position:absolute;top:22px;left:calc(50% + 24px);width:calc(100% - 40px);height:2px;background:var(--ln)}
.tn.ok:not(:nth-child(4n))::after{background:var(--gd)}
/* expedition map */
.emap{position:relative;height:300px;border-radius:12px;overflow:hidden;background:url(assets/map-xuan.webp) 40% 40%/240%;box-shadow:inset 0 0 0 2px var(--gd)}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin i{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(#fff,#f1ead3);box-shadow:0 0 0 2px var(--c,var(--jd)),0 3px 5px rgba(0,0,0,.35);display:grid;place-items:center}
.pin i img{width:24px;height:24px;transform:rotate(45deg)}
.pin span{margin-top:4px;font-size:8.5px;font-weight:600;background:rgba(251,250,243,.95);border-radius:6px;padding:0 5px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.pin.lk i{filter:grayscale(1);opacity:.6}.pin.go i{animation:hop 1.4s infinite}
.exp{display:flex;gap:6px;align-items:center;padding:6px;margin-top:6px}
.exp .tx{flex:1;min-width:0}.exp b{font-size:11px}.exp small{display:block;font-size:9px;color:var(--tx2)}
.tbar{height:5px;border-radius:3px;background:#dfe8e0;overflow:hidden;margin-top:2px}.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--jd),#7ad0b0)}
/* formation */
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:180px}
.fc{position:relative;aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1.5px #c8d6cc;overflow:hidden}
.fc img{width:130%;max-width:none;margin:-4px 0 0 -15%}
.fc.e{display:grid;place-items:center;color:#9aaba2;font-size:16px}
.fc b{position:absolute;left:2px;bottom:1px;font-size:7.5px;color:#fff;background:rgba(14,42,36,.7);border-radius:4px;padding:0 3px}
/* battle */
.bt{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;background:#0e2a24}
.bt.on{display:flex}
.arena{position:relative;flex:1;background:url(assets/dd-thanh-son.webp) center/cover;overflow:hidden}
.arena::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(14,42,36,.4),transparent 30%,transparent 70%,rgba(14,42,36,.7))}
.btop{position:relative;display:flex;align-items:center;gap:6px;padding:6px 8px;color:#fff}
.btop b{font-family:Prata;font-size:14px;flex:1}
.wave{font-size:9px;background:rgba(0,0,0,.4);border-radius:8px;padding:1px 7px;border:1px solid var(--gd)}
.sides{position:absolute;left:0;right:0;top:40px;bottom:10px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.side{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 4px;width:47%}
.u{position:relative;text-align:center}
.u .pc{position:relative;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:radial-gradient(#fff9,#fff0 70%);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--c,var(--jd)),0 4px 6px rgba(0,0,0,.4)}
.u .pc img{width:150%;max-width:none;margin:-6% 0 0 -25%}
.side.e .u .pc{--c:var(--rd)}
.u .hp{height:4px;border-radius:2px;background:rgba(0,0,0,.5);margin:3px 2px 0;overflow:hidden}.u .hp i{display:block;height:100%;background:#5ae08a;transition:width .3s}
.side.e .u .hp i{background:#ff6a5a}
.u.dead{opacity:.25;filter:grayscale(1)}
.u.atk .pc{animation:lunge .3s}@keyframes lunge{50%{transform:translateX(10px) scale(1.08)}}
.side.e .u.atk .pc{animation:lunge2 .3s}@keyframes lunge2{50%{transform:translateX(-10px) scale(1.08)}}
.u.hit .pc{animation:hitf .3s}@keyframes hitf{50%{filter:brightness(2.4) saturate(0)}}
.u .dm{position:absolute;left:50%;top:0;font-weight:700;font-size:13px;color:#fff;text-shadow:0 0 3px #c0392b,0 1px 0 #000;animation:up .7s forwards;pointer-events:none;white-space:nowrap}
@keyframes up{from{transform:translate(-50%,0)}to{transform:translate(-50%,-26px);opacity:0}}
.ult{display:flex;justify-content:center;gap:6px;padding:6px;background:linear-gradient(#123a30,#0e2a24)}
.ub{width:58px;text-align:center;font-size:8px;color:#dff0e6}
.ub .r{position:relative;width:50px;height:50px;margin:0 auto 2px;border-radius:50%;padding:3px;background:conic-gradient(#ffd060 var(--p,0%),rgba(255,255,255,.15) 0)}
.ub .r div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#d8e6dc}
.ub .r div img{width:150%;max-width:none;margin:-4px 0 0 -25%}
.ub.rd .r{box-shadow:0 0 12px #ffd060;animation:hop 1s infinite}
.ub .sk{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 1.5px #fff}
.blog{height:66px;overflow:auto;padding:4px 10px;background:#0a201b;color:#bcd6cb;font-size:9px;line-height:1.45}
.blog b{color:#ffd88a}.blog u{color:#ff9a8a;text-decoration:none}
.bbar{display:flex;gap:6px;padding:6px 8px 8px;background:#0a201b;justify-content:space-between}
/* sheet */
.sh{position:absolute;inset:0;z-index:60;background:rgba(14,42,36,.55);display:none;align-items:flex-end}
.sh.on{display:flex}
.shb{width:100%;max-height:86%;display:flex;flex-direction:column;background:linear-gradient(#fbfaf3,#eef4ef);border-radius:18px 18px 0 0;border-top:2px solid var(--gd);animation:upx .22s}
@keyframes upx{from{transform:translateY(40px);opacity:0}}
.shh{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.shh b{flex:1;font-family:Prata;font-size:16px;min-width:0}
.x{width:26px;height:26px;border-radius:50%;background:#e6eee8;font-weight:700;color:var(--tx2);flex:none}
.shc{overflow:auto;padding:0 12px 8px}
.sha{display:flex;gap:6px;justify-content:flex-end;padding:8px 12px 12px;border-top:1px solid var(--ln);flex-wrap:wrap}
.ih{display:flex;gap:10px;align-items:center;margin-bottom:6px}.ih .sl{width:60px;flex:none}.ih b{font-size:14px;display:block}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--ln);font-size:10px}.kv span{color:var(--tx2)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick button{text-align:center;font-size:8.5px}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:99;padding:6px 14px;border-radius:14px;background:rgba(14,42,36,.92);color:#fff;font-weight:600;font-size:10.5px;box-shadow:0 0 0 1px var(--gd);opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}

let tm,ul,spd=1;
function prep(){closeS();sh('Bày Trận',`<div style="display:flex;gap:8px;align-items:center;justify-content:center"><div><div class="h3" style="margin-top:0">Ta</div><div class="form">${[0,1,5,2,-1,3,-1,4,-1].map(k=>k<0?'<div class="fc e">+</div>':`<div class="fc"><img src="${I(DT[k].i)}"><b>${DT[k].n.split(' ').pop()}</b></div>`).join('')}</div></div><b style="font-family:Prata;font-size:18px;color:var(--rd)">VS</b><div><div class="h3" style="margin-top:0">Địch</div><div class="form" style="width:120px">${['mo-huyet-ma','mo-u-co','mo-doc-nhan','','mo-tam-ma','','mo-kim-giap','',''].map(e=>e?`<div class="fc" style="box-shadow:inset 0 0 0 1.5px #e8a8a0"><img src="${I(e)}"></div>`:'<div class="fc e" style="opacity:.4"></div>').join('')}</div></div></div>
 <div class="kv" style="margin-top:6px"><span>Lực chiến ta</span><b>41.880</b></div><div class="kv"><span>Lực chiến địch</span><b style="color:var(--rd)">38.400</b></div><div class="kv"><span>Trận pháp</span><b>Thất Tinh Kiếm Trận</b></div>`,`<button class="btn j" onclick="toast('Tự xếp đội mạnh nhất')">Tự xếp</button><button class="btn" onclick="battle()">Xuất chiến</button>`)}
const A=[0,1,5,2,3,4],E=['mo-huyet-ma','mo-u-co','mo-doc-nhan','mo-tam-ma','mo-kim-giap','mo-bang-co'];
function battle(){closeS();clearInterval(tm);ul=A.map((_,i)=>i*15);
 $('bt').innerHTML=`<div class="arena"><div class="btop"><b>Huyết Sắc Cấm Địa</b><span class="wave">Đợt 1/3</span><button class="btn s j" id="spd" onclick="spd=spd==1?2:1;this.textContent='x'+spd">x1</button></div>
 <div class="sides"><div class="side">${A.map((k,i)=>`<div class="u" id="a${i}"><div class="pc"><img src="${I(DT[k].i)}"></div><div class="hp"><i style="width:100%"></i></div></div>`).join('')}</div><div class="side e">${E.map((e,i)=>`<div class="u" id="e${i}"><div class="pc"><img src="${I(e)}"></div><div class="hp"><i style="width:100%"></i></div></div>`).join('')}</div></div></div>
 <div class="ult">${A.slice(0,5).map((k,i)=>`<button class="ub" id="ub${i}" onclick="ult(${i})"><div class="r"><div><img src="${I(DT[k].i)}"></div><img class="sk" src="${I(SKL[i][1])}"></div><span class="one" style="display:block">${DT[k].n.split(' ').pop()}</span></button>`).join('')}</div>
 <div class="blog" id="blog"><b>Trận bắt đầu!</b> Thất Tinh Kiếm Trận kích hoạt: công +10%.</div>
 <div class="bbar"><button class="btn s j" onclick="clearInterval(tm);$('bt').classList.remove('on')">Rút lui</button><button class="btn s j" onclick="toast('Đã bật tự dùng tuyệt kỹ')">Tự động: Tắt</button><button class="btn s" onclick="endB(1)">Bỏ qua</button></div>`;
 $('bt').classList.add('on');const hp={a:A.map(()=>100),e:E.map(()=>100)};
 tm=setInterval(()=>{for(let s=0;s<spd;s++){const side=Math.random()<.55?'a':'e',o=side==='a'?'e':'a';const al=hp[side].map((h,i)=>h>0?i:-1).filter(i=>i>=0),tg=hp[o].map((h,i)=>h>0?i:-1).filter(i=>i>=0);if(!al.length||!tg.length)return endB(side==='a');
  const i=al[Math.random()*al.length|0],j=tg[Math.random()*tg.length|0],d=8+Math.random()*18|0;hp[o][j]=Math.max(0,hp[o][j]-d);fx(side+i,o+j,d,hp[o][j]);
  if(side==='a'){ul[i]=Math.min(100,(ul[i]||0)+20);const ub=$('ub'+i);if(ub){ub.querySelector('.r').style.setProperty('--p',ul[i]+'%');ub.classList.toggle('rd',ul[i]>=100)}}
  $('blog').insertAdjacentHTML('afterbegin',`<div>${side==='a'?`<b>${DT[A[i]].n}</b> đánh <u>${['Huyết Ma','U Cơ','Độc Nhân','Tâm Ma','Kim Giáp','Băng Cơ'][j]}</u>`:`<u>${['Huyết Ma','U Cơ','Độc Nhân','Tâm Ma','Kim Giáp','Băng Cơ'][i]}</u> đánh <b>${DT[A[j]].n}</b>`} −${d*120}</div>`)}},650);window.HP=hp}
function fx(a,b,d,h){const A1=$(a),B=$(b);if(!A1||!B)return;A1.classList.remove('atk');B.classList.remove('hit');void A1.offsetWidth;A1.classList.add('atk');B.classList.add('hit');B.querySelector('.hp i').style.width=h+'%';if(h<=0)B.classList.add('dead');B.insertAdjacentHTML('beforeend',`<span class="dm">-${fmt(d*120)}</span>`);setTimeout(()=>B.querySelector('.dm')?.remove(),700)}
function ult(i){if((ul[i]||0)<100)return toast('Tuyệt kỹ chưa đầy');ul[i]=0;$('ub'+i).classList.remove('rd');$('ub'+i).querySelector('.r').style.setProperty('--p','0%');E.forEach((_,j)=>{if(HP.e[j]>0){HP.e[j]=Math.max(0,HP.e[j]-30);fx('a'+i,'e'+j,30,HP.e[j])}});$('blog').insertAdjacentHTML('afterbegin',`<div><b>${DT[A[i]].n}</b> thi triển tuyệt kỹ <b>${SKL[i][0]}</b>!</div>`)}
function endB(win){clearInterval(tm);setTimeout(()=>sh(win?'Đại Thắng':'Thất Bại',`<p style="text-align:center;font-family:Prata;font-size:15px;color:${win?'var(--jd2)':'var(--rd)'}">${win?'Thanh Vân Tông toàn thắng!':'Đội hình bị đánh tan…'}</p><div class="bg5" style="margin-top:6px">${[IT[1],IT[7],IT[13],IT[17],IT[29]].map(x=>sl(x)).join('')}</div><div class="kv"><span>Cống hiến</span><b>+380</b></div><div class="kv"><span>MVP</span><b>Lục Tuyết Kỳ · 38% sát thương</b></div>`,`<button class="btn j" onclick="closeS();battle()">Đánh lại</button><button class="btn" onclick="closeS();$('bt').classList.remove('on')">Về tông</button>`),300)}
drawNav('home');
</script></body></html>
