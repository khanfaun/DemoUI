<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ngự Kiếm Thiên Hạ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07121d;--gl:rgba(8,20,34,.78);--ln:#2c5a7a;--cy:#62d6ff;--cy2:#1f8fc8;--am:#ffb840;--tx:#e6f2fa;--mu:#8fb0c6;--rd:#ff5a4a;--gn:#5ae08a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#02070c;font:500 11px/1.25 'Barlow Condensed',sans-serif;color:var(--tx);display:flex;justify-content:center;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%;user-select:none;-webkit-user-drag:none}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.os{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.5px}
.app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
@media(min-width:520px){.app{height:min(932px,100vh);margin:auto 0;border-radius:22px;box-shadow:0 0 0 8px #01040a,0 30px 80px #000}}
.gf{border:10px solid transparent;border-image:url(assets/ui-c-khung.webp) 48 fill / 10px stretch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:26px;padding:0 10px;border:8px solid transparent;border-image:url(assets/ui-c-nut.webp) 22 24 fill / 8px 9px stretch;font:600 11px Oswald;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.btn.a{border-image-source:url(assets/ui-c-nut2.webp);color:#2a1400}
.btn.s{height:21px;font-size:9.5px;padding:0 4px}
.btn:active{filter:brightness(1.3)}
.ic{width:100%;height:100%;object-fit:contain}
/* ===== THẾ GIỚI ===== */
.world{position:absolute;inset:0;overflow:hidden}
.ground{position:absolute;left:-60%;top:-30%;width:260%;height:160%;background:url(assets/map-dong.webp) center/cover;transition:transform .3s linear}
.world::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 40%,rgba(2,8,16,.55));pointer-events:none}
.ent{position:absolute;transform:translate(-50%,-100%);text-align:center;z-index:2}
.ent .nm{font-size:9.5px;font-weight:700;white-space:nowrap;text-shadow:0 0 3px #000,0 0 2px #000}
.ent .nm small{display:block;font-size:8px;color:var(--am);font-weight:600}
.ent .hb{width:44px;height:3px;margin:1px auto 2px;background:#0008;border-radius:2px;overflow:hidden}.ent .hb i{display:block;height:100%;background:var(--rd)}
.ent img{margin:0 auto;filter:drop-shadow(0 6px 4px rgba(0,0,0,.5))}
.ent.mob .nm{color:#ffb0a0}.ent.pl .nm{color:#9ff0c0}.ent.npc .nm{color:#ffe08a}
.ent .q{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font:700 16px Oswald;color:var(--am);text-shadow:0 0 6px #ff9a20;animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translate(-50%,-4px)}}
.me{left:50%;top:60%;z-index:3}
.me .rider{position:relative;width:96px;height:96px;animation:hover 2.4s ease-in-out infinite}
.me .rider img.s{position:absolute;left:-14px;bottom:-6px;width:124px;transform:rotate(-8deg)}
.me .rider img.c{position:absolute;left:8px;top:0;width:80px}
@keyframes hover{50%{transform:translateY(-6px)}}
.me .nm{color:#bff0ff;font-size:10.5px}
.ring{position:absolute;left:50%;top:60%;width:120px;height:36px;transform:translate(-50%,-30%);border-radius:50%;border:2px solid rgba(98,214,255,.6);box-shadow:0 0 16px rgba(98,214,255,.5);z-index:1;animation:spinr 4s linear infinite}
@keyframes spinr{50%{transform:translate(-50%,-30%) scale(1.08)}}
/* HUD */
.pf{position:absolute;left:6px;top:6px;z-index:10;display:flex;gap:5px;align-items:flex-start;width:58%}
.hexa{position:relative;width:52px;height:52px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(var(--cy),#0a3a5a);padding:2px}
.hexa div{width:100%;height:100%;clip-path:inherit;background:#0b2234 url(assets/nv-nu.webp) 50% 12%/190%}
.lvl{position:absolute;left:34px;top:38px;z-index:2;font:700 10px Oswald;background:linear-gradient(var(--am),#a8600a);color:#2a1400;padding:0 4px;border-radius:3px;box-shadow:0 0 0 1px #ffe0a0}
.pf .tx{flex:1;min-width:0}
.pf b{font:600 12px Oswald;display:flex;justify-content:space-between;gap:4px}.pf b span{color:var(--am);font-size:10px}
.hp,.mp{position:relative;height:9px;background:#000a;border:1px solid #2c5a7a;margin-top:2px;transform:skewX(-14deg);overflow:hidden}
.hp i,.mp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff8a7a,#c0201a)}.mp i{background:linear-gradient(#8ae0ff,#1a6ab0)}
.hp span,.mp span{position:absolute;inset:0;transform:skewX(14deg);font-size:8px;font-weight:700;line-height:8px;text-align:center;text-shadow:0 0 2px #000}
.buf{display:flex;gap:2px;margin-top:3px}.buf img{width:15px;height:15px;border-radius:3px;box-shadow:0 0 0 1px var(--ln)}
.mini{position:absolute;right:6px;top:6px;z-index:10;width:96px;text-align:center}
.mm{position:relative;width:88px;height:88px;margin:0 auto;border-radius:50%;background:url(assets/map-dong.webp) 46% 52%/520%;box-shadow:0 0 0 2px #0b2234,0 0 0 3.5px var(--cy2),0 4px 10px #000;overflow:hidden}
.mm i{position:absolute;width:5px;height:5px;border-radius:50%;transform:translate(-50%,-50%)}
.mm i.me{left:50%;top:50%;width:8px;height:8px;background:#fff;box-shadow:0 0 6px var(--cy)}
.mm i.r{background:var(--rd)}.mm i.g{background:var(--gn)}.mm i.y{background:var(--am)}
.mm::after{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(98,214,255,.3),transparent 25%);border-radius:50%;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mini .loc{font:600 9.5px Oswald;margin-top:3px;text-shadow:0 0 3px #000}.mini small{display:block;font-size:8.5px;color:var(--mu)}
.menu{position:absolute;right:4px;top:128px;z-index:10;display:grid;grid-template-columns:repeat(3,34px);gap:4px;transition:.2s}
.menu.off{opacity:0;pointer-events:none;transform:translateX(20px)}
.mb{position:relative;text-align:center;font-size:8px;font-weight:600;color:#cfe6f4;text-shadow:0 0 3px #000}
.mb i{display:block;width:32px;height:32px;margin:0 auto;padding:4px;border-radius:7px;background:linear-gradient(#173a55,#0a1a2a);box-shadow:inset 0 0 0 1px #3a7aa0,0 2px 4px #000}
.mb.n i::after{content:'';position:absolute;right:0;top:0;width:7px;height:7px;border-radius:50%;background:var(--rd);box-shadow:0 0 0 1px #fff}
.mtog{position:absolute;right:6px;top:100px;z-index:11;width:22px;height:22px;display:none}
.boss{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:14px;background:linear-gradient(90deg,rgba(120,20,10,.85),rgba(40,8,4,.75));box-shadow:0 0 0 1px #ff8a6a,0 0 12px rgba(255,90,74,.5);white-space:nowrap;font-size:9.5px}
.boss img{width:24px;height:24px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#000}
.boss b{font:600 10px Oswald;color:#ffd0c0}
.trk{position:absolute;left:6px;top:96px;z-index:9;width:150px;padding:0}
.trk .gf{padding:0}
.ttab{display:flex;gap:2px;margin-bottom:3px}.ttab button{flex:1;font:600 9.5px Oswald;padding:1px 0;color:var(--mu);border-bottom:1px solid transparent}.ttab button.on{color:var(--cy);border-color:var(--cy)}
.qt{display:block;width:100%;text-align:left;padding:3px 0;border-top:1px solid rgba(98,214,255,.12)}
.qt b{display:flex;gap:3px;font-size:10px;color:var(--am)}.qt b em{font-style:normal;font-size:8px;padding:0 3px;border-radius:2px;background:var(--c,#a8600a);color:#fff;flex:none}
.qt small{display:block;font-size:9px;color:#cfe6f4}.qt small u{color:var(--gn);text-decoration:none}
.chat{position:absolute;left:6px;bottom:136px;z-index:9;width:200px;max-height:58px;overflow:hidden;font-size:9.5px;line-height:1.3;background:linear-gradient(90deg,rgba(4,12,20,.72),rgba(4,12,20,0));padding:3px 4px;border-radius:4px}
.chat p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat em{font-style:normal;font-weight:700;margin-right:2px}.chat .w{color:#ffd060}.chat .g{color:#5ae08a}.chat .t{color:#62d6ff}.chat .s{color:#ff8a6a}
.joy{position:absolute;left:16px;bottom:22px;z-index:9;width:104px;height:104px;border-radius:50%;background:radial-gradient(rgba(98,214,255,.08),rgba(98,214,255,.2));box-shadow:inset 0 0 0 2px rgba(98,214,255,.35);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#cfeeff,#3a8ac0 60%,#0a3a5a);box-shadow:0 0 12px rgba(98,214,255,.6)}
.skc{position:absolute;right:8px;bottom:18px;z-index:9;width:176px;height:176px}
.sb{position:absolute;border-radius:50%;padding:0;box-shadow:0 0 0 2px #0b2234,0 0 0 3.5px var(--c,var(--cy2)),0 4px 8px #000;overflow:hidden}
.sb img{width:100%;height:100%}
.sb .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.65) var(--p,0%),transparent 0);display:grid;place-items:center;font:700 13px Oswald;text-shadow:0 0 3px #000}
.sb.atk{right:4px;bottom:4px;width:74px;height:74px;--c:var(--am)}
.sb.atk::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 18px rgba(255,184,64,.5)}
.sb.k{width:44px;height:44px}
.sb .key{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:7.5px;font-weight:700;color:#fff;text-shadow:0 0 2px #000}
.sm{position:absolute;width:34px;height:34px;border-radius:50%;background:linear-gradient(#173a55,#0a1a2a);box-shadow:0 0 0 1.5px #3a7aa0;padding:5px;font-size:7.5px;font-weight:700}
.sm span{position:absolute;left:-6px;right:-6px;bottom:-11px;text-align:center;text-shadow:0 0 3px #000}
.sm.on{box-shadow:0 0 0 1.5px var(--am),0 0 10px var(--am)}
.pot{position:absolute;right:190px;bottom:22px;z-index:9;width:36px;height:36px;border-radius:8px;background:linear-gradient(#173a55,#0a1a2a);box-shadow:0 0 0 1.5px #3a7aa0;padding:3px}
.pot em{position:absolute;right:1px;bottom:0;font-style:normal;font-size:8.5px;font-weight:700;text-shadow:0 0 2px #000}
.exp{position:absolute;left:0;right:0;bottom:0;z-index:9;height:5px;background:#000}.exp i{display:block;height:100%;width:63%;background:linear-gradient(90deg,#a8600a,var(--am),#fff0b0);box-shadow:0 0 6px var(--am)}
.exp span{position:absolute;right:4px;bottom:6px;font-size:8px;color:var(--am);text-shadow:0 0 3px #000}
/* ===== MENU TOÀN MÀN ===== */
.ov{position:absolute;inset:0;z-index:30;display:none;background:linear-gradient(rgba(3,10,18,.96),rgba(6,18,30,.97));}
.ov.on{display:flex;animation:fi .18s}@keyframes fi{from{opacity:0}}
.rail{width:52px;flex:none;display:flex;flex-direction:column;gap:2px;padding:6px 4px;background:rgba(0,0,0,.4);border-right:1px solid var(--ln);overflow:auto;scrollbar-width:none}
.rail button{position:relative;text-align:center;font-size:8px;font-weight:600;color:var(--mu);padding:3px 0;border-radius:6px}
.rail button i{display:block;width:30px;height:30px;margin:0 auto 1px;padding:3px}
.rail button.on{color:var(--cy);background:linear-gradient(90deg,rgba(98,214,255,.22),transparent)}
.rail button.on::before{content:'';position:absolute;left:-4px;top:6px;bottom:6px;width:3px;background:var(--cy);box-shadow:0 0 6px var(--cy)}
.ovm{flex:1;min-width:0;display:flex;flex-direction:column}
.ovh{display:flex;align-items:center;gap:6px;padding:8px 8px 6px;border-bottom:1px solid var(--ln)}
.ovh h2{flex:1;font:600 16px Oswald;text-transform:uppercase;letter-spacing:1px;min-width:0}
.ovh h2 small{display:block;font:500 9px 'Barlow Condensed';color:var(--mu);text-transform:none;letter-spacing:0}
.cur{display:flex;gap:4px;font-size:9.5px;font-weight:700}.cur span{display:flex;align-items:center;gap:2px;background:#000a;border:1px solid var(--ln);border-radius:8px;padding:0 5px 0 1px}.cur img{width:14px;height:14px}
.x{width:26px;height:26px;flex:none;clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%);background:linear-gradient(#a83020,#5a1008);font:700 12px Oswald}
.tabs{display:flex;gap:2px;padding:5px 8px 0;border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{flex:none;padding:4px 10px;font:600 10px Oswald;text-transform:uppercase;color:var(--mu);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);background:rgba(98,214,255,.06)}
.tabs button.on{color:#02101c;background:linear-gradient(var(--cy),var(--cy2))}
.ovb{flex:1;overflow:auto;padding:8px;scrollbar-width:thin}
.h4{display:flex;align-items:center;gap:6px;font:600 11px Oswald;text-transform:uppercase;color:var(--cy);margin:8px 0 4px;letter-spacing:.5px}
.h4::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
.h4 small{font:500 9px 'Barlow Condensed';text-transform:none;color:var(--mu)}
.cl{position:relative;aspect-ratio:1;border-radius:4px;padding:3px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rc,#567) 45%,#0a1a2a),#060e18);box-shadow:inset 0 0 0 1px var(--rc,#2c5a7a),inset 0 0 8px color-mix(in srgb,var(--rc,#567) 60%,transparent)}
.cl em{position:absolute;right:1px;bottom:0;font-style:normal;font-size:8.5px;font-weight:700;text-shadow:0 0 2px #000,0 0 2px #000}
.cl u{position:absolute;left:2px;top:0;font-size:8px;font-weight:700;color:var(--am);text-decoration:none;text-shadow:0 0 2px #000}
.cl.e{background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(98,214,255,.15)}
.cl.sel{outline:2px solid var(--am);outline-offset:1px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
/* paper doll */
.doll{display:grid;grid-template-columns:44px 1fr 44px;gap:4px;align-items:center}
.doll .col{display:grid;gap:5px}.doll .cl{width:44px}
.ped{position:relative;height:250px}
.ped::before{content:'';position:absolute;left:10%;right:10%;bottom:8px;height:34px;border-radius:50%;background:radial-gradient(rgba(98,214,255,.55),transparent 70%);box-shadow:0 0 0 1px rgba(98,214,255,.4)}
.ped img{position:absolute;inset:0 0 16px;width:100%;height:calc(100% - 16px);object-fit:contain;filter:drop-shadow(0 0 12px rgba(98,214,255,.35))}
.ped .pw{position:absolute;left:50%;top:2px;transform:translateX(-50%);font:700 14px Oswald;color:var(--am);text-shadow:0 0 8px #a8600a;white-space:nowrap}
.ped .pw small{font-size:9px;color:var(--mu);font-weight:500}
.sts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px 10px}
.sts div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(98,214,255,.08);font-size:10.5px}.sts span{color:var(--mu)}.sts b{font-weight:700}
.set{display:flex;gap:6px;align-items:center;padding:5px;margin-top:6px;border:1px solid var(--ln);border-radius:4px;background:rgba(98,214,255,.05)}
.set img{width:28px;height:28px}.set .tx{flex:1;min-width:0;font-size:9.5px}.set b{color:var(--gn)}
/* tooltip */
.tip{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.55)}
.tip.on{display:flex}
.tipb{width:100%;max-height:86%;display:flex;flex-direction:column;padding:0;animation:fi .15s}
.tipb .gf{padding:0;display:flex;flex-direction:column;min-height:0;max-height:100%}
.tph{display:flex;gap:8px;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--ln)}
.tph .cl{width:52px;flex:none}.tph b{font:600 14px Oswald;display:block}.tph small{font-size:9.5px;color:var(--mu)}
.tpc{overflow:auto;padding:6px 0;font-size:10.5px}
.tpa{display:flex;gap:6px;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--ln);flex-wrap:wrap}
.cmp{display:flex;justify-content:space-between;padding:2px 0;font-size:10.5px}.cmp .u{color:var(--gn)}.cmp .d{color:var(--rd)}
.stars{color:var(--am);letter-spacing:1px}
/* skills */
.skl{display:flex;gap:6px;align-items:center;padding:5px;border:1px solid rgba(98,214,255,.15);border-radius:4px;margin-bottom:4px;background:rgba(98,214,255,.04);width:100%;text-align:left}
.skl.on{border-color:var(--cy);background:rgba(98,214,255,.12)}
.skl img{width:40px;height:40px;flex:none;border-radius:50%;box-shadow:0 0 0 1.5px var(--c,var(--cy2))}
.skl .tx{flex:1;min-width:0}.skl b{font:600 11px Oswald;display:flex;gap:4px;align-items:center}.skl b em{font:600 8px 'Barlow Condensed';font-style:normal;color:#02101c;background:var(--cy);padding:0 3px;border-radius:2px}
.skl p{font-size:9px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skl .lv{text-align:right;font-size:9px;color:var(--mu);flex:none}.skl .lv b{display:block;font-size:12px;color:var(--am)}
.hudp{position:relative;height:120px;border:1px dashed var(--ln);border-radius:6px;margin-bottom:6px;background:rgba(0,0,0,.25)}
.hudp .sb.k{width:38px;height:38px}.hudp .sb.atk{width:56px;height:56px;right:10px;bottom:10px}
/* talent */
.tal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.br{position:relative;border:1px solid var(--ln);border-radius:6px;padding:4px 2px 6px;background:linear-gradient(rgba(98,214,255,.06),transparent)}
.br h5{font:600 10.5px Oswald;text-align:center;color:var(--c);text-transform:uppercase}
.br h5 small{display:block;font:500 8.5px 'Barlow Condensed';color:var(--mu);text-transform:none}
.br .nd{position:relative;width:40px;height:40px;margin:12px auto 0;border-radius:8px;padding:3px;background:#06101a;box-shadow:inset 0 0 0 1.5px #2c4a60}
.br .nd.on{box-shadow:inset 0 0 0 1.5px var(--c),0 0 10px color-mix(in srgb,var(--c) 60%,transparent)}
.br .nd.lk img{filter:grayscale(1) brightness(.45)}
.br .nd::before{content:'';position:absolute;left:50%;top:-13px;width:2px;height:12px;background:#2c4a60}
.br .nd.on::before{background:var(--c)}
.br .nd:first-of-type::before{display:none}
.br .nd em{position:absolute;right:-6px;bottom:-4px;font-style:normal;font-size:8px;font-weight:700;background:#000;border:1px solid var(--c);border-radius:6px;padding:0 3px}
.pts{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:10px}.pts b{color:var(--am);font:700 13px Oswald}
/* mount */
.mst{position:relative;height:220px;border-radius:8px;overflow:hidden;background:radial-gradient(ellipse at 50% 85%,rgba(98,214,255,.35),transparent 55%),url(assets/dd-tuyet.webp) center/cover}
.mst::after{content:'';position:absolute;left:15%;right:15%;bottom:14px;height:30px;border-radius:50%;border:2px solid rgba(98,214,255,.6);box-shadow:0 0 18px rgba(98,214,255,.6);animation:spinr 3s ease-in-out infinite}
.mst img{position:absolute;left:8%;right:8%;bottom:28px;width:84%;height:74%;object-fit:contain;z-index:1;animation:hover 3s ease-in-out infinite}
.mst .tag{position:absolute;left:8px;top:8px;z-index:2}.mst .tag b{font:700 18px Oswald;display:block;text-shadow:0 0 6px #000}
.mst .rot{position:absolute;right:8px;bottom:8px;z-index:2;font-size:9px;color:var(--mu)}
.msk{display:flex;gap:5px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.msk button{flex:none;width:72px;height:56px;border-radius:4px;padding:3px;background:#06101a;box-shadow:inset 0 0 0 1px var(--ln);position:relative}
.msk button.on{box-shadow:inset 0 0 0 1.5px var(--am),0 0 8px rgba(255,184,64,.4)}
.msk button.lk img{filter:grayscale(1) brightness(.5)}
.msk button span{position:absolute;left:0;right:0;bottom:1px;font-size:8px;font-weight:700;text-shadow:0 0 2px #000}
/* dungeon finder */

function raid(){closeO();closeT();bhp=100;cmb=0;clearInterval(rt);

 <div class="party">${[['nv-nu','Bạn',86],['de-tu-3','Thanh Phong',72],['de-tu-7','Lam Khê',94],['de-tu-0','Hỏa Vân',38],['de-tu-5','Hồng Liên',60]].map(p=>`<div class="pm"><img src="${I(p[0])}"><div class="tx"><span class="one" style="display:block">${p[1]}</span><div class="hb"><i style="width:${p[2]}%;${p[2]<40?'background:var(--rd)':''}"></i></div></div></div>`).join('')}</div>
 <div class="dps"><div class="gf"><b class="os" style="font-size:9px;color:var(--am)">Sát thương</b>${[['Bạn',100],['Hỏa Vân',78],['Thanh Phong',61],['Hồng Liên',40]].map(d=>`<p><i style="width:${d[1]}%"></i><span>${d[0]}</span><b>${(d[1]*0.24).toFixed(1)}M</b></p>`).join('')}</div></div>
 <div class="combo" id="combo" style="opacity:0">0<small>LIÊN KÍCH</small></div>
 <div class="ent me rme"><div class="rider"><img class="s" src="${I('mt-sword')}"><img class="c" src="${I('nv-nu')}"></div></div>

 <div class="joy" style="z-index:5"><i></i></div><div class="skc" id="rsk" style="z-index:5"></div>`;

 const P=[[86,4],[96,54],[64,96],[16,118]];$('rsk').innerHTML=`<button class="sb atk" onclick="hit(0)"><img src="${I('sk-sword')}"><span class="key">Đánh</span></button>`+SKS.map((s,i)=>`<button class="sb k" style="right:${P[i][0]}px;bottom:${P[i][1]}px;--c:${s[3]}" onclick="hit(${i+1})"><img src="${I(s[0])}"></button>`).join('');

 $('bh').style.width=(bhp%8.34)/8.34*100+'%';$('bhv').textContent=`x${Math.ceil(bhp/8.34)} · ${bhp.toFixed(1)}%`;const b=$('bimg2');b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),110);
 const c=$('combo');c.style.opacity=1;c.firstChild.textContent=cmb;$('raid').insertAdjacentHTML('beforeend',`<div class="dmn ${crit?'c':''}" style="left:${30+Math.random()*40}%;top:${22+Math.random()*20}%">${crit?'Bạo! ':''}${fmt(d)}</div>`);setTimeout(()=>$('raid').querySelector('.dmn')?.remove(),800);
 if(bhp<=0){clearInterval(rt);setTimeout(()=>tip(hd('Chiến thắng!','Thời gian 03:48 · Đánh giá S','it-ruong'),`<div class="g5">${[it('Rương Boss'),it('Tử Tinh'),it('Băng Phách Kiếm'),it('Huyết Ngọc'),it('Kinh Nghiệm Đan')].map(x=>cl(x)).join('')}</div><div class="cmp" style="margin-top:6px"><span>EXP</span><b>+8,4M</b></div><div class="cmp"><span>MVP</span><b>Mộ Dung Tuyết · 31%</b></div>`,`<button class="btn" onclick="closeT();raid()">Đánh lại</button><button class="btn a" onclick="closeT();$('raid').classList.remove('on')">Rời</button>`),400)}}
