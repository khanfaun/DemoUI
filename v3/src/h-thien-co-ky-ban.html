<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thiên Cơ Kỳ Bàn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--lac:#2a0c06;--cin:#c8301a;--gold:#e8b850;--gold2:#fff0b0;--ivo:#f4e4c0;--ink:#2a1a10;--dim:#c8a878}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#120604;font-family:'Be Vietnam Pro',sans-serif;color:var(--ivo);font-size:11px;overflow:hidden}
#app{position:relative;width:100%;max-width:430px;height:100dvh;margin:auto;overflow:hidden;background:url(assets/bg-go.webp) center/cover}
.T{font-family:'Philosopher',serif;font-weight:700;letter-spacing:.3px}
img{display:block;user-select:none;-webkit-user-drag:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.gold{color:var(--gold2);text-shadow:0 1px 0 #5a2a00,0 0 6px rgba(255,200,80,.4)}
.kh{border:16px solid transparent;border-image:url(assets/h-khung.webp) 46 fill / 16px stretch}
.nut{background:url(assets/h-nut.webp) center/100% 100%;height:34px;padding:0 18px;font-family:Philosopher;font-weight:700;font-size:13px;color:#fff6dc;text-shadow:0 1px 2px #5a0a00;white-space:nowrap}
.nut.n2{background-image:url(assets/h-nut2.webp)}.nut.sm{height:26px;font-size:11px;padding:0 12px}
.nut:active,.xu:active,.tile:active{transform:scale(.95)}
/* thanh trên */
#top{position:absolute;left:0;right:0;top:0;height:64px;padding:6px 8px;display:flex;gap:7px;align-items:center;background:linear-gradient(#1a0604ee,#1a060400)}
.ava{width:50px;height:50px;flex:none;position:relative;background:url(assets/h-xu.webp) center/100%}
.ava .f{position:absolute;inset:6px;border-radius:50%;overflow:hidden}
.ava b{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);background:var(--cin);border:1px solid var(--gold);border-radius:8px;font-size:8.5px;padding:0 5px;white-space:nowrap}
.who{flex:1;min-width:0}
.who .n{font-size:13.5px}.who .r{font-size:9.5px;color:var(--dim);white-space:nowrap}
.tv{height:6px;background:#0008;border:1px solid #8a5a20;border-radius:4px;margin-top:3px;overflow:hidden}.tv i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#ffb04a,#fff0a0)}
.res{display:grid;grid-template-columns:auto auto;gap:3px 5px}
.rp{display:flex;align-items:center;gap:3px;background:#0009;border:1px solid #6a4010;border-radius:9px;padding:1px 6px 1px 2px;font-size:9.5px;font-weight:600;white-space:nowrap}
.rp img{width:15px;height:15px}
/* bàn cờ */
#board{position:absolute;left:6px;right:6px;top:70px;aspect-ratio:1;display:grid;grid-template:repeat(6,1fr)/repeat(6,1fr);gap:3px}
.tile{position:relative;background:url(assets/h-o.webp) center/100% 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);overflow:hidden}
.tile img{width:58%;height:58%;object-fit:contain;filter:drop-shadow(0 2px 2px #0006)}
.tile span{font-size:8.5px;font-weight:700;line-height:1.05;text-align:center;max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.c{background-image:url(assets/h-o-goc.webp)}.tile.c img{width:52%;height:52%}.tile.c span{font-family:Philosopher;font-size:10px;color:#6a1006}
.tile .own{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:50%;background:var(--cin);border:1px solid var(--gold);font-size:7px;color:#fff;line-height:11px;text-align:center;font-weight:700}
.tile .tg{position:absolute;top:2px;left:3px;font-size:7px;font-weight:800;color:#a8301a}
.tile.hl{box-shadow:0 0 0 2px var(--gold),0 0 14px #ffd060;z-index:2}
.mid{grid-area:2/2/6/6;position:relative;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 2px #8a5a10,inset 0 0 30px #000c}
.mid .pic{position:absolute;inset:0;background:url(assets/bg-son-thuy.webp) center 62%/cover;filter:sepia(.35) saturate(.9)}
.mid .vig{position:absolute;inset:0;background:radial-gradient(#0000 30%,#2a0c06e0)}
.mid .ttl{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:15px}
.mid .sub{position:absolute;top:28px;left:0;right:0;text-align:center;font-size:9px;color:#ffe8c0}
.dice{position:absolute;top:50px;left:0;right:0;display:flex;justify-content:center;gap:10px}
.die{width:54px;height:54px;background:url(assets/h-xx.webp) center/100%;position:relative}
.die i{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7a5a,#a8100a)}
.die.k i{background:radial-gradient(circle at 35% 35%,#6a6a7a,#14141e)}
.rolling{animation:shk .12s infinite}@keyframes shk{0%{transform:rotate(-8deg) translateY(-2px)}50%{transform:rotate(8deg) translateY(2px)}100%{transform:rotate(-8deg)}}
.mid .go{position:absolute;bottom:42px;left:50%;transform:translateX(-50%)}
.mid .info{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:9px;color:#ffe0b0}
.mid .turn{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:8.5px;color:#c8a878}
.hand{position:absolute;bottom:68px;right:6px;display:flex}
.hand div{width:30px;height:43px;background:url(assets/h-the.webp) center/100%;margin-left:-12px;border-radius:3px;box-shadow:0 2px 4px #000a}
.hand div:nth-child(1){transform:rotate(-12deg)}.hand div:nth-child(3){transform:rotate(12deg)}
.hand b{position:absolute;bottom:-11px;right:0;font-size:8px;white-space:nowrap;color:var(--gold2)}
#tok{position:absolute;width:34px;height:42px;z-index:5;transition:left .2s,top .2s;pointer-events:none}
#tok .c{width:30px;height:30px;margin:auto;border-radius:50%;background:url(assets/h-xu.webp) center/100%;padding:3px}
#tok .c div{width:100%;height:100%;border-radius:50%;overflow:hidden}
#tok .b{width:22px;height:9px;margin:-2px auto 0;border-radius:50%;background:radial-gradient(#ffd060,#8a5a10);box-shadow:0 2px 3px #000}
.hop #tok .c{animation:hop .2s}@keyframes hop{50%{transform:translateY(-10px)}}
/* dưới bàn */
#below{position:absolute;left:8px;right:8px;top:calc(76px + min(100vw - 12px, 418px));bottom:76px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.log{flex:none;height:118px;padding:2px 4px;overflow:hidden;font-size:10px;line-height:1.45}
.log p{color:#f0dcc0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log p b{color:var(--gold)}.log p em{color:#ff9a7a;font-style:normal}
.log h4{font-size:11.5px;margin-bottom:2px}
.quick{display:flex;gap:5px}
.quick button{flex:1;display:flex;align-items:center;gap:4px;background:#0007;border:1px solid #6a4010;border-radius:8px;padding:4px 5px;font-size:9.5px;text-align:left;line-height:1.15}
.quick img{width:24px;height:24px;flex:none}
.quick small{display:block;color:var(--dim);font-size:8px;white-space:nowrap}
.riv{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.riv h4{font-size:11.5px;display:flex;justify-content:space-between;align-items:center}.riv h4 small{font-family:'Be Vietnam Pro';font-weight:400;font-size:9px;color:var(--dim)}
.rv{display:flex;align-items:center;gap:7px;background:#0007;border:1px solid #5a3410;border-radius:9px;padding:4px 7px}
.rv .t{flex:1;min-width:0;line-height:1.25}.rv .t b{font-size:10.5px}.rv .t small{display:block;font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv .st{text-align:right;font-size:9px;color:var(--dim);white-space:nowrap}.rv .st b{display:block;font-size:11px;color:var(--gold2)}
.rtk{position:absolute;width:21px;height:21px;border-radius:50%;border:2px solid;z-index:4;pointer-events:none;box-shadow:0 2px 4px #000}
/* thanh đáy */
#nav{position:absolute;left:0;right:0;bottom:0;height:74px;display:flex;justify-content:space-around;align-items:flex-start;padding:4px 4px 0;background:linear-gradient(#1a060400,#1a0604 30%)}
.xu{width:56px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.xu .o{width:46px;height:46px;background:url(assets/h-xu.webp) center/100%;display:grid;place-items:center}
.xu .o img{width:28px;height:28px}
.xu span{font-size:9.5px;font-weight:700;color:var(--gold2);text-shadow:0 1px 2px #000;white-space:nowrap}
.dot{position:absolute;top:0;right:6px;width:9px;height:9px;border-radius:50%;background:#ff3a2a;border:1px solid #fff}
.side{position:absolute;right:6px;top:72px;display:none}
/* trang phủ */
.pg{position:absolute;inset:0;z-index:20;background:url(assets/bg-go.webp) center/cover;display:none;flex-direction:column}
.pg.on{display:flex;animation:pin .22s}@keyframes pin{from{opacity:0;transform:translateY(16px)}}
.ph{height:62px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;background:url(assets/h-bang.webp) center/100% 100%;margin:4px 4px 0}
.ph h2{font-size:18px}.ph .x{position:absolute;right:10px;top:13px;width:32px;height:32px;background:url(assets/h-xu.webp) center/100%;font-size:15px;color:var(--gold2);font-weight:700}
.ph .bk{position:absolute;left:10px;top:13px;width:32px;height:32px;background:url(assets/h-xu.webp) center/100%;font-size:15px;color:var(--gold2);font-weight:700}
.tabs{display:flex;gap:4px;padding:6px 8px 2px;overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:26px;padding:0 12px;border-radius:13px;border:1px solid #8a5a20;background:#0008;font-size:10.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.tab.on{background:linear-gradient(#e8402a,#8a1006);color:#fff4d8;border-color:var(--gold);box-shadow:0 0 8px #ff6a3a66}
.pb{flex:1;overflow-y:auto;padding:6px 8px 14px;scrollbar-width:none}
.pb::-webkit-scrollbar{display:none}
.sec{font-size:12px;margin:8px 2px 5px;display:flex;align-items:center;gap:6px}
.sec:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#c8902a,#0000)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{aspect-ratio:1;background:url(assets/h-o.webp) center/100% 100%;position:relative;display:grid;place-items:center}
.cell img{width:70%;height:70%;object-fit:contain}
.cell b{position:absolute;right:5px;bottom:3px;font-size:8.5px;color:var(--ink);font-weight:800}
.cell .q{position:absolute;left:4px;top:3px;width:6px;height:6px;border-radius:50%}
.q1{background:#7a9a6a}.q2{background:#3a8ae0}.q3{background:#a050e0}.q4{background:#f0a020}.q5{background:#e8301a}
.c1{color:#9ac88a}.c2{color:#6ab8ff}.c3{color:#d090ff}.c4{color:#ffc040}.c5{color:#ff6a4a}
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;margin-bottom:5px;background:#0006;border:1px solid #5a3410;border-radius:10px}
.row>img{width:40px;height:40px;flex:none}
.row .t{flex:1;min-width:0}.row .t b{font-size:11.5px;display:block}.row .t small{display:block;color:var(--dim);font-size:9.5px;line-height:1.35}
.bar{height:5px;background:#0009;border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#c8301a,#ffb04a)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:10.5px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px dashed #5a3410;padding:2px 0}.kv span{color:var(--dim)}
/* nhân vật */
.doll{position:relative;height:330px;margin:4px 0}
.doll .hero{position:absolute;left:50%;top:0;height:330px;transform:translateX(-50%);filter:drop-shadow(0 6px 8px #000)}
.doll .ped{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:200px;height:40px;border-radius:50%;background:radial-gradient(#e8b85066,#0000 70%)}
.slot{position:absolute;width:52px;height:52px;background:url(assets/h-o.webp) center/100% 100%;display:grid;place-items:center}
.slot img{width:72%;height:72%}
.slot span{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:8.5px;color:var(--dim);white-space:nowrap}
.slot .lv{position:absolute;top:2px;left:4px;font-size:7.5px;font-weight:800;color:#8a1a0a}
.power{text-align:center;font-size:18px;margin:12px 0 4px}.power small{font-size:10px;color:var(--dim);font-family:'Be Vietnam Pro'}
/* hộp thoại */
#mask{position:absolute;inset:0;z-index:50;background:#000a;display:none;align-items:center;justify-content:center;padding:14px}
#mask.on{display:flex}
.dlg{width:100%;max-height:92%;overflow-y:auto;animation:pop .2s;scrollbar-width:none}@keyframes pop{from{transform:scale(.85);opacity:0}}
.dlg h3{text-align:center;font-size:16px;margin-bottom:6px}
.dlg p{font-size:11px;line-height:1.5;color:#f0dcc0}
.acts{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.bigi{width:76px;height:76px;margin:2px auto 4px;background:url(assets/h-o.webp) center/100% 100%;display:grid;place-items:center}.bigi img{width:72%}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.cmp>div{background:#0006;border:1px solid #5a3410;border-radius:8px;padding:6px;font-size:10px}
.up{color:#7aff8a}.dn{color:#ff7a6a}
#toast{position:absolute;left:50%;top:90px;transform:translateX(-50%);z-index:90;background:#2a0c06f0;border:1px solid var(--gold);border-radius:14px;padding:6px 14px;font-size:11px;display:none;white-space:nowrap}
/* thẻ thiên cơ */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.fc{aspect-ratio:180/260;background:url(assets/h-the-mat.webp) center/100% 100%;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:12% 8% 8%;text-align:center;position:relative}
.fc img{width:56%;margin:2px 0}
.fc b{font-family:Philosopher;font-size:11.5px;color:#6a1006}
.fc small{font-size:8.5px;line-height:1.3;color:#5a3a1a}
.fc .eq{position:absolute;top:4px;right:4px;background:var(--cin);color:#fff;font-size:7.5px;padding:1px 4px;border-radius:5px}
.fc.back{background-image:url(assets/h-the.webp)}
.flip{animation:flp .5s}@keyframes flp{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
/* xúc xắc công pháp */
.dset{display:flex;gap:6px;align-items:center;margin-bottom:6px;background:#0006;border:1px solid #5a3410;border-radius:10px;padding:6px}
.dset .nm{width:46px;font-size:10px;text-align:center;line-height:1.2}
.faces{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.face{aspect-ratio:1;background:url(assets/h-xx.webp) center/100%;display:grid;place-items:center}
.face img{width:62%;border-radius:50%}
/* đấu xúc xắc */
#duel{position:absolute;inset:0;z-index:30;background:url(assets/bg-vo-dai.webp) center/cover;display:none;flex-direction:column}
#duel.on{display:flex}
.foe{position:relative;height:250px;flex:none}
.foe .im{position:absolute;left:50%;top:44px;width:190px;transform:translateX(-50%);filter:drop-shadow(0 8px 10px #000)}
.foe .hd{position:absolute;top:8px;left:10px;right:10px;display:flex;gap:6px;align-items:center}
.hpb{flex:1;height:12px;background:#000a;border:1px solid #8a5a20;border-radius:6px;overflow:hidden;position:relative}
.hpb i{display:block;height:100%;background:linear-gradient(#ff7a5a,#a8100a);transition:width .4s}
.hpb span{position:absolute;inset:0;text-align:center;font-size:8.5px;line-height:11px;font-weight:700}
.hpb.me i{background:linear-gradient(#7affb0,#1a8a4a)}
.intent{position:absolute;right:12px;top:40px;background:#000b;border:1px solid #ff6a4a;border-radius:8px;padding:4px 7px;font-size:9.5px;display:flex;align-items:center;gap:4px;max-width:150px}
.intent img{width:22px}
.edice{position:absolute;left:10px;top:42px;display:flex;flex-direction:column;gap:4px}
.edice .face{width:30px}
.pop{position:absolute;font-family:Philosopher;font-weight:700;font-size:22px;color:#fff2a0;text-shadow:0 2px 0 #8a1a00,0 0 10px #ff6a00;animation:fl 1s forwards;pointer-events:none;z-index:9}
@keyframes fl{to{transform:translateY(-50px);opacity:0}}
.dz{flex:1;display:flex;flex-direction:column;padding:6px 10px 10px;gap:7px;background:linear-gradient(#0000,#1a0604 18%)}
.combo{text-align:center;font-size:13px;min-height:34px}.combo small{display:block;font-family:'Be Vietnam Pro';font-size:9.5px;color:var(--dim);font-weight:400}
.mydice{display:flex;justify-content:center;gap:7px}
.md{width:60px;height:60px;background:url(assets/h-xx.webp) center/100%;display:grid;place-items:center;position:relative;transition:transform .15s}
.md img{width:62%;border-radius:50%}
.md.hold{transform:translateY(-8px);filter:drop-shadow(0 0 6px #ffd060)}
.md.hold:after{content:'Giữ';position:absolute;bottom:-14px;font-size:8.5px;color:var(--gold)}
.dlog{font-size:9.5px;color:#f0dcc0;height:42px;overflow:hidden;text-align:center;line-height:1.4}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;font-size:8.5px;color:var(--dim)}
.legend div{display:flex;align-items:center;gap:3px;white-space:nowrap}.legend img{width:14px}
/* bí cảnh */
#bcb{position:relative;aspect-ratio:1;display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);gap:4px;margin:6px 0}
#bcb .mid{grid-area:2/2/4/4}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shop div{background:#0006;border:1px solid #5a3410;border-radius:8px;padding:5px;text-align:center;font-size:9.5px}
.shop img{width:40px;margin:0 auto}
.shop b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.mt div{flex:none;width:76px;text-align:center;background:#0006;border:1px solid #5a3410;border-radius:10px;padding:4px;font-size:9.5px}
.mt div.on{border-color:var(--gold);box-shadow:0 0 8px #ffd06066}
.mt img{width:60px;margin:auto}
.real{display:flex;flex-direction:column-reverse;gap:4px}
.real div{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;background:#0006;border:1px solid #5a3410;font-size:10.5px}
.real div.cur{border-color:var(--gold);background:linear-gradient(90deg,#8a1a0a,#2a0c06)}
.real div.lock{opacity:.45}
</style></head><body><div id="app">

<div id="top">
  <div class="ava" onclick="openP('nv')"><div class="f" id="avaf"></div><b>Lv 47</b></div>
  <div class="who"><div class="n T gold">Lâm Tiêu Dao</div><div class="r">Trúc Cơ tầng 3 · Thanh Huyền Môn</div><div class="tv"><i></i></div></div>
  <div class="res">
    <div class="rp" onclick="toast('Linh thạch: dùng mua linh điền, nâng cấp')"><img id="r1">12.480</div>

    <div class="rp" onclick="toast('Thọ nguyên còn 186 năm')"><img id="r3">186 năm</div>
    <div class="rp" onclick="toast('Mỗi canh giờ hồi 1 lượt gieo')"><img id="r4"><span id="luot">5</span>/5 lượt</div>
  </div>
</div>

<div id="board"></div>
<div id="below">
  <div class="log kh"><h4 class="T gold">Thiên Cơ Lục</h4><div id="log"></div></div>
  <div class="riv" id="riv"></div>
  <div class="quick">
    <button onclick="openP('dp')"><img id="q1"><div>Linh điền<small>Chiếm 4/9</small></div></button>
    <button onclick="openP('bc')"><img id="q2"><div>Bí cảnh<small>Hỏa Vực</small></div></button>
    <button onclick="openP('nv',2)"><img id="q3"><div>Độ kiếp<small>Còn 2 vòng</small></div></button>

<div id="nav"></div>

 modal(`<div class="bigi">${im(i[0])}</div><h3 class="T c${i[3]}" style="margin-bottom:2px">${i[1]}</h3><p style="text-align:center;color:var(--dim);font-size:10px">${i[2]} · ${['','Phàm','Linh','Bảo','Tiên','Thần'][i[3]]} phẩm${i[4]>1?' · có '+i[4]:''}</p><p style="text-align:center;margin:6px 0">${i[5]}</p><div class="row" style="justify-content:center"><b class="gold">${i[6]}</b></div>
 ${isE?`<div class="cmp"><div><b>Đang mặc</b><br>Công +412<br>Bạo kích +4%</div><div><b>Món này</b><br>Công +486 <span class="up">▲74</span><br>Bạo kích +6% <span class="up">▲2%</span></div></div>`:''}
 <div class="acts">${isE?`<button class="nut" onclick="closeM();toast('Đã trang bị')">Trang bị</button><button class="nut n2" onclick="closeM();toast('Cường hoá thành công +1')">Cường hoá</button>`:`<button class="nut" onclick="closeM();toast('Đã dùng ${i[1]}')">Dùng</button>`}<button class="nut n2" onclick="closeM();toast('Đã bán')">Bán</button></div>`)}
function tamD(i){const a=TAM[i];modal(`<h3 class="T gold">${a[1]}</h3><div class="bigi">${im(a[0])}</div><p style="text-align:center">${a[2]}<br>${a[3]}</p><div class="bar"><i style="width:${a[4]}%"></i></div><div class="acts"><button class="nut" onclick="closeM();toast('Tu luyện +1.200 tu vi')">Tu luyện</button><button class="nut n2" onclick="closeM()">Đóng</button></div>`)}
function carve(i,j){modal(`<h3 class="T gold">Khắc mặt xúc xắc</h3><p style="text-align:center">Viên ${i+1} · mặt ${j+1}. Chọn ký hiệu mới:</p><div class="faces" style="margin:8px 0">${Object.keys(SYM).map(s=>`<div class="face" onclick="DSET[${i}][${j}]='${s}';closeM();openP('cp',2);toast('Khắc thành ${SYM[s][1]}')"><img src="${I(SYM[s][0])}"></div>`).join('')}</div><p style="text-align:center;color:var(--dim);font-size:10px">Tốn 1 Yêu Đan cùng hệ</p><div class="acts"><button class="nut n2" onclick="closeM()">Huỷ</button></div>`)}
function useFate(n){modal(`<h3 class="T gold">Dùng thẻ: ${n}</h3><p style="text-align:center">${n==='Định Số'?'Chọn tổng điểm muốn gieo:':'Thẻ sẽ có hiệu lực ở lượt gieo tới.'}</p>${n==='Định Số'?`<div class="faces" style="grid-template-columns:repeat(6,1fr);margin:8px 0">${[2,4,6,7,9,12].map(v=>`<button class="tab on" onclick="closeM();closeP();move(${v},${Math.ceil(v/2)},${Math.floor(v/2)})">${v}</button>`).join('')}</div>`:`<div class="acts"><button class="nut" onclick="closeM();closeP();toast('Thẻ ${n} đã kích hoạt')">Kích hoạt</button></div>`}<div class="acts"><button class="nut n2" onclick="closeM()">Huỷ</button></div>`)}
// ================= ĐẤU XÚC XẮC =================
let D={};
function duel(k,name){const f=FOES[k]||FOES['q-hoa-linh'];closeP();D={k,name:name||f[0],hp:f[1],max:f[1],me:8640,mmax:8640,blk:0,rolls:3,dice:[0,0,0,0,0].map((_,i)=>DSET[i][rnd(0,5)]),hold:[0,0,0,0,0],ed:f[2],rolled:0,stun:0};
 $('fn').textContent=D.name;$('fim').src=I(k);$('ed').innerHTML=D.ed.map(s=>`<div class="face"><img src="${I('kn-'+s)}"></div>`).join('');
 $('leg').innerHTML=Object.values(SYM).map(s=>`<div><img src="${I(s[0])}">${s[1]}: ${s[2]}</div>`).join('');$('dlog').innerHTML='Địch đang dồn khí...';$('rb').textContent='Gieo (còn 3)';intent();dDraw();$('duel').classList.add('on')}
function intent(){const n=rnd(90,180);D.next=n;$('fint').innerHTML=`<img src="${I('kn-'+D.ed[rnd(0,2)])}"><div>Sắp tung chiêu<br><b style="color:#ff9a7a">${n} sát thương</b></div>`}
function dDraw(){$('fhp').style.width=Math.max(0,D.hp/D.max*100)+'%';$('fht').textContent=Math.max(0,D.hp)+' / '+D.max;$('mhp').style.width=D.me/D.mmax*100+'%';$('mht').textContent=D.me+' / '+D.mmax;$('mblk').textContent='🛡 '+D.blk;
 $('mdice').innerHTML=D.dice.map((s,i)=>`<div class="md ${D.hold[i]?'hold':''}" onclick="D.hold[${i}]^=1;dDraw()"><img src="${I(SYM[s][0])}"></div>`).join('');$('combo').innerHTML=comboTxt()}
function cnt(){const c={};D.dice.forEach(s=>c[s]=(c[s]||0)+1);return c}
function calc(){const c=cnt();let dmg=(c.kiem||0)*35+(c.hoa||0)*30*((c.hoa||0)>=3?2:1)+(c.loi||0)*25+(c.thuy||0)*20;const blk=(c.thuan||0)*30,heal=(c.hoi||0)*30;let name='';
 if((c.kiem||0)>=3){dmg+=c.kiem*15;name='Vạn Kiếm Quy Tông';if(c.kiem===5){dmg*=3;name='Thiên Cơ Ngũ Liên · Vạn Kiếm'}}else if((c.hoa||0)>=3)name='Liệt Hỏa Phần Thiên';else if((c.loi||0)>=3)name='Cửu Thiên Lôi Phạt';else if((c.thuy||0)>=3)name='Huyền Băng Trận';
 if(Object.keys(c).length===5){dmg+=220;name='Ngũ Hành Luân'}return{dmg,blk,heal,name,c}}
function comboTxt(){if(!D.rolled)return 'Gieo xúc xắc để ra chiêu<small>Chạm vào xúc xắc để giữ lại trước khi gieo tiếp</small>';const r=calc();return `${r.name||'Đòn thường'}<small>Sát thương ${r.dmg} · Chặn ${r.blk} · Hồi ${r.heal}${(r.c.loi||0)>=3?' · Choáng':''}</small>`}
function dRoll(){if(D.rolls<=0){toast('Hết lượt gieo, hãy ra chiêu');return}D.rolls--;D.rolled=1;let k=0;const els=[...document.querySelectorAll('.md')];els.forEach((e,i)=>{if(!D.hold[i])e.classList.add('rolling')});
 const iv=setInterval(()=>{D.dice=D.dice.map((s,i)=>D.hold[i]?s:DSET[i][rnd(0,5)]);els.forEach((e,i)=>{if(!D.hold[i])e.querySelector('img').src=I(SYM[D.dice[i]][0])});if(++k>7){clearInterval(iv);dDraw();$('rb').textContent='Gieo (còn '+D.rolls+')'}},70)}
function popAt(t,x,y,c){const p=document.createElement('div');p.className='pop';p.textContent=t;p.style.left=x+'px';p.style.top=y+'px';if(c)p.style.color=c;$('duel').appendChild(p);setTimeout(()=>p.remove(),1000)}
function dCast(){if(!D.rolled){toast('Hãy gieo ít nhất một lần');return}const r=calc();D.hp-=r.dmg;D.blk+=r.blk;D.me=Math.min(D.mmax,D.me+r.heal);popAt('-'+r.dmg,180,120);if(r.heal)popAt('+'+r.heal,60,330,'#7affb0');
 const stun=(r.c.loi||0)>=3||(r.c.thuy||0)>=3;$('dlog').innerHTML=`Bạn tung <b class="gold">${r.name||'đòn thường'}</b> gây ${r.dmg} sát thương.`;$('fim').animate([{transform:'translateX(-50%)'},{transform:'translateX(-46%) rotate(4deg)'},{transform:'translateX(-50%)'}],{duration:300});dDraw();
 if(D.hp<=0)return setTimeout(win,600);
 setTimeout(()=>{if(stun){$('dlog').innerHTML+=`<br>${D.name} bị khống chế, mất lượt!`}else{const hit=Math.max(0,D.next-D.blk);D.blk=Math.max(0,D.blk-D.next);D.me-=hit;popAt('-'+hit,60,300,'#ff7a6a');$('dlog').innerHTML+=`<br>${D.name} phản kích ${D.next}, bạn chặn ${D.next-hit}.`}D.rolls=3;D.rolled=0;D.hold=[0,0,0,0,0];$('rb').textContent='Gieo (còn 3)';intent();dDraw();if(D.me<=0)lose()},700)}
function win(){addLog(`Thắng <b>${D.name}</b> trong đấu xúc xắc`);modal(`<h3 class="T gold">Đại thắng</h3><p style="text-align:center">Đánh bại <b>${D.name}</b></p><div class="shop" style="margin:8px 0">${[['vp-yeu-dan','Yêu Đan x1'],['vp-linh-thach','Linh thạch x320'],['vp-quyen','Tàn quyển x1']].map(a=>`<div>${im(a[0])}<b>${a[1]}</b></div>`).join('')}</div><p style="text-align:center">Tu vi <b class="gold">+1.800</b></p><div class="acts"><button class="nut" onclick="closeM();$('duel').classList.remove('on')}">Nhận thưởng</button></div>`)}
function lose(){modal(`<h3 class="T gold">Thất bại</h3><p style="text-align:center">Bạn bị đánh lui về <b>Tông Môn</b>, mất 5 năm thọ nguyên.</p><div class="acts"><button class="nut" onclick="closeM();$('duel').classList.remove('on');pos=0;placeTok()">Về Tông Môn</button></div>`)}
function dFlee(){modal(`<h3 class="T gold">Rút lui?</h3><p style="text-align:center">Rút lui sẽ mất 1 lượt gieo.</p><div class="acts"><button class="nut" onclick="closeM();$('duel').classList.remove('on')">Rút lui</button><button class="nut n2" onclick="closeM()">Đánh tiếp</button></div>`)}
// ================= KHỞI ĐỘNG =================
$('avaf').innerHTML=face('nv-kiem-tu',38);['vp-linh-thach','vp-ngoc-tim','vp-den','vp-binh-ngoc'].forEach((n,i)=>$('r'+(i+1)).src=I(n));['vp-hat','vp-chia-khoa','kn-loi','vp-lenh'].forEach((n,i)=>$('q'+(i+1)).src=I(n));
$('nav').innerHTML=[['nv','vp-ao','Nhân vật'],['tui','vp-ruong','Túi đồ'],['cp','vp-sach','Công pháp'],['tc','vp-bua','Thiên cơ',1],['tk','mt-hac','Tọa kỵ'],['dp','vp-lo','Động phủ']].map(a=>`<button class="xu" onclick="openP('${a[0]}')"><div class="o">${im(a[1])}</div><span>${a[2]}</span>${a[3]?'<i class="dot"></i>':''}</button>`).join('');
drawBoard();drawLog();drawRiv();addEventListener('resize',placeTok);
</script></body></html>
