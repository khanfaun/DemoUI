.sbtn{display:flex;gap:8px;justify-content:center;padding:6px}

function pop(el,t,c){const r=el.getBoundingClientRect(),a=$('app').getBoundingClientRect();const p=document.createElement('div');p.className='dmg';p.textContent=t;p.style.color=c;p.style.left=(r.left-a.left+r.width/2-30)+'px';p.style.top=(r.top-a.top-10)+'px';$('app').appendChild(p);setTimeout(()=>p.remove(),1000)}
function hitFoe(j,d,c){const f=F[j];if(f.hp<=0)return;f.hp-=d;const e=$('fo'+j);if(!e)return;e.classList.remove('hit');e.offsetWidth;e.classList.add('hit');pop(e,d.toLocaleString('vi'),c);e.querySelector('.fhp i').style.width=Math.max(0,f.hp/f.max*100)+'%';if(f.hp<=0)setTimeout(()=>e.classList.add('dead'),300)}
function enemyTurn(){turn++;$('bturn').textContent='Lượt '+turn;if(frozen){frozen--;drawFoes();return}let dmg=0;F.forEach(f=>{if(f.hp<=0)return;f.cd--;if(f.cd<=0){dmg+=Math.round(f.max*.25);f.cd=f.cdm}});if(dmg){THP-=dmg;pop($('thp'),'-'+dmg.toLocaleString('vi'),'#ff6a5a');$('tm').animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:300})}drawFoes();if(THP<=0)lose()}

 else F.forEach((f,j)=>{if(f.hp>0)setTimeout(()=>hitFoe(j,Math.round(h[6]*(h[3]==='tho'?6:3)),ELC[h[3]]),200+j*150)});
 drawTeam();setTimeout(()=>{drawFoes();if(F.every(f=>f.hp<=0))win()},900)}
function win(){md(`<h3 class="B g" style="font-size:26px">THẮNG LỢI</h3><div class="star" style="font-size:30px">★★★</div><p>Combo cao nhất: 6 · Lượt: ${turn}</p><div class="rw">${[['vp-linh-thach',2,'12.400'],['vp-dan-hong',1,'x6'],['vp-tinh-kim',3,'x3'],['nv-ma-tu',4,'x1']].map(r=>`<div style="text-align:center;font-size:9.5px"><div class="it r${r[1]}">${im(r[0],r[0].startsWith('nv')?'width:100%;height:100%;object-fit:cover;object-position:50% 12%;border-radius:7px':'')}</div>${r[2]}</div>`).join('')}</div><p>Đội nhận <b style="color:#7aff9a">+2.400 kinh nghiệm</b></p><div class="ac"><button class="bt" onclick="cm();endB()">Tiếp tục</button><button class="bt b2" onclick="cm();fight()">Đánh lại</button></div>`)}
function lose(){md(`<h3 class="B" style="font-size:24px;color:#ff8a7a">THẤT BẠI</h3><p>Gợi ý: dùng tiên hữu hệ khắc chế, nâng cấp trang bị, đột phá sao.</p><div class="ac"><button class="bt" onclick="cm();THP=TMAX;drawFoes()">Hồi sinh (50 ngọc)</button><button class="bt b2" onclick="cm();endB()">Rời trận</button></div>`)}
function endB(){$('bat').classList.remove('on');$('dock').style.display='flex'}
function auto(){toast('Tự động: tìm nước đi tốt nhất...');for(let r=0;r<CH;r++)for(let c=0;c<CW-1;c++){swap(r,c,r,c+1);if(matches().size){swap(r,c,r,c+1);const a=$('o'+BD[r][c].id),b=$('o'+BD[r][c+1].id);tap(a);setTimeout(()=>tap(b),150);return}swap(r,c,r,c+1)}}
