<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hồng Trần Vấn Tâm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2024;--ink2:#6a5a5e;--pk:#e8789e;--pk2:#f8c8d8;--red:#c8202a;--pap:#fbf5ec;--gr:#5a8a5a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#f4e8e0;font-family:Lora,serif;color:var(--ink);font-size:11px;overflow:hidden}
#app{position:relative;width:100%;max-width:430px;height:100dvh;margin:auto;overflow:hidden;background:url(assets/bg-dinh-vien.webp) center/cover}
.H{font-family:Charm,cursive;font-weight:700;line-height:1.1}
img{display:block;user-select:none;-webkit-user-drag:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.pp{border:16px solid transparent;border-image:url(assets/k-khung.webp) 44 fill / 16px stretch}
.ink{height:32px;padding:0 18px;background:url(assets/k-nut.webp) center/100% 100%;color:#fbeef2;font-family:Charm;font-weight:700;font-size:15px;white-space:nowrap}
.ink.p{background-image:url(assets/k-nut2.webp);color:#5a1030}.ink.sm{height:26px;font-size:13px;padding:0 13px}.ink:active{transform:scale(.95)}
/* trang chủ */
.her{position:absolute;left:-6%;bottom:118px;height:66%;filter:drop-shadow(0 8px 10px #5a203044);pointer-events:none;animation:bre 5s ease-in-out infinite}
@keyframes bre{50%{transform:translateY(-4px)}}
.cal{position:absolute;left:6px;right:6px;top:6px;display:flex;gap:6px;align-items:stretch}
.cal .d{flex:1;background:linear-gradient(#fffdf8f0,#f8eee2f0);border:1px solid #d8c0b0;border-radius:4px;padding:5px 8px;position:relative;box-shadow:0 2px 8px #5a203022}
.cal .d b{font-size:17px;display:block;color:var(--ink)}.cal .d small{font-size:9.5px;color:var(--ink2)}
.cal .d .seal{position:absolute;right:6px;top:6px;width:34px}
.cal .r{display:flex;flex-direction:column;gap:3px}
.rp{display:flex;align-items:center;gap:3px;background:#fffdf8e8;border:1px solid #d8c0b0;border-radius:10px;padding:0 7px 0 2px;height:19px;font-size:9.5px;font-weight:700;white-space:nowrap}.rp img{width:15px}
.stats{position:absolute;left:6px;right:6px;top:66px;display:flex;gap:3px}
.stt{flex:1;background:#fffdf8d8;border:1px solid #e0ccc0;border-radius:6px;padding:2px 0;text-align:center;font-size:8.5px;color:var(--ink2);line-height:1.2}
.stt b{display:block;font-size:12px;color:var(--ink);font-family:Lora}
.mood{position:absolute;left:8px;top:104px;font-size:10px;background:#fffdf8d0;border-radius:10px;padding:2px 8px;border:1px solid #e0ccc0}
.mood b{color:var(--pk)}
.sched{position:absolute;right:6px;top:104px;width:128px;display:flex;flex-direction:column;gap:5px}
.sched h4{font-size:16px;text-align:center;color:var(--ink);text-shadow:0 0 6px #fff}
.slot{height:74px;background:url(assets/k-the.webp) center/100% 100%;display:flex;align-items:center;gap:6px;padding:6px 12px;position:relative}
.slot img{width:36px;flex:none}.slot .t{flex:1;min-width:0;line-height:1.25}.slot .t small{display:block;font-size:8.5px;color:var(--pk);font-weight:700}.slot .t b{font-size:10.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot .t i{font-size:8.5px;color:var(--ink2);font-style:normal;display:block}
.slot.em .t b{color:#b8a8a0}
.who{position:absolute;right:6px;top:370px;width:128px;display:flex;gap:4px;justify-content:center}
.who div{position:relative}.who i{position:absolute;bottom:-2px;right:-2px;font-style:normal;font-size:9px}
.start{position:absolute;right:10px;top:338px;width:120px}
.dia{position:absolute;left:4px;right:4px;bottom:62px;height:96px;background:url(assets/k-thoai.webp) center/100% 100%;padding:24px 22px 12px;cursor:pointer}
.dia .nm{position:absolute;left:12px;top:-14px;height:30px;padding:0 22px 0 18px;background:url(assets/k-ten.webp) center/100% 100%;color:#fff4e8;font-family:Charm;font-weight:700;font-size:15px;line-height:30px;white-space:nowrap}
.dia p{font-size:11.5px;line-height:1.55}.dia .nx{position:absolute;right:16px;bottom:10px;font-size:10px;color:var(--pk);animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.bar0{position:absolute;left:0;right:0;bottom:0;height:60px;display:flex;align-items:center;justify-content:space-around;background:linear-gradient(#fbf5ec00,#fbf5ecf0 40%)}
.fanb{width:54px;height:54px;background:url(assets/k-an.webp) center/100%;color:#fff;font-family:Charm;font-weight:700;font-size:15px;filter:drop-shadow(0 3px 4px #5a203055)}
.qb{display:flex;flex-direction:column;align-items:center;font-size:9px;font-weight:600;width:52px;position:relative}
.qb .o{width:36px;height:36px;border-radius:50%;background:#fffdf8;border:1.5px solid #c8a090;display:grid;place-items:center;box-shadow:0 2px 4px #5a203033}.qb img{width:24px}
.qb .d{position:absolute;top:0;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1px solid #fff}
/* quạt */
#fan{position:absolute;inset:0;z-index:30;display:none;background:#2a102066}
#fan.on{display:block}
#fan .f{position:absolute;left:50%;bottom:30px;width:420px;max-width:104%;aspect-ratio:720/400;transform:translateX(-50%);background:url(assets/k-quat.webp) center/100% 100%;transform-origin:50% 97%;animation:unf .4s cubic-bezier(.3,1.4,.6,1)}
@keyframes unf{from{transform:translateX(-50%) scaleX(.05) scaleY(.6);opacity:0}}
#fan .it{position:absolute;width:56px;margin-left:-28px;margin-top:-28px;display:flex;flex-direction:column;align-items:center;font-family:Charm;font-weight:700;font-size:12px;color:var(--ink);text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 6px #fff;animation:fi .5s backwards;white-space:nowrap}
@keyframes fi{from{opacity:0;transform:scale(.4)}}
#fan .it .o{width:38px;height:38px;border-radius:50%;background:radial-gradient(#fffdf8,#f4e4dc);border:1.5px solid #a87868;display:grid;place-items:center;box-shadow:0 2px 6px #5a203044}
#fan .it img{width:26px}
#fan .cl{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:44px;height:44px;background:url(assets/k-an.webp) center/100%;color:#fff;font-size:16px;font-weight:700}
/* trang giấy */
.pg{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:#f4ece2;}
.pg:before{content:'';position:absolute;inset:0;background:url(assets/bg-son-thuy.webp) center/cover;opacity:.18;filter:sepia(.5)}
.pg.on{display:flex;animation:op .25s}@keyframes op{from{opacity:0;transform:translateY(10px)}}
.ph{position:relative;flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.ph h2{font-size:28px;flex:1;color:var(--ink)}.ph h2 small{font-family:Lora;font-size:9.5px;font-weight:500;color:var(--ink2);display:block;font-style:italic}
.ph .x{width:34px;height:34px;background:url(assets/k-an.webp) center/100%;color:#fff;font-weight:700;font-size:14px}
.tb{position:relative;flex:none;display:flex;gap:2px;padding:0 10px;border-bottom:1.5px solid #2a202444;overflow-x:auto;scrollbar-width:none}.tb::-webkit-scrollbar{display:none}
.tab{flex:none;padding:5px 11px 4px;font-size:11px;font-weight:600;color:var(--ink2);border-radius:6px 6px 0 0;white-space:nowrap}
.tab.on{background:#fffdf8;color:var(--red);box-shadow:0 -1px 0 #d8c0b0,1px 0 0 #d8c0b0,-1px 0 0 #d8c0b0}
.pb{position:relative;flex:1;overflow-y:auto;padding:8px 10px 18px;scrollbar-width:none}.pb::-webkit-scrollbar{display:none}
.sec{font-family:Charm;font-weight:700;font-size:18px;margin:8px 2px 4px;display:flex;align-items:center;gap:6px}.sec:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#2a202466,#0000)}
.card{background:#fffdf8;border:1px solid #e0ccc0;border-radius:6px;padding:8px;margin-bottom:6px;box-shadow:0 1px 3px #5a203014}
.row{display:flex;align-items:center;gap:8px}
.row>img{width:42px;height:42px;flex:none}
.row .t{flex:1;min-width:0}.row .t b{font-size:12px;display:block}.row .t small{display:block;font-size:9.5px;color:var(--ink2);line-height:1.4}
.bar{height:5px;border-radius:3px;background:#f0e0d8;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f8a8c0,#e8789e)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cl{aspect-ratio:1;background:#fffdf8;border:1px solid #e0ccc0;border-radius:6px;position:relative;display:grid;place-items:center}
.cl img{width:74%}.cl b{position:absolute;right:4px;bottom:1px;font-size:8.5px}.cl:before{content:'';position:absolute;left:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--q,#ccc)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:10.5px}.kv div{display:flex;justify-content:space-between;border-bottom:1px dotted #d8c0b0;padding:2px 0}.kv span{color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tags span{font-size:9.5px;padding:2px 7px;border-radius:9px;background:#fbe8ee;border:1px solid #f0c0d0;color:#8a2a50}
.doll{position:relative;height:330px}
.doll .h{position:absolute;left:50%;top:0;height:330px;transform:translateX(-50%)}
.es{position:absolute;width:54px;text-align:center;font-size:8.5px;color:var(--ink2)}.es .cl{margin-bottom:1px}
.npcs{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.npc{background:#fffdf8;border:1px solid #e0ccc0;border-radius:8px;overflow:hidden;position:relative}
.npc .pic{height:140px;overflow:hidden;position:relative;background:linear-gradient(#fbe8ee,#fffdf8)}
.npc .pic img{position:absolute;width:200%;left:-50%;top:-28%}
.npc .in{padding:5px 7px}.npc .in b{font-size:16px;font-family:Charm;display:block}.npc .in small{font-size:9px;color:var(--ink2);display:block}
.hearts{color:var(--pk);font-size:11px;letter-spacing:-1px}
.hot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;background:radial-gradient(#fff,#f8a8c088);box-shadow:0 0 12px #fff;animation:hp 1.6s infinite}
@keyframes hp{50%{transform:scale(1.25);box-shadow:0 0 20px #fff}}
.hot span{position:absolute;top:32px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:600;background:#fffdf8e8;border-radius:8px;padding:1px 6px;border:1px solid #e0ccc0}
.hot.done{animation:none;opacity:.45;background:#ccc}
.scn{position:relative;height:460px;border-radius:8px;overflow:hidden;background-size:cover;background-position:center}
.scn .lg{position:absolute;left:8px;right:8px;bottom:8px;background:#fffdf8e8;border-radius:6px;padding:6px 8px;font-size:10.5px;line-height:1.45}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.act{background:url(assets/k-the.webp) center/100% 100%;aspect-ratio:160/200;padding:12px 8px;text-align:center;position:relative}
.act img{width:44px;margin:0 auto 2px}.act b{font-size:11px;display:block}.act small{display:block;font-size:8.5px;color:var(--gr);line-height:1.3}.act small.n{color:#b85a5a}
.act.on{filter:drop-shadow(0 0 6px #f8789e)}
.mts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.mts div{flex:none;width:82px;text-align:center;background:#fffdf8;border:1px solid #e0ccc0;border-radius:8px;padding:4px;font-size:9.5px}.mts div.on{border-color:var(--pk);box-shadow:0 0 6px #f8a8c088}.mts img{width:64px;margin:auto}
/* cảnh truyện */
#vn{position:absolute;inset:0;z-index:40;display:none;background-size:cover;background-position:center}
#vn.on{display:block}
#vn .po{position:absolute;left:50%;bottom:150px;height:68%;transform:translateX(-50%);filter:drop-shadow(0 8px 10px #2a102044);transition:opacity .3s}
#vn .po2{position:absolute;left:-12%;bottom:150px;height:52%;opacity:.95}
#vn .dia{bottom:14px;height:120px}
#vn .ch{position:absolute;left:30px;right:30px;bottom:150px;display:flex;flex-direction:column;gap:6px}
#vn .ch button{height:38px;background:url(assets/k-nut2.webp) center/100% 100%;font-size:11.5px;font-weight:600;color:#5a1030;padding:0 20px}
#vn .ch button small{font-size:9px;color:#8a4a60;margin-left:4px}
#vn .res{position:absolute;right:12px;top:60px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
#vn .res span{background:#fffdf8f0;border:1px solid #e0ccc0;border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700;animation:fi .5s backwards}
#vn .top{position:absolute;left:10px;top:10px;background:#fffdf8e8;border:1px solid #d8c0b0;border-radius:4px;padding:3px 10px;font-family:Charm;font-weight:700;font-size:16px}
#vn .skip{position:absolute;right:10px;top:10px;height:26px;padding:0 10px;border-radius:13px;background:#fffdf8e8;border:1px solid #d8c0b0;font-size:10px}
.heart{position:absolute;font-size:22px;color:var(--pk);animation:hu 1.2s forwards;pointer-events:none;z-index:9}@keyframes hu{to{transform:translateY(-70px) scale(1.4);opacity:0}}
/* vấn kiếm */
#du{position:absolute;inset:0;z-index:45;display:none;background:url(assets/bg-ho-dem.webp) center/cover;flex-direction:column}
#du.on{display:flex}
.arena{position:relative;flex:1}
.arena .en{position:absolute;right:-14%;top:30px;height:62%;filter:drop-shadow(0 0 16px #ff3a4a88);transition:transform .2s}
.arena .me{position:absolute;left:-16%;bottom:-4px;height:56%;filter:drop-shadow(0 0 12px #ffc0d888);transition:transform .2s}
.hpw{position:absolute;width:56%;background:#fffdf8e8;border:1px solid #d8c0b0;border-radius:6px;padding:4px 7px}
.hpw b{font-family:Charm;font-size:15px}.hpw .bb{height:7px;border-radius:4px;background:#f0e0d8;overflow:hidden;margin-top:2px}.hpw .bb i{display:block;height:100%;transition:width .4s}
.hpw .bb.h i{background:linear-gradient(90deg,#e04a5a,#ff9aa8)}.hpw .bb.t i{background:linear-gradient(90deg,#7a8ae0,#c8d0ff)}
.hpw small{font-size:8.5px;color:var(--ink2)}
.rnd{position:absolute;left:50%;top:46%;transform:translateX(-50%);font-family:Charm;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 6px #000}
.clash{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:Charm;font-weight:700;font-size:40px;color:#fff6e0;text-shadow:0 0 16px #ff6a8a,0 3px 0 #8a1030;opacity:0;pointer-events:none}
.clash.on{animation:cs .9s}@keyframes cs{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0}}
.dz{flex:none;padding:0 6px 8px}
.dz .dia{position:relative;left:0;right:0;bottom:0;height:92px;margin-bottom:6px}
.stance{display:flex;gap:6px;margin-bottom:6px}
.stance button{flex:1;height:58px;background:url(assets/k-the.webp) center/100% 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Charm;font-weight:700;font-size:17px;line-height:1}
.stance button small{font-family:Lora;font-size:8.5px;font-weight:500;color:var(--ink2)}
.stance img{width:24px}
.sks{display:flex;gap:5px}.sks button{flex:1;display:flex;align-items:center;gap:4px;background:#fffdf8e8;border:1px solid #d8c0b0;border-radius:6px;padding:3px 5px;font-size:9.5px;text-align:left;line-height:1.2}.sks img{width:26px;flex:none}.sks button.used{opacity:.4}
/* hộp thoại */
#mk{position:absolute;inset:0;z-index:60;background:#2a102055;display:none;align-items:center;justify-content:center;padding:16px}#mk.on{display:flex}
.dl{width:100%;max-height:90%;overflow-y:auto;animation:pop .2s;scrollbar-width:none}@keyframes pop{from{transform:scale(.9);opacity:0}}
.dl h3{text-align:center;font-family:Charm;font-size:24px;margin-bottom:4px}.dl p{text-align:center;font-size:11px;line-height:1.55;color:var(--ink2)}
.ac{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#ts{position:absolute;left:50%;top:80px;transform:translateX(-50%);z-index:90;background:#fffdf8f5;border:1px solid #d8c0b0;border-radius:14px;padding:6px 14px;font-size:11px;font-weight:600;display:none;white-space:nowrap;box-shadow:0 3px 10px #5a203033}
</style></head><body><div id="app">
<img class="her" id="her">
<div class="cal"><div class="d" onclick="openP('nk')"><b class="H">Xuân · Tháng Hai · Ngày 12</b><small>Năm Giáp Thìn · Thanh Vân Phong · trời quang, gió nhẹ</small><img class="seal" id="seal"></div>
 <div class="r"><div class="rp" onclick="toast('Linh thạch')"><img id="r1">3.620</div><div class="rp" onclick="toast('Thọ nguyên 112 năm')"><img id="r2">112 năm</div></div></div>
<div class="stats" id="stats"></div>
<div class="mood">Tâm cảnh: <b>Thanh tĩnh</b> · Tô Linh Nhi · Luyện Khí 9</div>
<div class="sched"><h4 class="H">Lịch hôm nay</h4><div id="slots"></div></div>
<div class="start"><button class="ink p" style="width:100%" onclick="startDay()">Bắt đầu ngày</button></div>
<div class="who" id="whoN"></div>
<div class="dia" id="hdia" onclick="nextTip()"><div class="nm" id="hnm">Tiểu Đào</div><p id="htx"></p><span class="nx">▼ chạm</span></div>
<div class="bar0"><button class="qb" onclick="openP('dn')"><div class="o"><img id="b1"></div>Duyên phận<i class="d"></i></button><button class="qb" onclick="openP('tui')"><div class="o"><img id="b2"></div>Túi đồ</button><button class="fanb" onclick="fan()">Quạt</button><button class="qb" onclick="openP('bc')"><div class="o"><img id="b3"></div>Bí cảnh</button><button class="qb" onclick="openP('nk')"><div class="o"><img id="b4"></div>Nhật ký</button></div>

<div id="fan" onclick="if(event.target===this)fan(0)"><div class="f" id="fanf"></div><button class="cl" onclick="fan(0)">✕</button></div>
<div class="pg" id="pg"><div class="ph"><h2 class="H" id="pt"></h2><button class="x" onclick="closeP()">✕</button></div><div class="tb" id="ptb"></div><div class="pb" id="pb"></div></div>
<div id="vn"><img class="po2" id="vpo2"><img class="po" id="vpo"><div class="top" id="vtop"></div><button class="skip" onclick="vnEnd()">Bỏ qua ›</button><div class="res" id="vres"></div><div class="ch" id="vch"></div><div class="dia" onclick="vnNext()"><div class="nm" id="vnm"></div><p id="vtx"></p><span class="nx">▼</span></div></div>
<div id="du"><div class="arena"><img class="en" id="den"><img class="me" id="dme"><div class="hpw" style="right:8px;top:8px" id="ehw"></div><div class="hpw" style="left:8px;top:calc(100% - 92px)" id="mhw"></div><div class="rnd H" id="drn"></div><div class="clash" id="dcl"></div></div>
 <div class="dz"><div class="dia"><div class="nm" id="dnm"></div><p id="dtx"></p></div><div class="stance" id="dst"></div><div class="sks" id="dsk"></div></div></div>
<div id="mk" onclick="if(event.target===this)cm()"><div class="dl pp" id="dl"></div></div>
<div id="ts"></div>
</div>
<script>
const $=i=>document.getElementById(i);
const I=n=>(window.IMG&&IMG[n])||('assets/'+n+'.webp');
const im=(n,s='')=>`<img src="${I(n)}" style="${s}">`;
const face=(n,s)=>`<div style="width:${s}px;height:${s}px;overflow:hidden;border-radius:50%;position:relative;flex:none;border:1.5px solid #fff;box-shadow:0 1px 4px #5a203044"><img src="${I(n)}" style="position:absolute;width:${s*3}px;left:${-s}px;top:${-s*.52}px"></div>`;
function toast(t){const e=$('ts');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1700)}
function md(h){$('dl').innerHTML=h;$('mk').classList.add('on')}function cm(){$('mk').classList.remove('on')}

 bc(t){if(t===1)return explore();return [['bg-hang','Hàn Băng Động','Hậu sơn · nghe nói có tiên nhân để lại di vật','Đang thám hiểm 2/5',1],['bg-ho-dem','Nguyệt Hồ','Đêm trăng tròn hồ hiện ra đảo nhỏ','Mở vào ngày 15',0],['bg-rung','Mê Vụ Lâm','Rừng sương, hay có yêu hồ lui tới','Cần Thân pháp 60',0],['bg-nham','Xích Viêm Cốc','Nơi Huyết Vô Nhai từng xuất hiện','Cốt truyện chương 3',0]].map(b=>`<div class="card" style="padding:0;overflow:hidden;${b[4]?'':'opacity:.65'}" onclick="${b[4]?"openP('bc',1)":`toast('${b[3]}')`}"><div style="height:84px;background:url(${I(b[0])}) center/cover;position:relative"><div style="position:absolute;inset:0;background:linear-gradient(90deg,#fffdf8f0 35%,#fffdf800)"></div><div style="position:relative;padding:8px 10px"><b class="H" style="font-size:22px">${b[1]}</b><small style="display:block;font-size:9.5px;color:var(--ink2)">${b[2]}</small><small style="display:block;font-size:9.5px;color:var(--pk);font-weight:700">${b[3]}</small></div></div></div>`).join('')},
 nk(t){if(t===1)return [['Ngày 1','Bái nhập Thanh Vân Phong'],['Ngày 23','Lần đầu thắng Vấn Kiếm ngoại môn'],['Ngày 41','Được Huyết Vô Nhai cứu ở Hắc Phong Lĩnh'],['Ngày 58','Luyện Khí tầng 9']].map(a=>`<div class="card row"><b class="H" style="font-size:16px;width:64px;color:var(--red)">${a[0]}</b><div class="t"><small style="color:var(--ink);font-size:10.5px">${a[1]}</small></div></div>`).join('');
  return [['Ngày 11','Sáng đọc sách ở Tàng Kinh Các, chiều luyện kiếm. Đại sư huynh chỉ điểm một chiêu, tay ta còn run.','Thân pháp +4 · Lăng Tiêu ❤+3'],['Ngày 10','Dạo phố gặp một nữ nhân mắt hồ ly, nàng tặng ta lá thư thơm mùi hoa quế.','Nhận: Thư tay'],['Ngày 9','Sư phụ khen đan dược ta luyện. Lần đầu thấy người cười.','Tử Vân Chân Nhân ❤+5']].map(a=>`<div class="card"><b class="H" style="font-size:17px;color:var(--red)">${a[0]}</b><p style="font-size:10.5px;line-height:1.55;font-style:italic">${a[1]}</p><small style="color:var(--gr);font-size:9.5px;font-weight:600">${a[2]}</small></div>`).join('')}
};
let selM=0;
function radar(){const c=$('rdr');if(!c)return;const S=c.clientWidth;c.width=c.height=S*2;const x=c.getContext('2d');x.scale(2,2);const cx=S/2,cy=S/2+4,R=S*.36,K=Object.keys(ST);
 for(let l=1;l<=4;l++){x.beginPath();K.forEach((_,i)=>{const a=-Math.PI/2+i/K.length*Math.PI*2,r=R*l/4;i?x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)});x.closePath();x.strokeStyle='#d8c0b0';x.stroke()}
 x.beginPath();K.forEach((k,i)=>{const a=-Math.PI/2+i/K.length*Math.PI*2,r=R*ST[k]/100;i?x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)});x.closePath();x.fillStyle='#e8789e55';x.fill();x.strokeStyle='#e8789e';x.lineWidth=2;x.stroke();
 x.fillStyle='#2a2024';x.font='600 9px Lora';x.textAlign='center';K.forEach((k,i)=>{const a=-Math.PI/2+i/K.length*Math.PI*2;x.fillText(k,cx+Math.cos(a)*(R+12),cy+Math.sin(a)*(R+12)+3)})}
function itD(n){const i=ITEMS.find(x=>x[0]===n);md(`<div class="cl" style="width:76px;margin:0 auto 6px;--q:${Q[i[2]]}">${im(i[0])}</div><h3>${i[1]}</h3><p>${i[4]}${i[3]>1?' · có '+i[3]:''}</p><p style="font-style:italic;color:var(--ink);margin:6px 0">${i[5]}</p><div class="ac">${i[4]==='Trang bị'?'<button class="ink p sm" onclick="cm();toast(\'Đã mang\')">Mang</button>':i[4]==='Đan dược'?'<button class="ink p sm" onclick="cm();toast(\'Đã dùng\')">Dùng</button>':''}<button class="ink sm" onclick="cm();openP('dn')">Tặng ai đó</button><button class="ink sm" onclick="cm()">Cất</button></div>`)}
// ============ KHÁM PHÁ BÍ CẢNH ============
let EX=[0,1,0,0,0];
function explore(){const H=[[26,74,'Tinh thể lam','Một viên băng tinh chứa linh khí thuần khiết. Nhận: Linh thạch x200'],[56,58,'Bia đá cổ','Chữ khắc: “Kẻ đến sau, hãy giữ lòng như băng.” Ngộ tính +3'],[50,86,'Hồ băng','Dưới đáy hồ có bóng người... Bỗng một bóng băng lao lên!'],[78,66,'Tinh thể tím','Khí tức quen thuộc... của Huyết Vô Nhai?'],[20,40,'Khe đá','Tìm thấy một cuộn tàn quyển: Băng Tâm Quyết']];
 return `<div class="scn" style="background-image:url(${I('bg-hang')})">${H.map((h,i)=>`<div class="hot ${EX[i]?'done':''}" style="left:${h[0]}%;top:${h[1]}%" onclick="exHit(${i},'${h[2]}','${h[3]}')"><span>${EX[i]?'✓ ':''}${h[2]}</span></div>`).join('')}<div class="lg" id="exl"><b>Hàn Băng Động · Thám tra ${EX.filter(Boolean).length}/5</b><br>Hơi lạnh thấm qua lớp áo. Ánh sáng xanh nhạt rọi xuống từ khe trần.</div></div><div class="ac"><button class="ink sm" onclick="toast('Rời bí cảnh, giữ đồ đã nhặt')">Rời đi</button><button class="ink p sm" onclick="useT()">Dùng Thấu Tâm (gợi ý)</button></div>`}
function exHit(i,n,t){EX[i]=1;if(i===2){md(`<h3>Bóng băng xuất hiện!</h3>${im('q-bang-tinh','width:120px;margin:4px auto')}<p>${t}</p><div class="ac"><button class="ink p" onclick="cm();duel(1)">Vấn kiếm</button><button class="ink" onclick="cm();toast('Ngươi lùi lại, bóng băng tan đi')">Lùi lại</button></div>`);return}openP('bc',1);$('exl').innerHTML=`<b>${n}</b><br>${t}`}
function useT(){toast('Chỗ phát sáng mạnh nhất: Hồ băng')}
// ============ CẢNH TRUYỆN ============
let VN=[],vi=0,vnDone=null;
function vnPlay(seq,bg,done){VN=seq;vi=0;vnDone=done;$('vn').style.backgroundImage=`url(${I(bg)})`;$('vn').classList.add('on');vnShow()}
function vnShow(){const s=VN[vi];$('vtop').textContent=s.top||'';$('vtop').style.display=s.top?'block':'none';$('vnm').textContent=s.who;$('vtx').innerHTML=s.t;$('vpo').src=I(s.img||'nv-tien-nu');$('vpo').style.display=s.img===null?'none':'block';$('vpo2').style.display=s.me?'block':'none';if(s.me)$('vpo2').src=I('nv-tien-nu');
 $('vres').innerHTML=(s.res||[]).map((r,k)=>`<span style="animation-delay:${k*.15}s;color:${r.includes('-')?'#b85a5a':'#3a8a5a'}">${r}</span>`).join('');
 $('vch').innerHTML=(s.ch||[]).map((c,k)=>`<button onclick="choose(${k})">${c[0]}<small>${c[1]}</small></button>`).join('')}
function vnNext(){if(VN[vi].ch)return;if(++vi>=VN.length)return vnEnd();vnShow()}
function vnEnd(){$('vn').classList.remove('on');if(vnDone)vnDone();vnDone=null}
function choose(k){const s=VN[vi],c=s.ch[k];for(let n=0;n<(c[2]||0);n++)setTimeout(()=>{const h=document.createElement('div');h.className='heart';h.textContent='❤';h.style.left=(150+Math.random()*90)+'px';h.style.top=(300+Math.random()*60)+'px';$('vn').appendChild(h);setTimeout(()=>h.remove(),1200)},n*150);
 VN.splice(vi+1,0,{who:s.npc,img:s.img,t:c[3],res:c[4]});delete s.ch;vnNext()}
function talk(i){closeP();const n=NPC[i];const L={0:['Đồ nhi, mấy hôm nay tâm thần bất định, có chuyện gì sao?',[['Kể chuyện lá thư lạ','Thật thà',3,'Hừm... mùi hoa quế. Ngươi tránh xa nữ nhân đó ra. Ta sẽ cho người điều tra.',['Tử Vân Chân Nhân ❤+5','Đạo tâm +2']],['Pha trà mời sư phụ','Dùng Hoa Lộ',2,'Trà thơm. Ngươi khéo tay hơn sư tỷ ngươi nhiều.',['Tử Vân Chân Nhân ❤+3']],['Nói dối là không có gì','Che giấu',0,'... Thôi được. Lui ra đi.',['Tử Vân Chân Nhân ❤-2','Tâm cảnh -5']]]],1:['Sư muội đến xem ta luyện kiếm à? Chiêu Đào Hoa Nhất Thiểm của muội, cổ tay còn cứng lắm.',[['Xin sư huynh chỉ điểm','Học hỏi',2,'Thả lỏng... như cánh hoa rơi, đừng cố chém, để gió đưa kiếm đi.',['Lăng Tiêu ❤+3','Thân pháp +3']],['Mang trà cho huynh','Quan tâm',3,'... Cảm ơn muội. (Tai huynh ấy đỏ lên)',['Lăng Tiêu ❤+5']],['Thách đấu một trận','Gan dạ',1,'Được. Đừng khóc nhé.',['Lăng Tiêu ❤+1','Mở Vấn Kiếm']]]],2:['Ôi chà, tiểu muội muội tu tiên đây rồi. Thư ta gửi, muội đọc chưa?',[['Hỏi nàng là ai','Thẳng thắn',1,'Ta à? Một con cáo già... đùa thôi. Ta là người biết bí mật thân thế của muội.',['Hồ Mị Nương ❤+2','Mở cốt truyện: Thân thế']],['Niệm Thanh Tâm Chú','Cảnh giác',0,'Hì, tiểu cô nương thông minh đấy. Hẹn gặp ở Mê Vụ Lâm.',['Đạo tâm +3']],['Rút kiếm','Đối đầu',0,'Nóng tính quá! Vậy thử xem kiếm của muội nhanh hay hồ ly ta nhanh.',['Vào Vấn Kiếm']]]]}[i]||['Ngươi đến rồi.',[['Chào hỏi','Lễ độ',1,'Ừ. Hôm nay trời đẹp nhỉ.',[n[1]+' ❤+1']],['Tặng quà','Linh Chi',2,'Cho ta sao? ... Cảm ơn.',[n[1]+' ❤+4']],['Rời đi','',0,'...',[]]]];
 vnPlay([{top:n[1]+' · '+n[2],who:n[1],img:n[0],t:L[0],me:1},{who:n[1],img:n[0],npc:n[1],t:'(Ngươi sẽ đáp thế nào?)',ch:L[1],me:1}],n[5],()=>{if(i===2||(i===1&&Math.random()<.5))duel(i===2?2:1)})}
function startDay(){const seq=[];const T=['Giờ Thìn','Giờ Mùi','Giờ Dậu'];DAY.forEach((d,k)=>{const a=ACT[d];Object.entries(a[3]).forEach(([s,v])=>ST[s]=Math.min(100,ST[s]+v));
 const txt={0:'Ngươi lật từng trang sách cũ. Một đoạn khẩu quyết bỗng sáng tỏ trong đầu.',1:'Mồ hôi thấm áo. Kiếm trong tay nhẹ hơn hôm qua một chút.',2:'Lò đan đỏ rực. Sau ba canh giờ, hai viên Thanh Tâm Đan thành hình.',3:'Gió hậu sơn mát lạnh. Ngươi ngồi yên, nghe tim mình đập chậm lại.',4:'Sư phụ đang tỉa cây tùng. Người không nói gì, chỉ đưa ngươi một chén trà.',5:'Dược viên ướt sương. Gốc linh chi nhỏ đã nhú mầm.',6:'Thanh Thủy Trấn đông vui. Một bóng áo cam lướt qua đầu ngõ... mùi hoa quế.',7:'Quét lá cả buổi, quản sự ngoại môn thưởng 300 linh thạch.',8:'Ngươi ngủ một giấc thật sâu.'}[d];
 seq.push({top:T[k]+' · '+a[1],who:'Tô Linh Nhi',img:a[0].startsWith('nv')?a[0]:'nv-tien-nu',t:txt,res:[...Object.entries(a[3]).map(([s,v])=>s+' +'+v),a[4]]})});
 seq.push({top:'Đêm · Tĩnh Hoa Cư',who:'Tiểu Đào',img:'nv-tien-nu',t:'Sư tỷ vất vả rồi. Ngày mai là <b>ngày 13</b>... ơ, có người gửi thư cho sư tỷ này!',res:['Nhận: Thư tay']});
 vnPlay(seq,'bg-dinh-vien',()=>{drawHome();md(`<h3>Một ngày trôi qua</h3><p>Tư chất đã tăng. Lá thư không đề tên... mở ra xem?</p><div class="ac"><button class="ink p" onclick="cm();talk(2)">Mở thư</button><button class="ink" onclick="cm()">Để mai</button></div>`)})}
// ============ VẤN KIẾM ============
let D={};const STN=[['Công','kn-kiem','thắng Biến'],['Thủ','kn-thuan','thắng Công'],['Biến','kn-phong','thắng Thủ']];
const TELL={0:['Hắn siết chặt chuôi kiếm, mũi chân dồn lực về phía trước...','Sát khí bùng lên như lửa, hắn sắp lao tới!'],1:['Hắn lùi nửa bước, kiếm thu về trước ngực.','Khí tức trầm xuống như núi, không chút sơ hở.'],2:['Thân ảnh hắn chợt mờ đi, bước chân lảo đảo khó đoán.','Ánh mắt hắn liếc sang trái... rồi lại sang phải.']};
const FOE={1:['nv-kiem-tu','Lăng Tiêu','Sư muội, ra chiêu đi!'],2:['nv-ho-ly','Hồ Mị Nương','Hì hì, tiểu muội đoán được ý ta không?'],0:['nv-ma-tu','Huyết Vô Nhai','Ngươi... vẫn còn yếu lắm.']};
function duel(k=0){closeP();const f=FOE[k];D={k,f,hp:100,me:100,mt:80,et:70,r:1,used:[0,0,0]};$('den').src=I(f[0]);$('dme').src=I('nv-tien-nu');$('dnm').textContent=f[1];$('du').classList.add('on');
 $('dst').innerHTML=STN.map((s,i)=>`<button onclick="play(${i})"><img src="${I(s[1])}">${s[0]}<small>${s[2]}</small></button>`).join('');
 $('dsk').innerHTML=[['kn-am','Thấu Tâm','Nhìn rõ ý đồ'],['kn-hoi','Xuân Phong','Hồi 30%'],['kn-quang','Vấn Tâm','Lay động tâm']].map((s,i)=>`<button onclick="dsk(${i})" id="ds${i}"><img src="${I(s[0])}"><div><b>${s[1]}</b><br><span style="color:var(--ink2)">${s[2]}</span></div></button>`).join('');next(f[2])}
function bars(){$('ehw').innerHTML=`<b>${D.f[1]}</b><div class="bb h"><i style="width:${D.hp}%"></i></div><div class="bb t"><i style="width:${D.et}%"></i></div><small>Khí huyết ${D.hp} · Tâm cảnh ${D.et}</small>`;$('mhw').innerHTML=`<b>Tô Linh Nhi</b><div class="bb h"><i style="width:${D.me}%"></i></div><div class="bb t"><i style="width:${D.mt}%"></i></div><small>Khí huyết ${D.me} · Tâm cảnh ${D.mt}</small>`;$('drn').textContent='Hiệp '+D.r}
function next(pre){D.e=Math.random()<.6?[0,1,2][D.r%3===0?2:Math.floor(Math.random()*3)]:Math.floor(Math.random()*3);D.lie=Math.random()<.2;const tell=D.lie?TELL[(D.e+1)%3]:TELL[D.e];$('dtx').innerHTML=(pre?`“${pre}”<br>`:'')+`<i>${tell[Math.floor(Math.random()*2)]}</i>`;bars()}
function play(s){const e=D.e,win=(s===0&&e===2)||(s===1&&e===0)||(s===2&&e===1),draw=s===e;const cl=$('dcl');cl.textContent=draw?'Ngang tài!':win?STN[s][0]+' phá '+STN[e][0]+'!':STN[e][0]+' phá '+STN[s][0]+'...';cl.classList.remove('on');cl.offsetWidth;cl.classList.add('on');
 if(win){D.hp=Math.max(0,D.hp-ri(22,30));D.et=Math.max(0,D.et-10);$('den').animate([{transform:'translateX(0)'},{transform:'translateX(14px)'},{transform:'none'}],{duration:300})}else if(!draw){D.me=Math.max(0,D.me-ri(16,24));D.mt=Math.max(0,D.mt-8);$('dme').animate([{transform:'translateX(0)'},{transform:'translateX(-14px)'},{transform:'none'}],{duration:300})}else{D.hp-=6;D.me-=6}
 D.r++;bars();const lines=win?['Khá lắm!','Hừ... ta khinh địch rồi.','Chiêu này... ai dạy ngươi?']:draw?['Ngươi đọc được ta sao?','Không tệ.']:['Quá chậm!','Ngươi bị lời nói đánh lừa rồi.'];
 setTimeout(()=>{if(D.hp<=0||D.et<=0)return dEnd(1);if(D.me<=0)return dEnd(0);next(lines[Math.floor(Math.random()*lines.length)]+(D.lie&&!win?' (hắn đã giả vờ)':''))},900)}
function dsk(i){if(D.used[i])return;D.used[i]=1;$('ds'+i).classList.add('used');if(i===0){$('dtx').innerHTML+=`<br><b style="color:var(--pk)">Thấu Tâm: hắn sẽ ra thế ${STN[D.e][0]}${D.lie?' (lời nói kia là giả)':''}.</b>`}else if(i===1){D.me=Math.min(100,D.me+30);D.mt=Math.min(100,D.mt+20);bars()}else{D.et=Math.max(0,D.et-35);bars();$('dtx').innerHTML=`“Vì sao ngươi phải đấu?” — ${D.f[1]} sững lại.`;if(D.et<=0)setTimeout(()=>dEnd(1,1),700)}}
function dEnd(w,talkWin){md(w?`<h3>${talkWin?'Lấy lời thắng kiếm':'Vấn Kiếm thắng'}</h3>${im(D.f[0],'height:150px;margin:auto')}<p>${D.f[1]}: “${talkWin?'... Được, lần này ta nhường ngươi.':'Ngươi tiến bộ nhanh thật.'}”</p><p style="color:var(--gr);font-weight:600">Kiếm ý +3 · ${D.f[1]} ❤+4 · Thân pháp +2</p><div class="ac"><button class="ink p" onclick="cm();$('du').classList.remove('on')">Thu kiếm</button></div>`:`<h3>Bại trận</h3><p>Ngươi ngã xuống, kiếm rơi khỏi tay. ${D.f[1]} quay lưng bỏ đi.</p><p style="color:#b85a5a">Tâm cảnh -10 · nghỉ 1 ngày</p><div class="ac"><button class="ink p" onclick="cm();duel(${D.k})">Đấu lại</button><button class="ink" onclick="cm();$('du').classList.remove('on')">Về động phủ</button></div>`)}
drawHome();
</script></body></html>
