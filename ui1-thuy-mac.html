<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thủy Mặc Tu Tiên</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<script>
/* Bộ ảnh 2D vẽ bằng SVG + dữ liệu mẫu dùng chung cho 4 bản demo UI */
(function () {
  const shade = (h, p) => {
    let n = parseInt(h.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = v => Math.max(0, Math.min(255, Math.round(v + (p < 0 ? v : 255 - v) * p / 100)));
    return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
  };
  const P = {
    sword: `<path d="M48 6h10v10L28 46l-10-10z" fill="C"/><path d="M51 9h4v4L28 40l-4-4z" fill="#fff" opacity=".4"/><path d="M12 34l18 18-4 4-18-18z" fill="D"/><path d="M14 46l4 4-9 9-4-4z" fill="#6b4423"/>`,
    helm: `<path d="M12 40a20 22 0 0 1 40 0v6H12z" fill="C"/><rect x="8" y="44" width="48" height="8" rx="3" fill="D"/><path d="M32 6l4 12h-8z" fill="D"/><rect x="29" y="22" width="6" height="22" fill="#fff" opacity=".3"/>`,
    armor: `<path d="M20 8l12 6 12-6 12 10-6 10v28H14V28L8 18z" fill="C"/><path d="M32 14v42M14 36h36" stroke="D" stroke-width="4"/>`,
    belt: `<rect x="4" y="24" width="56" height="16" rx="4" fill="C"/><rect x="24" y="20" width="16" height="24" rx="3" fill="D"/><circle cx="32" cy="32" r="4" fill="#fff" opacity=".6"/>`,
    boots: `<path d="M18 6h18v34l18 8v10H14V44z" fill="C"/><path d="M14 52h40v6H14z" fill="D"/>`,
    ring: `<circle cx="32" cy="38" r="18" fill="none" stroke="C" stroke-width="7"/><path d="M24 12h16l4 8-12 10-12-10z" fill="D"/>`,
    jade: `<path d="M32 4v10" stroke="#c0392b" stroke-width="3"/><circle cx="32" cy="34" r="20" fill="C"/><circle cx="32" cy="34" r="7" fill="D"/><path d="M28 54l4 8 4-8" fill="#c0392b"/>`,
    bell: `<path d="M32 6c-12 0-16 12-16 26v10l-6 8h44l-6-8V32c0-14-4-26-16-26z" fill="C"/><rect x="10" y="48" width="44" height="6" rx="3" fill="D"/><circle cx="32" cy="58" r="4" fill="D"/>`,

    egg: `<ellipse cx="32" cy="36" rx="18" ry="24" fill="C"/><path d="M18 30l8 6 6-8 6 8 8-6" stroke="D" stroke-width="3" fill="none"/>`,
    feather: `<path d="M50 6C20 14 12 38 14 58 30 50 52 30 50 6z" fill="C"/><path d="M14 58L44 16" stroke="D" stroke-width="3"/>`,

    mail: `<rect x="6" y="14" width="52" height="36" rx="3" fill="C"/><path d="M6 16l26 20 26-20" stroke="D" stroke-width="4" fill="none"/>`,
    gift: `<rect x="8" y="24" width="48" height="32" fill="C"/><rect x="6" y="18" width="52" height="10" fill="D"/><rect x="28" y="18" width="8" height="38" fill="#ffd54f"/><path d="M32 18c-6-12-18-10-14 0M32 18c6-12 18-10 14 0" stroke="#ffd54f" stroke-width="4" fill="none"/>`,

    house: `<path d="M2 26L32 8l30 18z" fill="D"/><rect x="12" y="26" width="40" height="28" fill="C"/><rect x="26" y="36" width="12" height="18" fill="D"/><path d="M2 56h60" stroke="D" stroke-width="4"/>`,
    flag: `<path d="M14 4v56" stroke="D" stroke-width="5"/><path d="M16 8h38l-8 12 8 12H16z" fill="C"/>`,
    flame: `<path d="M32 4c4 14 20 20 20 36a20 20 0 0 1-40 0c0-10 6-14 8-22 4 6 6 8 8 8-2-8 0-16 4-22z" fill="C"/><path d="M32 30c2 8 10 10 10 18a10 10 0 0 1-20 0c0-6 6-10 10-18z" fill="#ffe082"/>`,
    wave: `<path d="M4 40q8-12 16 0t16 0 16 0 8 0v20H4z" fill="C"/><path d="M4 26q8-12 16 0t16 0 16 0 8 0" stroke="D" stroke-width="4" fill="none"/>`,
    leaf: `<path d="M8 56C8 24 28 8 58 6c0 30-18 50-50 50z" fill="C"/><path d="M8 56L44 20" stroke="D" stroke-width="3"/>`,
    bolt: `<path d="M38 2L12 36h16l-4 26 28-36H36z" fill="C"/>`,
    mountain: `<path d="M2 56L22 18l10 14 8-10 22 34z" fill="C"/><path d="M22 18l-6 12h12z" fill="#fff"/>`,
    crane: `<path d="M8 40q20-30 44-22-10 2-14 10 14 4 22 22-20-10-34-4z" fill="C"/><path d="M52 18l8-6" stroke="D" stroke-width="3"/><circle cx="52" cy="17" r="3" fill="#e53935"/>`,
    star: `<path d="M32 4l8 18 20 2-15 13 5 20-18-11-18 11 5-20L4 24l20-2z" fill="C"/>`,
    coin: `<circle cx="32" cy="32" r="26" fill="C"/><circle cx="32" cy="32" r="20" fill="none" stroke="D" stroke-width="3"/><rect x="25" y="25" width="14" height="14" fill="D"/>`,
    gem: `<path d="M12 22l10-12h20l10 12-20 32z" fill="C"/><path d="M12 22h40M22 10l10 44 10-44" stroke="#fff" stroke-width="2" opacity=".5" fill="none"/>`,
    shield: `<path d="M32 4l24 8v18c0 16-10 26-24 32C18 56 8 46 8 30V12z" fill="C"/><path d="M32 12v42" stroke="D" stroke-width="4"/>`,
    book: `<path d="M8 10h22q2 0 2 4v42q0-4-4-4H8zM56 10H34q-2 0-2 4v42q0-4 4-4h20z" fill="C"/><path d="M14 20h12M38 20h12M14 28h12M38 28h12" stroke="D" stroke-width="2"/>`,
    skull: `<path d="M32 6c14 0 24 10 24 24 0 8-4 12-8 14v10H16V44c-4-2-8-6-8-14C8 16 18 6 32 6z" fill="C"/><circle cx="23" cy="30" r="6" fill="D"/><circle cx="41" cy="30" r="6" fill="D"/><path d="M26 50v6M32 50v6M38 50v6" stroke="D" stroke-width="2"/>`,
    fist: `<rect x="14" y="20" width="36" height="28" rx="8" fill="C"/><path d="M23 20v14M32 20v14M41 20v14" stroke="D" stroke-width="3"/><rect x="20" y="46" width="24" height="14" fill="D"/>`,
    eye: `<path d="M4 32q28-28 56 0-28 28-56 0z" fill="C"/><circle cx="32" cy="32" r="10" fill="D"/><circle cx="32" cy="32" r="4" fill="#fff"/>`,
    trophy: `<path d="M18 12H8q0 14 12 14M46 12h10q0 14-12 14" stroke="C" stroke-width="4" fill="none"/><path d="M18 6h28v16a14 14 0 0 1-28 0z" fill="C"/><rect x="28" y="36" width="8" height="12" fill="D"/><rect x="18" y="48" width="28" height="8" fill="D"/>`,
    people: `<circle cx="22" cy="20" r="9" fill="C"/><circle cx="44" cy="22" r="8" fill="D"/><path d="M6 56c0-14 8-22 16-22s16 8 16 22z" fill="C"/><path d="M30 56c2-12 8-18 14-18s14 6 14 18z" fill="D"/>`,
    cauldron: `<path d="M8 22h48v6c0 16-10 26-24 26S8 44 8 28z" fill="C"/><rect x="4" y="18" width="56" height="6" rx="3" fill="D"/><path d="M16 52l-4 8M48 52l4 8M32 54v6" stroke="D" stroke-width="4"/><path d="M24 14q4-6 0-10M40 14q4-6 0-10" stroke="#bbb" stroke-width="3" fill="none"/>`,
    paw: `<ellipse cx="32" cy="42" rx="14" ry="12" fill="C"/><circle cx="14" cy="28" r="6" fill="C"/><circle cx="24" cy="16" r="6" fill="C"/><circle cx="40" cy="16" r="6" fill="C"/><circle cx="50" cy="28" r="6" fill="C"/>`,
    yin: `<circle cx="32" cy="32" r="26" fill="D"/><path d="M32 6a26 26 0 0 1 0 52a13 13 0 0 1 0-26a13 13 0 0 0 0-26z" fill="C"/><circle cx="32" cy="19" r="4" fill="D"/><circle cx="32" cy="45" r="4" fill="C"/>`,
    clock: `<circle cx="32" cy="32" r="26" fill="C"/><path d="M32 14v18l12 8" stroke="D" stroke-width="5" fill="none"/>`,
    battle: `<path d="M8 8h6l34 34-6 6L8 14zM56 8h-6L16 42l6 6L56 14z" fill="C"/><path d="M40 46l10-10 6 6-10 10zM24 46L14 36l-6 6 10 10z" fill="D"/>`,
    orb: `<circle cx="32" cy="32" r="24" fill="C"/><circle cx="24" cy="24" r="8" fill="#fff" opacity=".5"/>`,
    dragon: `<path d="M6 44q10-30 30-24t22-10q-2 18-18 20t-24 20z" fill="C"/><path d="M20 34l-4-8M30 28l-2-8" stroke="D" stroke-width="3"/><circle cx="50" cy="16" r="2.5" fill="#fff"/>`,
    tower: `<path d="M32 2l10 10H22z" fill="D"/><rect x="24" y="12" width="16" height="10" fill="C"/><path d="M18 22h28l-6 6H24z" fill="D"/><rect x="22" y="28" width="20" height="12" fill="C"/><path d="M14 40h36l-6 6H20z" fill="D"/><rect x="20" y="46" width="24" height="14" fill="C"/>`,
    shop: `<path d="M6 22l6-14h40l6 14z" fill="D"/><rect x="10" y="22" width="44" height="34" fill="C"/><rect x="18" y="32" width="12" height="24" fill="D"/><rect x="36" y="30" width="12" height="10" fill="#fff" opacity=".6"/>`,
    lock: `<rect x="12" y="28" width="40" height="30" rx="5" fill="C"/><path d="M20 28v-8a12 12 0 0 1 24 0v8" stroke="C" stroke-width="6" fill="none"/><circle cx="32" cy="42" r="5" fill="D"/>`
  };
  const icon = (name, c = '#c9a25a', cls = 'ic') =>
    `<svg viewBox="0 0 64 64" class="${cls}" aria-hidden="true">${(P[name] || P.orb).replace(/="C"/g, `="${c}"`).replace(/="D"/g, `="${shade(c, -40)}"`)}</svg>`;

  let uid = 0;
  /* Nhân vật ngồi thiền / đứng (2D vector) */
  function hero(o = {}) {
    const k = ++uid, robe = o.robe || '#e9eef3', robe2 = o.robe2 || '#9fb3c8', hair = o.hair || '#1d1b22', skin = o.skin || '#f6dcc6',
      aura = o.aura || '#8fd3ff', sash = o.sash || '#4a5c8a', orb = o.orb || '#6ae0ff', gold = o.gold || '#e8c25a';
    const vb = o.vb || '0 0 200 260';
    return `<svg viewBox="${vb}" class="${o.cls || 'hero'}" aria-hidden="true"><defs>
<radialGradient id="ha${k}"><stop offset="0" stop-color="${aura}" stop-opacity=".75"/><stop offset="1" stop-color="${aura}" stop-opacity="0"/></radialGradient>
<linearGradient id="hr${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${robe}"/><stop offset="1" stop-color="${robe2}"/></linearGradient>
<radialGradient id="ho${k}"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="${orb}"/><stop offset="1" stop-color="${orb}" stop-opacity="0"/></radialGradient></defs>
${o.noAura ? '' : `<circle cx="100" cy="120" r="100" fill="url(#ha${k})"/>`}
${o.halo ? `<circle cx="100" cy="68" r="44" fill="none" stroke="${gold}" stroke-width="3" opacity=".8"/>` : ''}
<path d="M80 60Q62 120 70 160L86 110ZM120 60Q138 120 130 160L114 110Z" fill="${hair}"/>
<path d="M28 232Q100 184 172 232Q170 252 100 254Q30 252 28 232Z" fill="url(#hr${k})"/>
<path d="M70 108Q100 96 130 108L150 222Q100 238 50 222Z" fill="url(#hr${k})"/>
<path d="M66 160H134L136 172H64Z" fill="${sash}"/>
<path d="M70 112Q38 150 50 204L88 200Q76 160 88 128ZM130 112Q162 150 150 204L112 200Q124 160 112 128Z" fill="url(#hr${k})" stroke="${robe2}" stroke-width="1"/>
<path d="M86 104L100 140L114 104" fill="none" stroke="${gold}" stroke-width="3"/>
<ellipse cx="86" cy="198" rx="10" ry="7" fill="${skin}"/><ellipse cx="114" cy="198" rx="10" ry="7" fill="${skin}"/>
<circle cx="100" cy="190" r="26" fill="url(#ho${k})"/>
<rect x="93" y="86" width="14" height="20" fill="${skin}"/>
<ellipse cx="100" cy="70" rx="22" ry="26" fill="${skin}"/>
<path d="M77 72Q72 38 100 38Q128 38 123 72Q120 50 100 50Q80 50 77 72Z" fill="${hair}"/>
<circle cx="100" cy="34" r="11" fill="${hair}"/><rect x="88" y="26" width="24" height="5" rx="2" fill="${gold}"/>
${o.horns ? `<path d="M82 46L70 14L90 40ZM118 46L130 14L110 40Z" fill="${gold}"/>` : ''}
${o.mask ? `<path d="M80 62H120V78Q100 88 80 78Z" fill="${o.mask}"/><path d="M86 68h10M104 68h10" stroke="#ff3b3b" stroke-width="3"/>` :
        `<path d="M87 72q5 3 10 0M103 72q5 3 10 0" stroke="#3a2a2a" stroke-width="2" fill="none"/><path d="M96 84q4 2 8 0" stroke="#c46a6a" stroke-width="2" fill="none"/>`}
</svg>`;
  }

  /* Tọa kỵ */
  function mount(type, c = '#ffffff') {
    const d = shade(c, -35);
    const m = {
      crane: `<path d="M40 90Q60 60 110 70L150 40Q160 36 162 44L130 80Q140 100 110 108Q70 116 40 90Z" fill="${c}"/><path d="M60 80Q20 40 10 20Q60 30 100 72Z" fill="${d}"/><path d="M90 76Q110 20 170 10Q150 50 112 82Z" fill="${c}" stroke="${d}"/><path d="M150 40L176 34L152 46Z" fill="#e8a33a"/><circle cx="156" cy="38" r="5" fill="#e53935"/><path d="M95 108L90 136M110 106L112 136" stroke="#555" stroke-width="3"/><path d="M40 90L14 100L44 96Z" fill="#222"/>`,
      qilin: `<ellipse cx="96" cy="78" rx="52" ry="26" fill="${c}"/><path d="M58 92v38M76 98v32M116 98v32M134 92v38" stroke="${d}" stroke-width="10" stroke-linecap="round"/><path d="M140 66Q160 30 178 40Q186 60 160 74Z" fill="${c}"/><path d="M168 36L176 12L172 38Z" fill="#ffd54f"/><circle cx="170" cy="48" r="3" fill="#222"/><path d="M44 72Q10 60 20 30Q30 60 50 64Z" fill="#ff7043"/><path d="M120 56Q130 40 150 50Q140 60 128 66Z" fill="#ff7043"/><path d="M70 70q26 -10 52 0" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>`,
      sword: `<path d="M20 100L170 40L178 48L30 112Z" fill="${c}"/><path d="M30 104L172 44" stroke="#fff" stroke-width="2" opacity=".7"/><path d="M28 92L40 120M20 100L8 108" stroke="${d}" stroke-width="8"/><ellipse cx="80" cy="116" rx="60" ry="12" fill="#fff" opacity=".6"/><ellipse cx="120" cy="120" rx="40" ry="9" fill="#fff" opacity=".5"/>`,
      cloud: `<g fill="${c}"><circle cx="60" cy="90" r="26"/><circle cx="96" cy="76" r="34"/><circle cx="136" cy="90" r="26"/><rect x="40" y="90" width="120" height="26" rx="13"/></g><path d="M54 112q46 14 92 0" stroke="${d}" stroke-width="4" fill="none"/><path d="M150 100q30 0 36 -20" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round"/>`,
      phoenix: `<path d="M30 96Q70 40 120 60L160 30Q168 40 150 58Q150 96 110 104Q70 112 30 96Z" fill="${c}"/><path d="M70 70Q40 10 10 10Q40 50 60 90Z" fill="${d}"/><path d="M100 64Q120 0 180 6Q150 40 116 80Z" fill="${d}"/><path d="M30 96Q0 120 6 136Q30 120 50 104Z" fill="${c}"/><circle cx="156" cy="40" r="3" fill="#fff"/>`
    };
    return `<svg viewBox="0 0 200 140" class="mnt" aria-hidden="true">${m[type] || m.cloud}</svg>`;
  }

  /* Phong cảnh núi non */
  function scenery(cols = ['#c9d6dc', '#9fb2bb', '#6f858f'], sun = '#f6e7c8', cls = 'scn') {
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" class="${cls}" aria-hidden="true">
<circle cx="300" cy="90" r="56" fill="${sun}" opacity=".85"/>
<path d="M0 190L40 120L70 150L120 70L170 140L210 110L260 170L300 100L350 150L400 120V300H0Z" fill="${cols[0]}"/>
<path d="M0 230L50 170L90 200L140 150L200 210L250 160L310 220L360 180L400 200V300H0Z" fill="${cols[1]}"/>
<rect x="0" y="210" width="400" height="22" fill="#fff" opacity=".35"/>
<path d="M0 270L60 230L120 260L190 220L260 262L330 230L400 255V300H0Z" fill="${cols[2]}"/></svg>`;
  }

  /* Lầu các / kiến trúc */
  function pagoda(c = '#a8322a', w = '#e9dcc2', tiers = 3) {
    let s = '', y = 90;
    for (let i = 0; i < tiers; i++) {
      const wd = 70 - i * 14, x = 50 - wd / 2;
      s += `<rect x="${x + 6}" y="${y - 16}" width="${wd - 12}" height="16" fill="${w}"/><rect x="${x + 14}" y="${y - 12}" width="6" height="12" fill="${shade(c, -30)}"/><rect x="${x + wd - 20}" y="${y - 12}" width="6" height="12" fill="${shade(c, -30)}"/>`;
      s += `<path d="M${x - 6} ${y - 14}Q50 ${y - 30} ${x + wd + 6} ${y - 14}L${x + wd - 4} ${y - 22}H${x + 4}Z" fill="${c}"/>`;
      y -= 24;
    }
    return `<svg viewBox="0 0 100 100" class="pgd" aria-hidden="true"><rect x="10" y="90" width="80" height="6" fill="${shade(w, -30)}"/>${s}<path d="M50 ${y - 12}V${y + 4}" stroke="#e8c25a" stroke-width="3"/></svg>`;
  }

  const RAR = [
    { n: 'Phàm phẩm', c: '#9aa0a6' }, { n: 'Lương phẩm', c: '#43a047' }, { n: 'Tinh phẩm', c: '#2f8fe0' },
    { n: 'Huyền phẩm', c: '#9c4fe0' }, { n: 'Địa phẩm', c: '#f0901e' }, { n: 'Thiên phẩm', c: '#e53935' }
  ];
  const T = { pill: 'Đan dược', mat: 'Nguyên liệu', eq: 'Trang bị', book: 'Bí tịch', spe: 'Đặc biệt' };
  const it = (n, i, c, r, t, q, d) => ({ n, i, c, r, t, q, d });
  const ITEMS = [
    it('Tụ Khí Đan', 'pill', '#7fd0ff', 1, 'pill', 128, 'Tăng 500 tu vi khi dùng. Thích hợp cho tu sĩ Luyện Khí.'),
    it('Trúc Cơ Đan', 'pill', '#ffd166', 2, 'pill', 6, 'Tăng 20% tỉ lệ đột phá Trúc Cơ.'),
    it('Kết Kim Đan', 'pill', '#f4a261', 3, 'pill', 3, 'Ngưng tụ kim đan, tăng 15% tỉ lệ độ kiếp.'),
    it('Phá Chướng Đan', 'pill', '#c77dff', 4, 'pill', 2, 'Xóa 30 điểm tâm ma ngay lập tức.'),
    it('Cửu Chuyển Hoàn Hồn Đan', 'pill', '#ff4d6d', 5, 'pill', 1, 'Hồi sinh khi độ kiếp thất bại, giữ lại toàn bộ tu vi.'),
    it('Hồi Xuân Đan', 'pill', '#8ce99a', 1, 'pill', 45, 'Hồi 30% khí huyết trong chiến đấu.'),
    it('Linh Chi Nghìn Năm', 'herb', '#e76f51', 3, 'mat', 12, 'Linh dược nghìn năm, nguyên liệu luyện Kết Kim Đan.'),

/* congphap tree */
.tree{position:relative;width:100%;max-width:380px;aspect-ratio:1/1.05;margin:0 auto}
.tree svg.ln{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:23%;transform:translate(-50%,-50%);text-align:center;font-size:11px}
.node .c{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:Charm;font-size:26px;font-weight:700;border:3px solid #fff;box-shadow:0 0 0 2px var(--ink),0 4px 10px #0004}

.center .c{background:var(--ink)!important;font-size:18px}

.load{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px;background:#fff8;border:1px solid var(--line);margin-bottom:12px}
.load button{width:52px;text-align:center;font-size:10px}
.load i{display:block;width:48px;height:48px;border-radius:50%;padding:9px;border:2px solid var(--ink);background:var(--paper)}
.sk{display:flex;gap:10px;align-items:center;padding:10px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.sk>i{width:52px;height:52px;flex:none;border-radius:50%;padding:10px;background:var(--ink)}
.sk .tx{flex:1;min-width:0;font-size:12px;line-height:1.4}
.sk .tx b{font-size:14px;display:block}
.sk .tx p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink2)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;background:var(--red);color:#fff;margin-left:4px;vertical-align:2px}
/* mount */
.mstage{position:relative;height:230px;background:linear-gradient(#e4edf0,#f1ebdd);border:1px solid var(--line);overflow:hidden}
.mstage .mnt{position:absolute;left:10%;right:10%;bottom:10px;width:80%;height:80%}
.mstage .nm{position:absolute;left:10px;top:10px;font-family:Charm;font-size:26px;writing-mode:vertical-rl;background:var(--ink);color:#fff;padding:8px 4px}
.mlist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.mlist button{aspect-ratio:1;border:2px solid var(--line);background:#fff;padding:4px;position:relative}
.mlist button.on{border-color:var(--red)}
.mlist .lk{position:absolute;inset:0;background:#fffb;padding:14px}
/* bi canh path */
.path{position:relative;padding:10px 0}
.path::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--ink2)}
.dn{position:relative;display:flex;align-items:center;gap:10px;width:62%;margin:0 0 16px;padding:8px;background:#fff;border:1px solid var(--line)}
.dn:nth-child(odd){margin-left:auto;flex-direction:row-reverse;text-align:right}
.dn>i{width:52px;height:52px;flex:none;padding:6px;border-radius:50%;background:var(--paper2);border:2px solid var(--ink)}
.dn .tx{min-width:0;flex:1;font-size:11px}
.dn .tx b{font-size:14px;display:block}
.dn.lock{opacity:.55;filter:grayscale(1)}
.st{display:inline-block;padding:1px 6px;font-size:10px;border:1px solid currentColor}
/* dong phu */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd{background:#fff;border:1px solid var(--line);padding:10px;text-align:center;font-size:11px}

.sectmap .b .pgd{width:90px;height:90px}
.sectmap .b span{display:inline-block;writing-mode:vertical-rl;background:var(--ink);color:#fff;padding:6px 3px;font-family:Charm;font-size:15px;position:absolute;left:-14px;top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;background:#fff;border:1px solid var(--line);margin-bottom:8px;font-size:13px}
.row .tx{min-width:0;flex:1}.row small{color:var(--ink2);display:block}
/* combat */
#combat{background:#1d1b19;color:#f1ebdd}
.arena{position:relative;flex:1;overflow:hidden}
.arena .scn{opacity:.35}
.fs{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.fs.e{top:4%}.fs.p{bottom:2%}
.fs .hero{height:150px}
.hpb{width:70%;font-size:12px;text-align:center}
.hpb .t{height:10px;background:#000;border:1px solid #f1ebdd66;margin-top:3px}
.hpb .t i{display:block;height:100%;background:linear-gradient(90deg,#a8322a,#e85a4a);transition:width .3s}
.fs.p .hpb .t i{background:linear-gradient(90deg,#2f8f6a,#6fd3a3)}
.dmg{position:absolute;left:50%;top:30%;font-size:30px;font-weight:700;color:#ffcf5a;text-shadow:0 2px 0 #000;animation:up .9s forwards;pointer-events:none}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.round{position:absolute;top:44%;left:0;right:0;text-align:center;font-family:Charm;font-size:26px;color:#e8c25a}
.cbar{display:flex;gap:8px;justify-content:center;padding:10px;background:#000a}
.cbar button{width:58px;font-size:10px;text-align:center}
.cbar i{display:block;width:52px;height:52px;margin:0 auto 2px;border-radius:50%;padding:10px;border:2px solid #e8c25a;background:#2b2724}
.clog{height:96px;overflow:auto;padding:6px 12px;font-size:11px;line-height:1.6;background:#000c}
.clog b{color:#ff8a65}.clog u{color:#7fd3a3;text-decoration:none}
/* MODAL */
.modal{position:absolute;inset:0;background:#0007;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.box{position:relative;width:100%;max-height:86%;display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--ink);box-shadow:0 0 0 6px var(--paper),0 0 0 7px var(--ink),0 20px 40px #0006;animation:pop .2s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.box h3{font-family:Charm;font-size:24px;text-align:center;padding:10px 40px 6px;border-bottom:1px solid var(--line)}
.box .x{position:absolute;right:6px;top:6px;width:32px;height:32px;font-size:20px}
.box .bd2{overflow:auto;padding:14px;font-size:13px;line-height:1.55}
.box .acts{display:flex;gap:8px;justify-content:center;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.ihead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ihead .cell{width:72px;flex:none}
.ihead b{font-size:17px;display:block}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted var(--line)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days div{background:#fff;border:1px solid var(--line);padding:6px 4px;text-align:center;font-size:10px}
.days div i{display:block;width:34px;height:34px;margin:2px auto}
.days div.got{opacity:.5}.days div.today{border:2px solid var(--red)}
.days div:last-child{grid-column:span 2}
.mail{display:flex;gap:10px;padding:8px;border-bottom:1px solid var(--line);align-items:center}
.mail i{width:36px;height:36px;flex:none}
.mail .tx{min-width:0;flex:1}.mail .tx b{display:block}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;font-size:13px;z-index:99;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.rootbar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.rootbar b{width:42px}.rootbar .t{flex:1;height:12px;background:#0001;border:1px solid var(--line)}
.rootbar .t i{display:block;height:100%}
</style></head><body>
<div class="phone" id="app">
  <div id="home">

      <div class="side"><button onclick="go('combat')" title="Chiến đấu" id="sb1"></button><button onclick="M('kyngo')" title="Kỳ Ngộ" id="sb2"></button></div>

      <button class="rb" onclick="go('congphap','Linh Căn')"><i id="ib1"></i>Linh Căn</button>

    <div class="nav" id="nav"></div>
  </div>
  <div class="page" id="page"><div class="ph"><button class="bk" onclick="back()">←</button><h2 id="ptitle"></h2><div class="rs" id="prs"></div></div><div class="tabs" id="ptabs"></div><div class="pb" id="pbody"></div><div id="pfoot"></div></div>
  <div class="page" id="combat"></div>
  <div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="box"><button class="x" onclick="closeM()">✕</button><h3 id="mt"></h3><div class="bd2" id="mb"></div><div class="acts" id="ma"></div></div></div>

</div>
<script>
const {icon,hero,mount,scenery,pagoda,RAR,T,ITEMS,SLOTS,SKILLS,GONG,MOUNTS,DUNGEONS,BUILD,SECT,TASKS,MEMBERS,RANK,MAILS,DAYS,ROOTS,PLAYER:P,LOGS,ENEMY,fmt}=GA;
const $=id=>document.getElementById(id);
const HERO={robe:'#f4f1ea',robe2:'#8a9bb0',sash:'#2c3e50',aura:'#d8e6ef',orb:'#7fd3ff'};
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)};
const cell=(x,q=true)=>x?`<button class="cell" style="--r:${RAR[x.r].c}" onclick="itemM('${x.n}')">${icon(x.i,x.c)}${q&&x.q>1?`<em>${fmt(x.q)}</em>`:''}</button>`:`<div class="cell empty"></div>`;
// HOME
$('scnHome').innerHTML=scenery(['#d9dfdc','#b7c2c0','#8e9b99'],'#fbf3dc');
$('stage').insertAdjacentHTML('beforeend',hero(HERO));
$('ava').innerHTML=hero({...HERO,vb:'64 26 72 72',noAura:1});
$('pname').textContent=P.name;$('psect').textContent=P.sect+' · Lv '+P.lv;$('prealm').textContent='Cảnh giới: '+P.realm+' '+P.layer;
$('res').innerHTML=[['Linh Thạch',P.stone],['Tiên Ngọc',P.jade],['Tu Luyện',P.age]].map(r=>`<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
const FEAT=[['gear','Cài Đặt',"M('caidat')"],['mail','Phi Thư',"M('thu')",1],['gift','Sự Kiện',"M('sukien')",1],['trophy','Xếp Hạng',"M('xephang')"],['shop','Thương Hội',"M('shop')"],['coin','Nạp Đầu',"M('napdau')"]];
$('feat').innerHTML=FEAT.map(f=>`<button onclick="${f[2]}" class="${f[3]?'dot':''}"><i>${icon(f[0],'#4a4036')}</i><span>${f[1]}</span></button>`).join('');
$('rl').textContent=`Kết Đan ${P.layer} · ${fmt(P.need)} tu vi`;
$('sb1').innerHTML=icon('battle','#a8322a');$('sb2').innerHTML=icon('star','#b08a3e');
$('ib1').innerHTML=icon('yin','#f1ebdd');$('ib2').innerHTML=icon('book','#f1ebdd');
$('rate').textContent=P.rate;$('tvbar').style.width=P.tuvi/P.need*100+'%';$('tv').textContent=`Tu vi ${fmt(P.tuvi)} / ${fmt(P.need)}`;
$('log').innerHTML=LOGS.map(l=>l.replace(P.name,'<b>'+P.name+'</b>')).join('<br>');
const NAV=[['bag','Túi Đồ','tuido',1],['people','Nhân Vật','nhanvat'],['book','Công Pháp','congphap'],['flag','Môn Phái','monphai',1],['house','Động Phủ','dongphu'],['map','Lịch Luyện','lichluyen']];
$('nav').innerHTML=NAV.map(n=>`<button onclick="go('${n[2]}')" class="${n[3]?'dot':''}"><i>${icon(n[0],'#3a332b')}</i><span>${n[1]}</span></button>`).join('');
// PAGES
const PG={
 tuido:{t:'Túi Đồ',tabs:['Tất cả','Đan dược','Nguyên liệu','Trang bị','Bí tịch','Đặc biệt'],r(tab){
   const k=Object.keys(T).find(k=>T[k]===tab);const l=ITEMS.filter(x=>!k||x.t===k);
   const cells=l.map(x=>cell(x)).join('')+Array(Math.max(0,25-l.length)).fill(cell()).join('');
   return `<div class="grid">${cells}</div>`},
   foot:()=>`<div class="foot"><span>Sức chứa <b>${ITEMS.length}/60</b></span><div style="display:flex;gap:6px"><button class="btn g" onclick="M('mo')">Mở rộng</button><button class="btn" onclick="toast('Đã sắp xếp túi đồ')">Sắp xếp</button></div></div>`},
 nhanvat:{t:'Nhân Vật',tabs:['Trang Bị','Thuộc Tính','Tọa Kỵ'],r(tab){
   if(tab==='Trang Bị'){const s=i=>{const x=SLOTS[i];const itm=x.it&&GA.item(x.it);return `<div class="slot">${itm?cell(itm,0):`<button class="cell empty" style="padding:14px;opacity:.5" onclick="M('chon','${x.s}')">${icon(x.i,'#999')}</button>`}${x.s}</div>`};
     return `<div class="doll"><div class="col">${[0,1,2,3].map(s).join('')}</div><div class="mid">${hero(HERO)}</div><div class="col">${[4,5,6,7].map(s).join('')}</div></div>
     <div class="pow">Lực chiến ${P.power}</div><div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button class="btn" onclick="M('cuonghoa')">Cường Hóa</button><button class="btn g" onclick="M('khamngoc')">Khảm Ngọc</button><button class="btn r" onclick="toast('Đã mặc trang bị tốt nhất')">Mặc Nhanh</button></div>`}
   if(tab==='Thuộc Tính')return `<div class="sec">Thuộc tính</div><div class="stats">${P.stats.map(s=>`<div><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div><div class="sec" style="margin-top:14px">Linh căn</div>${roots()}`;
   return mountUI(0)}},
 congphap:{t:'Công Pháp',tabs:['Công Pháp','Kỹ Năng','Linh Căn'],r(tab){
   if(tab==='Công Pháp'){const pos=[[50,14],[16,36],[84,36],[16,72],[84,72],[50,92]];
     return `<div class="tree"><svg class="ln" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 14V92M16 36H84M16 72H84M16 36V72M84 36V72" stroke="#26221d" stroke-width=".6" fill="none" stroke-dasharray="2 1"/></svg>
     ${GONG.map((g,i)=>`<button class="node" style="left:${pos[i][0]}%;top:${pos[i][1]}%" onclick="gongM(${i})"><div class="c" style="background:${g.c}">${g.k}</div><small class="one">${g.b}</small></button>`).join('')}
     <button class="node center" style="left:50%;top:54%" onclick="M('dao')"><div class="c">Đạo</div><small>Thái Thượng</small></button></div>
     <div class="sec">Tổng thuộc tính</div><div class="stats">${GONG.map(g=>`<div><span>${g.n}</span><b>Lv${g.lv}</b></div>`).join('')}</div>`}
   if(tab==='Kỹ Năng')return `<div class="sec">Cài chiêu thức</div><div class="load">${SKILLS.filter(s=>s.on).map(s=>`<button onclick="skM('${s.n}')"><i style="border-color:${s.c}">${icon(s.i,s.c)}</i><span class="one" style="display:block">${s.n.split(' ').slice(0,2).join(' ')}</span></button>`).join('')}<button onclick="M('cai')"><i style="border-style:dashed;font-size:22px;line-height:26px">+</i>Thêm</button></div>
     ${SKILLS.map(s=>`<div class="sk"><i style="background:${s.c}22;border:2px solid ${s.c}">${icon(s.i,s.c)}</i><div class="tx"><b class="one">${s.n} (Lv${s.lv})${s.on?'<span class="tag">Đang dùng</span>':''}</b><p>${s.d}</p><small>Hồi chiêu: ${s.cd} hiệp</small></div><button class="btn" onclick="skM('${s.n}')">Nâng cấp</button></div>`).join('')}`;
   return `<div class="sec">Ngũ hành linh căn</div>${roots()}<p style="font-size:12px;color:var(--ink2);margin-top:10px">Linh căn Mộc mạnh nhất, thích hợp tu luyện công pháp hồi phục và độc thuật.</p><div style="text-align:center;margin-top:14px"><button class="btn r" onclick="M('tayle')">Tẩy Linh Căn</button></div>`}},
 monphai:{t:'Thái Huyền Môn',tabs:['Tông Môn','Nhiệm Vụ','Đồng Môn','Cống Hiến'],r(tab){
   if(tab==='Tông Môn'){const pos=[[34,4],[8,30],[62,28],[10,60],[60,62]];
     return `<div class="sectmap">${scenery(['#dfe6e6','#bccbcc','#93a5a6'],'#fff')}${SECT.map((s,i)=>`<button class="b" style="left:${pos[i][0]}%;top:${pos[i][1]}%" onclick="M('sect',${i})">${pagoda(['#a8322a','#3d5a80','#6a4c93','#2a9d8f','#b08a3e'][i],'#efe6d2',i?2:3)}<span>${s.n}</span></button>`).join('')}</div>
     <div class="row" style="margin-top:10px"><div class="tx"><b>Cấp tông môn 7</b><small>Thành viên 86/120 · Xếp hạng 4</small></div><button class="btn" onclick="M('sectinfo')">Chi tiết</button></div>`}
   if(tab==='Nhiệm Vụ')return TASKS.map(t=>`<div class="row"><div class="tx"><b>${t.n}</b><small>${t.r} · Tiến độ ${t.p}</small></div><button class="btn" onclick="toast('Đã nhận nhiệm vụ')">Thực hiện</button></div>`).join('');
   if(tab==='Đồng Môn')return MEMBERS.map(m=>`<div class="row"><div class="tx"><b>${m[0]}</b><small>${m[1]} · ${m[2]}</small></div><button class="btn g" onclick="M('member','${m[0]}')">Xem</button></div>`).join('');
   return `<div class="grid">${ITEMS.filter(x=>x.r>=3).slice(0,10).map(x=>`<div style="text-align:center;font-size:10px">${cell(x,0)}<div class="one">${x.n}</div><b>${x.r*150} CH</b></div>`).join('')}</div>`}},
 dongphu:{t:'Động Phủ',tabs:['Kiến Trúc','Linh Điền','Trận Pháp'],r(tab){
   if(tab==='Kiến Trúc')return `<div class="bgrid">${BUILD.map((b,i)=>`<button class="bd" onclick="M('build',${i})">${pagoda(b.c,'#efe6d2',(i%3)+1)}<b>${b.n}</b><span class="lv">Cấp ${b.lv}</span><div class="one">${b.t}</div></button>`).join('')}</div>`;
   if(tab==='Linh Điền')return `<div class="grid" style="grid-template-columns:repeat(3,1fr)">${['Linh Chi','Huyết Sâm','Băng Tâm Thảo','Trống','Long Tiên Hoa','Khóa'].map((n,i)=>`<button class="bd" onclick="${n==='Khóa'?"toast('Nâng Linh Điền cấp 6 để mở')":"M('ruong','"+n+"')"}"><div style="width:48px;height:48px;margin:0 auto">${icon(n==='Khóa'?'lock':n==='Trống'?'leaf':'herb',n==='Khóa'?'#999':n==='Trống'?'#c9bb9c':'#4caf50')}</div><b style="font-size:13px">${n}</b>${n!=='Trống'&&n!=='Khóa'?`<small>Còn 0${i+1}:20:00</small>`:''}</button>`).join('')}</div>`;
   return `<div class="sec">Tụ Linh Trận · Cấp 6</div><div style="width:200px;height:200px;margin:0 auto">${icon('yin','#26221d')}</div><p style="text-align:center;margin:10px 0">Tốc độ tu luyện +12% khi ngồi thiền trong động phủ.</p><div style="text-align:center"><button class="btn r" onclick="M('build',3)">Nâng cấp trận</button></div>`}},
 lichluyen:{t:'Lịch Luyện',tabs:['Bí Cảnh','Khiêu Chiến','Thí Luyện Tháp'],r(tab){
   if(tab==='Bí Cảnh')return `<div class="path">${DUNGEONS.map((d,i)=>`<button class="dn ${d.st==='Khóa'?'lock':''}" onclick="dunM(${i})"><i>${icon(d.i,d.c)}</i><div class="tx"><b class="one">${d.n}</b>Yêu cầu: ${d.req}<br><span class="st" style="color:${d.st==='Khóa'?'#777':d.st==='Đang mở'?'#a8322a':'#2f8f6a'}">${d.st}</span></div></button>`).join('')}</div>`;
   if(tab==='Khiêu Chiến')return RANK.slice(1,6).map((r,i)=>`<div class="row"><div style="width:44px;height:44px;border-radius:50%;overflow:hidden;background:#fff;border:1px solid var(--line);flex:none">${hero({robe:['#333','#8b1e3f','#3d5a80','#6a4c93','#2a9d8f'][i],robe2:'#111',vb:'64 26 72 72',noAura:1,mask:i==1?'#222':0})}</div><div class="tx"><b>${r[0]}</b><small>${r[1]} · Lực chiến ${r[2]}</small></div><button class="btn r" onclick="go('combat')">Đấu</button></div>`).join('');
   return `<div style="text-align:center"><div style="width:140px;height:180px;margin:0 auto">${icon('tower','#5b5248')}</div><div class="sec" style="justify-content:center">Tầng 37 / 100</div><p>Mỗi tầng có một thủ vệ. Vượt tầng nhận Linh Thạch và bí tịch.</p><br><button class="btn r" onclick="go('combat')">Khiêu chiến tầng 37</button></div>`}}
};
function roots(){return ROOTS.map(r=>`<div class="rootbar"><b style="color:${r[1]}">${r[0]}</b><div class="t"><i style="width:${r[2]}%;background:${r[1]}"></i></div><span>${r[2]}</span></div>`).join('')}
let mSel=0;
function mountUI(i){mSel=i;const m=MOUNTS[i];return `<div class="mstage">${mount(m.t,m.c)}<div class="nm">${m.n}</div><div style="position:absolute;right:10px;top:10px;font-size:12px;color:${RAR[m.r].c};font-weight:700">${RAR[m.r].n}</div></div>
 <div class="mlist">${MOUNTS.map((x,j)=>`<button class="${j===i?'on':''}" onclick="$('pbody').innerHTML=mountUI(${j})">${mount(x.t,x.c)}${x.own?'':`<div class="lk">${icon('lock','#888')}</div>`}</button>`).join('')}</div>
 <div class="stats"><div><span>Tốc độ di chuyển</span><b>${m.sp}</b></div><div><span>Thuộc tính</span><b>${m.st}</b></div></div><p style="font-size:12px;color:var(--ink2);margin:8px 0">${m.d}</p>
 <div style="display:flex;gap:8px;justify-content:center">${m.own?`<button class="btn r" onclick="toast('Đã cưỡi ${m.n}')">Cưỡi</button><button class="btn" onclick="M('nangky')">Nâng Cấp</button><button class="btn g" onclick="M('huanluyen')">Huấn Luyện</button>`:`<button class="btn" onclick="M('cachnhan','${m.n}')">Cách nhận</button>`}</div>`}
const stack=[];
function go(k,tab){if(k==='combat')return combat();const p=PG[k];stack.push(k);$('ptitle').textContent=p.t;$('prs').textContent='Linh Thạch '+P.stone;
 tab=tab||p.tabs[0];$('ptabs').innerHTML=p.tabs.map(t=>`<button class="${t===tab?'on':''}" onclick="go2('${k}','${t}')">${t}</button>`).join('');
 $('pbody').innerHTML=p.r(tab);$('pbody').scrollTop=0;$('pfoot').innerHTML=p.foot?p.foot():'';$('page').classList.add('on')}
function go2(k,t){stack.pop();go(k,t)}
function back(){stack.pop();$('page').classList.remove('on')}
// MODAL
function openM(t,b,a=''){$('mt').textContent=t;$('mb').innerHTML=b;$('ma').innerHTML=a||`<button class="btn" onclick="closeM()">Đóng</button>`;$('ma').style.display='flex';$('modal').classList.add('on')}
function closeM(){$('modal').classList.remove('on')}
const ok=(t,l='Xác nhận')=>`<button class="btn g" onclick="closeM()">Hủy</button><button class="btn r" onclick="closeM();toast('${t}')">${l}</button>`;
function itemM(n){const x=GA.item(n);openM(x.n,`<div class="ihead">${cell(x,0)}<div><b style="color:${RAR[x.r].c}">${x.n}</b>${RAR[x.r].n} · ${T[x.t]}<br>Số lượng: ${fmt(x.q)}</div></div><p>${x.d}</p><div class="kv"><span>Giá bán</span><b>${fmt((x.r+1)*120)} linh thạch</b></div><div class="kv"><span>Có thể giao dịch</span><b>${x.r>3?'Không':'Có'}</b></div>`,
 x.t==='eq'?`<button class="btn g" onclick="closeM();M('cuonghoa')">Cường hóa</button><button class="btn r" onclick="closeM();toast('Đã trang bị ${x.n}')">Trang bị</button>`:`<button class="btn g" onclick="closeM();toast('Đã bán')">Bán</button><button class="btn g" onclick="closeM();toast('Đã phân giải')">Phân giải</button><button class="btn r" onclick="closeM();toast('Đã dùng ${x.n}')">Sử dụng</button>`)}
function gongM(i){const g=GONG[i];openM(g.n,`<div class="ihead"><div class="node" style="position:static;transform:none;width:72px"><div class="c" style="background:${g.c}">${g.k}</div></div><div><b>${g.n}</b>Cấp ${g.lv} / 30<br>Hiệu quả: ${g.b}</div></div><div class="kv"><span>Cấp tiếp theo</span><b>${g.b.replace(/[\d.]+$/,m=>fmt(Math.round(parseFloat(m.replace(/\./g,''))*1.1)))}</b></div><div class="kv"><span>Tiêu hao</span><b>${fmt(g.lv*1200)} tu vi</b></div>`,ok('Tu luyện thành công','Tu luyện'))}
function skM(n){const s=SKILLS.find(x=>x.n===n);openM(s.n,`<div class="ihead"><div style="width:72px;height:72px;border-radius:50%;padding:14px;background:${s.c}22;border:2px solid ${s.c};flex:none">${icon(s.i,s.c)}</div><div><b>${s.n}</b>Cấp ${s.lv}/${s.max} · Hồi chiêu ${s.cd} hiệp</div></div><p>${s.d}</p><div class="kv"><span>Nâng cấp cần</span><b>Bí tịch x${s.lv+1}</b></div>`,`<button class="btn g" onclick="closeM();toast('${s.on?'Đã gỡ':'Đã lắp'} chiêu')">${s.on?'Gỡ':'Lắp'} chiêu</button><button class="btn r" onclick="closeM();toast('Nâng cấp thành công')">Nâng cấp</button>`)}
function dunM(i){const d=DUNGEONS[i];if(d.st==='Khóa')return openM(d.n,`<p style="text-align:center">Cần đạt cảnh giới <b>${d.req}</b> để mở bí cảnh này.</p>`);
 openM(d.n,`<div style="height:140px;position:relative;overflow:hidden;border:1px solid var(--line);margin-bottom:10px">${scenery(['#d9dfdc','#9fb2bb',d.c],'#fbf3dc')}</div><div class="kv"><span>Yêu cầu</span><b>${d.req}</b></div><div class="kv"><span>Lượt hôm nay</span><b>2/3</b></div><div class="sec">Có thể rơi</div><div class="grid">${d.drop.map(k=>{const x=ITEMS.find(y=>y.i===k)||ITEMS[0];return cell(x,0)}).join('')}</div>`,`<button class="btn g" onclick="closeM();toast('Quét nhanh xong, nhận 3 vật phẩm')">Quét nhanh</button><button class="btn r" onclick="closeM();go('combat')">Tiến vào</button>`)}
const MD={
 caidat:()=>openM('Cài Đặt',['Âm nhạc','Hiệu ứng âm thanh','Tiết kiệm pin','Thông báo đẩy'].map((s,i)=>`<div class="kv"><span>${s}</span><b onclick="this.textContent=this.textContent==='Bật'?'Tắt':'Bật'" style="cursor:pointer">${i<2?'Bật':'Tắt'}</b></div>`).join('')+`<div class="kv"><span>Máy chủ</span><b>S12 · Thanh Vân</b></div>`,`<button class="btn g" onclick="toast('Đã sao chép mã nhân vật')">Mã nhân vật</button><button class="btn r" onclick="closeM()">Lưu</button>`),
 thu:()=>openM('Phi Thư',MAILS.map((m,i)=>`<div class="mail"><i>${icon('mail',i<2?'#a8322a':'#8a7f72')}</i><div class="tx"><b class="one">${m.t}</b><small class="one" style="display:block">${m.f} · ${m.d}</small></div>${m.g.length?`<button class="btn" onclick="this.textContent='Đã nhận';toast('Đã nhận quà')">Nhận</button>`:''}</div>`).join(''),`<button class="btn" onclick="toast('Đã xóa thư đã đọc')">Xóa đã đọc</button><button class="btn r" onclick="closeM();toast('Đã nhận tất cả')">Nhận tất cả</button>`),
 sukien:()=>openM('Quà 7 Ngày',`<div class="days">${DAYS.map((d,i)=>`<div class="${i<1?'got':i==1?'today':''}"><b>Ngày ${i+1}</b><i>${icon(d[0],'#b08a3e')}</i><span class="one" style="display:block">${d[1]}</span></div>`).join('')}</div>`,`<button class="btn r" onclick="closeM();toast('Đã nhận quà ngày 2')">Nhận</button>`),
 xephang:()=>openM('Bảng Xếp Hạng',RANK.map((r,i)=>`<div class="kv"><span class="one"><b style="color:${i<3?'#a8322a':'inherit'}">${i+1}.</b> ${r[0]} <small>(${r[1]})</small></span><b>${r[2]}</b></div>`).join('')),
 shop:()=>openM('Thương Hội',`<div class="grid">${ITEMS.slice(0,10).map(x=>`<div style="text-align:center;font-size:10px">${cell(x,0)}<b>${(x.r+1)*50}</b> ngọc</div>`).join('')}</div>`),
 napdau:()=>openM('Nạp Đầu',`<p style="text-align:center">Nạp lần đầu bất kỳ nhận ngay <b>Tọa kỵ Tường Vân</b> và 500 Tiên Ngọc.</p><div style="height:120px">${mount('cloud','#ffd6e8')}</div>`,ok('Demo: chưa có thanh toán','Nạp ngay')),
 dokiep:()=>openM('Độ Kiếp',`<p style="text-align:center">Đột phá <b>Kết Đan ${P.layer}</b> → <b>Kết Đan ${P.layer+1}</b></p><div class="kv"><span>Tu vi</span><b>${fmt(P.tuvi)} / ${fmt(P.need)}</b></div><div class="kv"><span>Tỉ lệ thành công</span><b>68%</b></div><div class="kv"><span>Đan dược hỗ trợ</span><b>Kết Kim Đan x3</b></div><p style="font-size:12px;color:var(--ink2)">Thất bại sẽ mất 20% tu vi hiện có.</p>`,`<button class="btn g" onclick="closeM();itemM('Kết Kim Đan')">Dùng đan</button><button class="btn r" onclick="closeM();toast('Chưa đủ tu vi để độ kiếp')">Độ Kiếp</button>`),
 tamma:()=>openM('Tâm Ma',`<div style="width:110px;height:140px;margin:0 auto">${hero({robe:'#3a0d24',robe2:'#000',aura:'#ff3fa0',orb:'#ff3fa0',horns:1,mask:'#1a0010'})}</div><p style="text-align:center">Tâm ma 18/100. Khi đầy 100 sẽ giảm 50% tốc độ tu luyện.</p>`,`<button class="btn g" onclick="closeM();itemM('Phá Chướng Đan')">Phá Chướng Đan</button><button class="btn r" onclick="closeM();go('combat')">Khiêu chiến tâm ma</button>`),
 kyngo:()=>openM('Kỳ Ngộ',`<p>Trên đường du ngoạn, đạo hữu gặp một lão nhân ngồi đánh cờ một mình bên suối...</p>`,`<button class="btn g" onclick="closeM();toast('Lão nhân lắc đầu bỏ đi')">Đi tiếp</button><button class="btn r" onclick="closeM();toast('Nhận được Ngũ Hành Tàn Quyển!')">Ngồi đánh cờ</button>`),
 build:i=>{const b=BUILD[i];openM(b.n,`<div style="width:120px;height:120px;margin:0 auto">${pagoda(b.c,'#efe6d2',3)}</div><p style="text-align:center">${b.d}</p><div class="kv"><span>Cấp hiện tại</span><b>${b.lv}</b></div><div class="kv"><span>Trạng thái</span><b>${b.t}</b></div><div class="kv"><span>Nâng cấp cần</span><b>${fmt(b.lv*8000)} linh thạch</b></div>`,`<button class="btn g" onclick="closeM();toast('Đã thu hoạch')">Thu hoạch</button><button class="btn r" onclick="closeM();toast('Bắt đầu nâng cấp ${b.n}')">Nâng cấp</button>`)},
 sect:i=>{const s=SECT[i];openM(s.n,`<div style="width:60px;height:60px;margin:0 auto">${icon(s.i,'#a8322a')}</div><p style="text-align:center">${s.d}</p>`,ok('Đã vào '+s.n,'Vào'))},
 sectinfo:()=>openM('Thái Huyền Môn',`<div class="kv"><span>Chưởng môn</span><b>Mộ Dung Tuyết</b></div><div class="kv"><span>Cấp</span><b>7</b></div><div class="kv"><span>Cống hiến của bạn</span><b>2.450</b></div><p>Tông môn kiếm tu ẩn thế, môn quy nghiêm khắc, trọng đạo nghĩa.</p>`),
 member:n=>openM(n,`<div style="width:100px;height:120px;margin:0 auto">${hero({robe:'#e6dcc6',robe2:'#5b5248',noAura:1})}</div><p style="text-align:center">Đồng môn Thái Huyền Môn</p>`,`<button class="btn g" onclick="closeM();toast('Đã gửi lời mời kết bạn')">Kết bạn</button><button class="btn r" onclick="closeM();go('combat')">Tỉ thí</button>`),
 ruong:n=>openM('Ô ruộng',`<p style="text-align:center">${n==='Trống'?'Ô ruộng đang trống. Chọn hạt giống để gieo.':n+' đang lớn, còn 01:20:00.'}</p>`,ok(n==='Trống'?'Đã gieo hạt':'Đã tưới nước',n==='Trống'?'Gieo hạt':'Tưới nước')),
 chon:s=>openM('Chọn '+s,`<p>Chưa có trang bị cho ô ${s}. Rèn tại Luyện Khí Thất hoặc mua ở Thương Hội.</p>`,`<button class="btn r" onclick="closeM();go('dongphu')">Đến Động Phủ</button>`),
 cuonghoa:()=>openM('Cường Hóa',`<div class="ihead">${cell(GA.item('Thanh Phong Kiếm'),0)}<div><b>Thanh Phong Kiếm +7 → +8</b>Công +1.240 → +1.364</div></div><div class="kv"><span>Tiêu hao</span><b>Tinh Ngân Khoáng x6</b></div><div class="kv"><span>Tỉ lệ</span><b>75%</b></div>`,ok('Cường hóa thành công!','Cường hóa')),
 khamngoc:()=>openM('Khảm Ngọc',`<div class="grid" style="grid-template-columns:repeat(4,1fr)">${[1,0,0,0].map(f=>f?cell(GA.item('Huyết Ngọc'),0):'<div class="cell empty"></div>').join('')}</div><p style="margin-top:8px">Mỗi trang bị có 4 lỗ khảm. Lỗ thứ 2 mở ở cường hóa +10.</p>`),
 dao:()=>openM('Thái Thượng Đạo Kinh',`<p>Tâm pháp gốc. Khi các nhánh công pháp đạt cấp 10, tăng thêm 5% toàn thuộc tính.</p><div class="kv"><span>Tiến độ</span><b>4/6 nhánh</b></div>`),
 cai:()=>openM('Cài chiêu',`<p>Chạm vào chiêu thức trong danh sách bên dưới để lắp vào ô trống. Tối đa 6 chiêu.</p>`),
 tayle:()=>openM('Tẩy Linh Căn',`<p>Dùng Tẩy Tủy Dịch để ngẫu nhiên lại 5 linh căn.</p>`,ok('Linh căn đã thay đổi','Tẩy')),
 nangky:()=>openM('Nâng Cấp Tọa Kỵ',`<p>Dùng <b>Lông Tiên Hạc x5</b> để nâng tọa kỵ lên bậc tiếp theo.</p>`,ok('Tọa kỵ lên bậc!','Nâng cấp')),

 mo:()=>openM('Mở rộng túi',`<p>Mở thêm 10 ô với giá 100 Tiên Ngọc.</p>`,ok('Đã mở rộng túi','Mở rộng'))
};
function M(k,a){MD[k](a)}
// COMBAT
let eHp,pHp,rd;
function combat(){eHp=ENEMY.hp;pHp=84598;rd=1;const c=$('combat');
 c.innerHTML=`<div class="ph"><button class="bk" onclick="$('combat').classList.remove('on')">←</button><h2>Chiến Đấu</h2><div class="rs" onclick="toast('Đã bật tự động')" style="cursor:pointer">Tự động ▶</div></div>
 <div class="arena" id="arena">${scenery(['#3b3633','#2b2724','#1d1b19'],'#a8322a')}
 <div class="fs e" id="fe"><div class="hpb"><b>${ENEMY.n}</b> · ${ENEMY.realm}<div class="t"><i id="eh" style="width:100%"></i></div></div>${hero({robe:'#4a0f1a',robe2:'#120306',aura:'#ff2a2a',orb:'#ff3030',horns:1,mask:'#111'})}</div>
 <div class="round" id="rd">Hiệp 1 / 30</div>
 <div class="fs p" id="fp">${hero(HERO)}<div class="hpb"><b>${P.name}</b> · Kết Đan ${P.layer}<div class="t"><i id="ph" style="width:100%"></i></div></div></div></div>
 <div class="cbar">${SKILLS.filter(s=>s.on).slice(0,5).map(s=>`<button onclick="hit('${s.n}')"><i style="border-color:${s.c}">${icon(s.i,s.c)}</i><span class="one" style="display:block">${s.n.split(' ').slice(0,2).join(' ')}</span></button>`).join('')}</div>
 <div class="clog" id="clog">Trận đấu bắt đầu. Chọn chiêu thức để ra đòn.</div>`;c.classList.add('on')}
function hit(n){if(eHp<=0)return;const d=Math.round(18000+Math.random()*14000),r=Math.round(3000+Math.random()*5000);eHp=Math.max(0,eHp-d);pHp=Math.max(1,pHp-r);
 $('eh').style.width=eHp/ENEMY.hp*100+'%';$('ph').style.width=pHp/84598*100+'%';const fe=$('fe');fe.classList.remove('shake');void fe.offsetWidth;fe.classList.add('shake');
 fe.insertAdjacentHTML('beforeend',`<div class="dmg">-${fmt(d)}</div>`);setTimeout(()=>fe.querySelector('.dmg')?.remove(),900);
 $('clog').insertAdjacentHTML('afterbegin',`<div>[Hiệp ${rd}] <u>${P.name}</u> thi triển <b>${n}</b>, gây ${fmt(d)} sát thương. ${ENEMY.n} phản đòn ${fmt(r)}.</div>`);
 rd++;$('rd').textContent=`Hiệp ${rd} / 30`;
 if(eHp<=0)setTimeout(()=>openM('Chiến Thắng',`<p style="text-align:center">Đánh bại ${ENEMY.n} sau ${rd-1} hiệp!</p><div class="sec">Phần thưởng</div><div class="grid">${[ITEMS[2],ITEMS[6],ITEMS[13],ITEMS[29]].map(x=>cell(x)).join('')}</div>`,`<button class="btn g" onclick="closeM();combat()">Đánh lại</button><button class="btn r" onclick="closeM();$('combat').classList.remove('on')">Rời trận</button>`),500)}
</script></body></html>
