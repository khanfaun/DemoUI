<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huyết Ma Điện</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Bộ ảnh 2D vẽ bằng SVG + dữ liệu mẫu dùng chung cho 4 bản demo UI */
(function () {
  const shade = (h, p) => {
    let n = parseInt(h.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = v => Math.max(0, Math.min(255, Math.round(v + (p < 0 ? v : 255 - v) * p / 100)));
    return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
  };
  const P = {
    sword: `<path d="M48 6h10v10L28 46l-10-10z" fill="C"/><path d="M51 9h4v4L28 40l-4-4z" fill="#fff" opacity=".4"/><path d="M12 34l18 18-4 4-18-18z" fill="D"/><path d="M14 46l4 4-9 9-4-4z" fill="#6b4423"/>`,
    helm: `<path d="M12 40a20 22 0 0 1 40 0v6H12z" fill="C"/><rect x="8" y="44" width="48" height="8" rx="3" fill="D"/><path d="M32 6l4 12h-8z" fill="D"/><rect x="29" y="22" width="6" height="22" fill="#fff" opacity=".3"/>`,
    armor: `<path d="M20 8l12 6 12-6 12 10-6 10v28H14V28L8 18z" fill="C"/><path d="M32 14v42M14 36h36" stroke="D" stroke-width="4"/>`,
    belt: `<rect x="4" y="24" width="56" height="16" rx="4" fill="C"/><rect x="24" y="20" width="16" height="24" rx="3" fill="D"/><circle cx="32" cy="32" r="4" fill="#fff" opacity=".6"/>`,
    boots: `<path d="M18 6h18v34l18 8v10H14V44z" fill="C"/><path d="M14 52h40v6H14z" fill="D"/>`,
    ring: `<circle cx="32" cy="38" r="18" fill="none" stroke="C" stroke-width="7"/><path d="M24 12h16l4 8-12 10-12-10z" fill="D"/>`,
    jade: `<path d="M32 4v10" stroke="#c0392b" stroke-width="3"/><circle cx="32" cy="34" r="20" fill="C"/><circle cx="32" cy="34" r="7" fill="D"/><path d="M28 54l4 8 4-8" fill="#c0392b"/>`,
    bell: `<path d="M32 6c-12 0-16 12-16 26v10l-6 8h44l-6-8V32c0-14-4-26-16-26z" fill="C"/><rect x="10" y="48" width="44" height="6" rx="3" fill="D"/><circle cx="32" cy="58" r="4" fill="D"/>`,
    pill: `<circle cx="32" cy="34" r="22" fill="C"/><circle cx="25" cy="27" r="7" fill="#fff" opacity=".45"/><path d="M14 40q18 10 36 0" stroke="D" stroke-width="3" fill="none"/>`,

    ore: `<path d="M8 46l10-24 16-12 16 10 8 26-18 12z" fill="C"/><path d="M18 22l16 10 16-12M34 32v26" stroke="D" stroke-width="3" fill="none"/>`,

    talisman: `<rect x="18" y="4" width="28" height="56" fill="C"/><path d="M26 14h12M32 14v34M24 26h16M26 38l12 8" stroke="#b71c1c" stroke-width="3" fill="none"/>`,
    egg: `<ellipse cx="32" cy="36" rx="18" ry="24" fill="C"/><path d="M18 30l8 6 6-8 6 8 8-6" stroke="D" stroke-width="3" fill="none"/>`,
    feather: `<path d="M50 6C20 14 12 38 14 58 30 50 52 30 50 6z" fill="C"/><path d="M14 58L44 16" stroke="D" stroke-width="3"/>`,
    lotus: `<path d="M32 10c8 10 8 26 0 38-8-12-8-28 0-38z" fill="C"/><path d="M32 48C20 46 10 34 10 22c12 2 20 14 22 26zM32 48c12-2 22-14 22-26-12 2-20 14-22 26z" fill="D"/><path d="M8 50h48" stroke="D" stroke-width="4"/>`,
    bag: `<path d="M20 20h24l8 36H12z" fill="C"/><path d="M24 20q8-14 16 0" stroke="D" stroke-width="4" fill="none"/><rect x="16" y="28" width="32" height="6" fill="D"/>`,
    gear: `<g stroke="C" stroke-width="8"><path d="M32 4v12M32 48v12M4 32h12M48 32h12M12 12l8 8M44 44l8 8M12 52l8-8M44 20l8-8"/></g><circle cx="32" cy="32" r="18" fill="C"/><circle cx="32" cy="32" r="7" fill="D"/>`,
    mail: `<rect x="6" y="14" width="52" height="36" rx="3" fill="C"/><path d="M6 16l26 20 26-20" stroke="D" stroke-width="4" fill="none"/>`,
    gift: `<rect x="8" y="24" width="48" height="32" fill="C"/><rect x="6" y="18" width="52" height="10" fill="D"/><rect x="28" y="18" width="8" height="38" fill="#ffd54f"/><path d="M32 18c-6-12-18-10-14 0M32 18c6-12 18-10 14 0" stroke="#ffd54f" stroke-width="4" fill="none"/>`,
    map: `<path d="M6 12l16-6 20 6 16-6v46l-16 6-20-6-16 6z" fill="C"/><path d="M22 6v46M42 12v46" stroke="D" stroke-width="3"/><circle cx="32" cy="30" r="4" fill="#c62828"/>`,
    house: `<path d="M2 26L32 8l30 18z" fill="D"/><rect x="12" y="26" width="40" height="28" fill="C"/><rect x="26" y="36" width="12" height="18" fill="D"/><path d="M2 56h60" stroke="D" stroke-width="4"/>`,
    flag: `<path d="M14 4v56" stroke="D" stroke-width="5"/><path d="M16 8h38l-8 12 8 12H16z" fill="C"/>`,
    flame: `<path d="M32 4c4 14 20 20 20 36a20 20 0 0 1-40 0c0-10 6-14 8-22 4 6 6 8 8 8-2-8 0-16 4-22z" fill="C"/><path d="M32 30c2 8 10 10 10 18a10 10 0 0 1-20 0c0-6 6-10 10-18z" fill="#ffe082"/>`,
    wave: `<path d="M4 40q8-12 16 0t16 0 16 0 8 0v20H4z" fill="C"/><path d="M4 26q8-12 16 0t16 0 16 0 8 0" stroke="D" stroke-width="4" fill="none"/>`,
    leaf: `<path d="M8 56C8 24 28 8 58 6c0 30-18 50-50 50z" fill="C"/><path d="M8 56L44 20" stroke="D" stroke-width="3"/>`,
    bolt: `<path d="M38 2L12 36h16l-4 26 28-36H36z" fill="C"/>`,
    mountain: `<path d="M2 56L22 18l10 14 8-10 22 34z" fill="C"/><path d="M22 18l-6 12h12z" fill="#fff"/>`,
    crane: `<path d="M8 40q20-30 44-22-10 2-14 10 14 4 22 22-20-10-34-4z" fill="C"/><path d="M52 18l8-6" stroke="D" stroke-width="3"/><circle cx="52" cy="17" r="3" fill="#e53935"/>`,
    star: `<path d="M32 4l8 18 20 2-15 13 5 20-18-11-18 11 5-20L4 24l20-2z" fill="C"/>`,
    coin: `<circle cx="32" cy="32" r="26" fill="C"/><circle cx="32" cy="32" r="20" fill="none" stroke="D" stroke-width="3"/><rect x="25" y="25" width="14" height="14" fill="D"/>`,
    gem: `<path d="M12 22l10-12h20l10 12-20 32z" fill="C"/><path d="M12 22h40M22 10l10 44 10-44" stroke="#fff" stroke-width="2" opacity=".5" fill="none"/>`,
    shield: `<path d="M32 4l24 8v18c0 16-10 26-24 32C18 56 8 46 8 30V12z" fill="C"/><path d="M32 12v42" stroke="D" stroke-width="4"/>`,
    book: `<path d="M8 10h22q2 0 2 4v42q0-4-4-4H8zM56 10H34q-2 0-2 4v42q0-4 4-4h20z" fill="C"/><path d="M14 20h12M38 20h12M14 28h12M38 28h12" stroke="D" stroke-width="2"/>`,
    skull: `<path d="M32 6c14 0 24 10 24 24 0 8-4 12-8 14v10H16V44c-4-2-8-6-8-14C8 16 18 6 32 6z" fill="C"/><circle cx="23" cy="30" r="6" fill="D"/><circle cx="41" cy="30" r="6" fill="D"/><path d="M26 50v6M32 50v6M38 50v6" stroke="D" stroke-width="2"/>`,
    fist: `<rect x="14" y="20" width="36" height="28" rx="8" fill="C"/><path d="M23 20v14M32 20v14M41 20v14" stroke="D" stroke-width="3"/><rect x="20" y="46" width="24" height="14" fill="D"/>`,
    eye: `<path d="M4 32q28-28 56 0-28 28-56 0z" fill="C"/><circle cx="32" cy="32" r="10" fill="D"/><circle cx="32" cy="32" r="4" fill="#fff"/>`,
    trophy: `<path d="M18 12H8q0 14 12 14M46 12h10q0 14-12 14" stroke="C" stroke-width="4" fill="none"/><path d="M18 6h28v16a14 14 0 0 1-28 0z" fill="C"/><rect x="28" y="36" width="8" height="12" fill="D"/><rect x="18" y="48" width="28" height="8" fill="D"/>`,
    people: `<circle cx="22" cy="20" r="9" fill="C"/><circle cx="44" cy="22" r="8" fill="D"/><path d="M6 56c0-14 8-22 16-22s16 8 16 22z" fill="C"/><path d="M30 56c2-12 8-18 14-18s14 6 14 18z" fill="D"/>`,
    cauldron: `<path d="M8 22h48v6c0 16-10 26-24 26S8 44 8 28z" fill="C"/><rect x="4" y="18" width="56" height="6" rx="3" fill="D"/><path d="M16 52l-4 8M48 52l4 8M32 54v6" stroke="D" stroke-width="4"/><path d="M24 14q4-6 0-10M40 14q4-6 0-10" stroke="#bbb" stroke-width="3" fill="none"/>`,
    paw: `<ellipse cx="32" cy="42" rx="14" ry="12" fill="C"/><circle cx="14" cy="28" r="6" fill="C"/><circle cx="24" cy="16" r="6" fill="C"/><circle cx="40" cy="16" r="6" fill="C"/><circle cx="50" cy="28" r="6" fill="C"/>`,
    yin: `<circle cx="32" cy="32" r="26" fill="D"/><path d="M32 6a26 26 0 0 1 0 52a13 13 0 0 1 0-26a13 13 0 0 0 0-26z" fill="C"/><circle cx="32" cy="19" r="4" fill="D"/><circle cx="32" cy="45" r="4" fill="C"/>`,
    clock: `<circle cx="32" cy="32" r="26" fill="C"/><path d="M32 14v18l12 8" stroke="D" stroke-width="5" fill="none"/>`,
    battle: `<path d="M8 8h6l34 34-6 6L8 14zM56 8h-6L16 42l6 6L56 14z" fill="C"/><path d="M40 46l10-10 6 6-10 10zM24 46L14 36l-6 6 10 10z" fill="D"/>`,
    orb: `<circle cx="32" cy="32" r="24" fill="C"/><circle cx="24" cy="24" r="8" fill="#fff" opacity=".5"/>`,
    dragon: `<path d="M6 44q10-30 30-24t22-10q-2 18-18 20t-24 20z" fill="C"/><path d="M20 34l-4-8M30 28l-2-8" stroke="D" stroke-width="3"/><circle cx="50" cy="16" r="2.5" fill="#fff"/>`,
    tower: `<path d="M32 2l10 10H22z" fill="D"/><rect x="24" y="12" width="16" height="10" fill="C"/><path d="M18 22h28l-6 6H24z" fill="D"/><rect x="22" y="28" width="20" height="12" fill="C"/><path d="M14 40h36l-6 6H20z" fill="D"/><rect x="20" y="46" width="24" height="14" fill="C"/>`,
    shop: `<path d="M6 22l6-14h40l6 14z" fill="D"/><rect x="10" y="22" width="44" height="34" fill="C"/><rect x="18" y="32" width="12" height="24" fill="D"/><rect x="36" y="30" width="12" height="10" fill="#fff" opacity=".6"/>`,
    lock: `<rect x="12" y="28" width="40" height="30" rx="5" fill="C"/><path d="M20 28v-8a12 12 0 0 1 24 0v8" stroke="C" stroke-width="6" fill="none"/><circle cx="32" cy="42" r="5" fill="D"/>`
  };
  const icon = (name, c = '#c9a25a', cls = 'ic') =>
    `<svg viewBox="0 0 64 64" class="${cls}" aria-hidden="true">${(P[name] || P.orb).replace(/="C"/g, `="${c}"`).replace(/="D"/g, `="${shade(c, -40)}"`)}</svg>`;

  let uid = 0;
  /* Nhân vật ngồi thiền / đứng (2D vector) */
  function hero(o = {}) {
    const k = ++uid, robe = o.robe || '#e9eef3', robe2 = o.robe2 || '#9fb3c8', hair = o.hair || '#1d1b22', skin = o.skin || '#f6dcc6',
      aura = o.aura || '#8fd3ff', sash = o.sash || '#4a5c8a', orb = o.orb || '#6ae0ff', gold = o.gold || '#e8c25a';
    const vb = o.vb || '0 0 200 260';
    return `<svg viewBox="${vb}" class="${o.cls || 'hero'}" aria-hidden="true"><defs>
<radialGradient id="ha${k}"><stop offset="0" stop-color="${aura}" stop-opacity=".75"/><stop offset="1" stop-color="${aura}" stop-opacity="0"/></radialGradient>
<linearGradient id="hr${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${robe}"/><stop offset="1" stop-color="${robe2}"/></linearGradient>
<radialGradient id="ho${k}"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="${orb}"/><stop offset="1" stop-color="${orb}" stop-opacity="0"/></radialGradient></defs>
${o.noAura ? '' : `<circle cx="100" cy="120" r="100" fill="url(#ha${k})"/>`}
${o.halo ? `<circle cx="100" cy="68" r="44" fill="none" stroke="${gold}" stroke-width="3" opacity=".8"/>` : ''}
<path d="M80 60Q62 120 70 160L86 110ZM120 60Q138 120 130 160L114 110Z" fill="${hair}"/>
<path d="M28 232Q100 184 172 232Q170 252 100 254Q30 252 28 232Z" fill="url(#hr${k})"/>
<path d="M70 108Q100 96 130 108L150 222Q100 238 50 222Z" fill="url(#hr${k})"/>
<path d="M66 160H134L136 172H64Z" fill="${sash}"/>
<path d="M70 112Q38 150 50 204L88 200Q76 160 88 128ZM130 112Q162 150 150 204L112 200Q124 160 112 128Z" fill="url(#hr${k})" stroke="${robe2}" stroke-width="1"/>
<path d="M86 104L100 140L114 104" fill="none" stroke="${gold}" stroke-width="3"/>
<ellipse cx="86" cy="198" rx="10" ry="7" fill="${skin}"/><ellipse cx="114" cy="198" rx="10" ry="7" fill="${skin}"/>
<circle cx="100" cy="190" r="26" fill="url(#ho${k})"/>
<rect x="93" y="86" width="14" height="20" fill="${skin}"/>
<ellipse cx="100" cy="70" rx="22" ry="26" fill="${skin}"/>
<path d="M77 72Q72 38 100 38Q128 38 123 72Q120 50 100 50Q80 50 77 72Z" fill="${hair}"/>
<circle cx="100" cy="34" r="11" fill="${hair}"/><rect x="88" y="26" width="24" height="5" rx="2" fill="${gold}"/>
${o.horns ? `<path d="M82 46L70 14L90 40ZM118 46L130 14L110 40Z" fill="${gold}"/>` : ''}
${o.mask ? `<path d="M80 62H120V78Q100 88 80 78Z" fill="${o.mask}"/><path d="M86 68h10M104 68h10" stroke="#ff3b3b" stroke-width="3"/>` :
        `<path d="M87 72q5 3 10 0M103 72q5 3 10 0" stroke="#3a2a2a" stroke-width="2" fill="none"/><path d="M96 84q4 2 8 0" stroke="#c46a6a" stroke-width="2" fill="none"/>`}
</svg>`;
  }

  /* Tọa kỵ */
  function mount(type, c = '#ffffff') {
    const d = shade(c, -35);
    const m = {
      crane: `<path d="M40 90Q60 60 110 70L150 40Q160 36 162 44L130 80Q140 100 110 108Q70 116 40 90Z" fill="${c}"/><path d="M60 80Q20 40 10 20Q60 30 100 72Z" fill="${d}"/><path d="M90 76Q110 20 170 10Q150 50 112 82Z" fill="${c}" stroke="${d}"/><path d="M150 40L176 34L152 46Z" fill="#e8a33a"/><circle cx="156" cy="38" r="5" fill="#e53935"/><path d="M95 108L90 136M110 106L112 136" stroke="#555" stroke-width="3"/><path d="M40 90L14 100L44 96Z" fill="#222"/>`,
      qilin: `<ellipse cx="96" cy="78" rx="52" ry="26" fill="${c}"/><path d="M58 92v38M76 98v32M116 98v32M134 92v38" stroke="${d}" stroke-width="10" stroke-linecap="round"/><path d="M140 66Q160 30 178 40Q186 60 160 74Z" fill="${c}"/><path d="M168 36L176 12L172 38Z" fill="#ffd54f"/><circle cx="170" cy="48" r="3" fill="#222"/><path d="M44 72Q10 60 20 30Q30 60 50 64Z" fill="#ff7043"/><path d="M120 56Q130 40 150 50Q140 60 128 66Z" fill="#ff7043"/><path d="M70 70q26 -10 52 0" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>`,
      sword: `<path d="M20 100L170 40L178 48L30 112Z" fill="${c}"/><path d="M30 104L172 44" stroke="#fff" stroke-width="2" opacity=".7"/><path d="M28 92L40 120M20 100L8 108" stroke="${d}" stroke-width="8"/><ellipse cx="80" cy="116" rx="60" ry="12" fill="#fff" opacity=".6"/><ellipse cx="120" cy="120" rx="40" ry="9" fill="#fff" opacity=".5"/>`,
      cloud: `<g fill="${c}"><circle cx="60" cy="90" r="26"/><circle cx="96" cy="76" r="34"/><circle cx="136" cy="90" r="26"/><rect x="40" y="90" width="120" height="26" rx="13"/></g><path d="M54 112q46 14 92 0" stroke="${d}" stroke-width="4" fill="none"/><path d="M150 100q30 0 36 -20" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round"/>`,
      phoenix: `<path d="M30 96Q70 40 120 60L160 30Q168 40 150 58Q150 96 110 104Q70 112 30 96Z" fill="${c}"/><path d="M70 70Q40 10 10 10Q40 50 60 90Z" fill="${d}"/><path d="M100 64Q120 0 180 6Q150 40 116 80Z" fill="${d}"/><path d="M30 96Q0 120 6 136Q30 120 50 104Z" fill="${c}"/><circle cx="156" cy="40" r="3" fill="#fff"/>`
    };
    return `<svg viewBox="0 0 200 140" class="mnt" aria-hidden="true">${m[type] || m.cloud}</svg>`;
  }

  /* Phong cảnh núi non */
  function scenery(cols = ['#c9d6dc', '#9fb2bb', '#6f858f'], sun = '#f6e7c8', cls = 'scn') {
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" class="${cls}" aria-hidden="true">
<circle cx="300" cy="90" r="56" fill="${sun}" opacity=".85"/>
<path d="M0 190L40 120L70 150L120 70L170 140L210 110L260 170L300 100L350 150L400 120V300H0Z" fill="${cols[0]}"/>
<path d="M0 230L50 170L90 200L140 150L200 210L250 160L310 220L360 180L400 200V300H0Z" fill="${cols[1]}"/>
<rect x="0" y="210" width="400" height="22" fill="#fff" opacity=".35"/>
<path d="M0 270L60 230L120 260L190 220L260 262L330 230L400 255V300H0Z" fill="${cols[2]}"/></svg>`;
  }

  /* Lầu các / kiến trúc */
  function pagoda(c = '#a8322a', w = '#e9dcc2', tiers = 3) {
    let s = '', y = 90;
    for (let i = 0; i < tiers; i++) {
      const wd = 70 - i * 14, x = 50 - wd / 2;
      s += `<rect x="${x + 6}" y="${y - 16}" width="${wd - 12}" height="16" fill="${w}"/><rect x="${x + 14}" y="${y - 12}" width="6" height="12" fill="${shade(c, -30)}"/><rect x="${x + wd - 20}" y="${y - 12}" width="6" height="12" fill="${shade(c, -30)}"/>`;
      s += `<path d="M${x - 6} ${y - 14}Q50 ${y - 30} ${x + wd + 6} ${y - 14}L${x + wd - 4} ${y - 22}H${x + 4}Z" fill="${c}"/>`;
      y -= 24;
    }
    return `<svg viewBox="0 0 100 100" class="pgd" aria-hidden="true"><rect x="10" y="90" width="80" height="6" fill="${shade(w, -30)}"/>${s}<path d="M50 ${y - 12}V${y + 4}" stroke="#e8c25a" stroke-width="3"/></svg>`;
  }

  const RAR = [
    { n: 'Phàm phẩm', c: '#9aa0a6' }, { n: 'Lương phẩm', c: '#43a047' }, { n: 'Tinh phẩm', c: '#2f8fe0' },
    { n: 'Huyền phẩm', c: '#9c4fe0' }, { n: 'Địa phẩm', c: '#f0901e' }, { n: 'Thiên phẩm', c: '#e53935' }
  ];
  const T = { pill: 'Đan dược', mat: 'Nguyên liệu', eq: 'Trang bị', book: 'Bí tịch', spe: 'Đặc biệt' };
  const it = (n, i, c, r, t, q, d) => ({ n, i, c, r, t, q, d });
  const ITEMS = [
    it('Tụ Khí Đan', 'pill', '#7fd0ff', 1, 'pill', 128, 'Tăng 500 tu vi khi dùng. Thích hợp cho tu sĩ Luyện Khí.'),
    it('Trúc Cơ Đan', 'pill', '#ffd166', 2, 'pill', 6, 'Tăng 20% tỉ lệ đột phá Trúc Cơ.'),
    it('Kết Kim Đan', 'pill', '#f4a261', 3, 'pill', 3, 'Ngưng tụ kim đan, tăng 15% tỉ lệ độ kiếp.'),
    it('Phá Chướng Đan', 'pill', '#c77dff', 4, 'pill', 2, 'Xóa 30 điểm tâm ma ngay lập tức.'),
    it('Cửu Chuyển Hoàn Hồn Đan', 'pill', '#ff4d6d', 5, 'pill', 1, 'Hồi sinh khi độ kiếp thất bại, giữ lại toàn bộ tu vi.'),
    it('Hồi Xuân Đan', 'pill', '#8ce99a', 1, 'pill', 45, 'Hồi 30% khí huyết trong chiến đấu.'),

 kynang:{t:'Kỹ Năng',r(){const on=SKILLS.filter(s=>s.on);

  <div class="h">Ma điển chiêu thức</div>${SKILLS.map(s=>`<div class="sl"><div class="ib" style="--r:${s.c}">${icon(s.i,s.c)}</div><div class="tx"><b class="one">${s.n} <small style="color:var(--mut)">Lv${s.lv} · CD ${s.cd}</small></b><p>${s.d}</p></div><button class="btn ${s.on?'d':''}" onclick="skD('${s.n}')">${s.on?'Đã lắp':'Lắp'}</button></div>`).join('')}`}},

 bicanh:{t:'Bí Cảnh',tabs:['Bản đồ','Danh sách'],r(tab){

 dongphu:{t:'Động Phủ',tabs:['Công trình','Linh Thú'],r(tab){

  return `<div class="g3">${[['Huyết Lang','paw','#c8252c',7],['Ma Nhãn Điểu','eye','#9c4fe0',4],['Trứng Băng Phượng','egg','#9ad8ff',0]].map(p=>`<div class="card" style="text-align:center"><div style="width:80px;height:80px;margin:0 auto">${icon(p[1],p[2])}</div><b class="pf" style="font-size:17px">${p[0]}</b><div class="sub">${p[3]?'Cấp '+p[3]:'Đang ấp 31:20:00'}</div><br><button class="btn ${p[3]?'':'d'}" onclick="toast('${p[3]?'Đã cho ăn':'Chưa nở'}')">${p[3]?'Cho ăn':'Chờ nở'}</button></div>`).join('')}</div>`}},
 tongmon:{t:'Huyết Ma Tông',tabs:['Đại điện','Nhiệm vụ','Thành viên'],r(tab){
  if(tab==='Đại điện')return `<div class="g3">${SECT.map((s,i)=>`<button class="card" style="text-align:center" onclick="D('sect',${i})"><div style="width:90px;height:90px;margin:0 auto">${pagoda(['#c8252c','#7a1015','#5a1a3a','#3a2a24','#d4a84b'][i],'#2a201c',3)}</div><b class="pf" style="font-size:16px">${s.n}</b><div class="sub">${s.d}</div></button>`).join('')}</div>`;
  if(tab==='Nhiệm vụ')return TASKS.map(t=>`<div class="sl"><div class="ib" style="--r:var(--gold)">${icon('flag','#d4a84b')}</div><div class="tx"><b>${t.n}</b><p>${t.r} · Tiến độ ${t.p}</p></div><button class="btn" onclick="toast('Đã nhận nhiệm vụ')">Nhận</button></div>`).join('');
  return `<div class="card" style="padding:0"><table><tr><th>Tên</th><th>Chức vụ</th><th>Cảnh giới</th></tr>${MEMBERS.map(m=>`<tr class="rw" onclick="D('member','${m[0]}')"><td class="one">${m[0]}</td><td>${m[1]}</td><td>${m[2]}</td></tr>`).join('')}</table></div>`}}
};
function go(k,tab){cur=k;const p=PG[k];if(tab)tabs[k]=tab;const t=p.tabs?(tabs[k]||p.tabs[0]):null;
 document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 $('crumb').innerHTML=`${p.t}<small>${p.s||P.name+' · '+P.realm+' '+P.layer}</small>`;
 $('main').innerHTML=(p.tabs?`<div class="tabs">${p.tabs.map(x=>`<button class="${x===t?'on':''}" onclick="go('${k}','${x}')">${x}</button>`).join('')}</div>`:'')+p.r(t);$('main').scrollTop=0}
function filt(v){v=v.toLowerCase();document.querySelectorAll('#tbl tr.rw').forEach(r=>r.style.display=r.dataset.n.includes(v)?'':'none')}
// DRAWER
function open(t,b,a){$('dwt').textContent=t;$('dwc').innerHTML=b;$('dwa').innerHTML=a??`<button class="btn d" onclick="closeD()">Đóng</button>`;$('dw').classList.add('on')}
function closeD(){$('dw').classList.remove('on')}
const ok=(m,l='Xác nhận')=>`<button class="btn d" onclick="closeD()">Hủy</button><button class="btn" onclick="closeD();toast('${m}')">${l}</button>`;
function itemD(n){const x=GA.item(n);open(x.n,`<div class="ihead">${ib(x,0).replace('class="ib"','class="ib" ')}<div><b class="pf" style="font-size:20px;color:${RAR[x.r].c}">${x.n}</b><div class="sub">${RAR[x.r].n} · ${T[x.t]} · x${fmt(x.q)}</div></div></div><p>${x.d}</p><br><div class="kv"><span>Giá bán</span><b>${fmt((x.r+1)*120)}</b></div><div class="kv"><span>Ràng buộc</span><b>${x.r>3?'Có':'Không'}</b></div>`,
 `<button class="btn d" onclick="closeD();toast('Đã bán')">Bán</button>${x.t==='eq'?`<button class="btn o" onclick="closeD();go('trangbi','Cường hóa')">Cường hóa</button><button class="btn" onclick="closeD();toast('Đã trang bị')">Trang bị</button>`:`<button class="btn" onclick="closeD();toast('Đã dùng ${x.n}')">Sử dụng</button>`}`)}
function gongD(i){const g=GONG[i];open(g.n,`<div class="ihead"><div class="sn" style="--c:${g.c}"><div class="o">${g.k}</div></div><div><b class="pf" style="font-size:18px">${g.n}</b><div class="sub">Cấp ${g.lv}/30</div></div></div><div class="kv"><span>Hiệu quả</span><b>${g.b}</b></div><div class="kv"><span>Tiêu hao</span><b>${fmt(g.lv*1200)} tu vi</b></div>`,ok('Tu luyện thành công','Tu luyện'))}
function skD(n){const s=SKILLS.find(x=>x.n===n);open(s.n,`<div class="ihead"><div class="ib" style="--r:${s.c}">${icon(s.i,s.c)}</div><div><b class="pf" style="font-size:18px">${s.n}</b><div class="sub">Cấp ${s.lv}/${s.max} · CD ${s.cd} hiệp</div></div></div><p>${s.d}</p><br><div class="kv"><span>Nâng cấp cần</span><b>${fmt(s.lv*15000)} linh thạch</b></div>`,`<button class="btn d" onclick="closeD();toast('${s.on?'Đã gỡ':'Đã lắp'}')">${s.on?'Gỡ':'Lắp'}</button><button class="btn" onclick="closeD();toast('Lên cấp!')">Nâng cấp</button>`)}
function dunD(i){const d=DUNGEONS[i];if(d.st==='Khóa')return open(d.n,`<p>🔒 Cần cảnh giới <b>${d.req}</b>.</p>`);
 open(d.n,`<div style="height:150px;position:relative;border-radius:6px;overflow:hidden;margin-bottom:12px">${scenery(['#3a2a24','#2a1a14',d.c],'#c8252c')}</div><div class="kv"><span>Yêu cầu</span><b>${d.req}</b></div><div class="kv"><span>Lượt</span><b>3/5</b></div><div class="h" style="margin-top:12px">Vật phẩm rơi</div><div style="display:flex;gap:8px">${d.drop.map(k=>{const x=ITEMS.find(y=>y.i===k)||ITEMS[0];return `<button onclick="itemD('${x.n}')">${ib(x,0)}</button>`}).join('')}</div>`,`<button class="btn d" onclick="closeD();toast('Quét nhanh: +3 vật phẩm')">Quét nhanh</button><button class="btn" onclick="closeD();go('chiendau')">Tiến vào</button>`)}
const DD={
 thu:()=>open('Thư Tín',MAILS.map(m=>`<div class="sl"><div class="ib" style="--r:var(--gold)">${icon('mail','#d4a84b')}</div><div class="tx"><b class="one">${m.t}</b><p>${m.f}: ${m.d}</p></div>${m.g.length?`<button class="btn" onclick="this.textContent='✔';toast('Đã nhận')">Nhận</button>`:''}</div>`).join(''),`<button class="btn" onclick="closeD();toast('Nhận tất cả')">Nhận tất cả</button>`),
 sukien:()=>open('Quà 7 Ngày',`<div class="days">${DAYS.map((d,i)=>`<div class="${i<1?'got':i==1?'now':''}">Ngày ${i+1}<i>${icon(d[0],'#d4a84b')}</i><span class="one" style="display:block">${d[1]}</span></div>`).join('')}</div>`,`<button class="btn" onclick="closeD();toast('Nhận quà ngày 2')">Nhận</button>`),
 caidat:()=>open('Cài Đặt',['Âm nhạc','Âm thanh','Hiệu ứng máu','Tự động chiến đấu'].map(s=>`<div class="kv"><span>${s}</span><button class="btn d" style="padding:2px 12px" onclick="this.textContent=this.textContent==='Bật'?'Tắt':'Bật'">Bật</button></div>`).join(''),`<button class="btn" onclick="closeD()">Lưu</button>`),
 xephang:()=>open('Ma Bảng',RANK.map((r,i)=>`<div class="kv"><span class="one">${i+1}. ${r[0]} · ${r[1]}</span><b>${r[2]}</b></div>`).join('')),
 dokiep:()=>open('Độ Kiếp',`<p>Kết Đan ${P.layer} → Kết Đan ${P.layer+1}. Thiên lôi giáng xuống 9 đạo.</p><br><div class="kv"><span>Tu vi</span><b>${fmt(P.tuvi)}/${fmt(P.need)}</b></div><div class="kv"><span>Tỉ lệ</span><b>68%</b></div>`,ok('Tu vi chưa đủ','Độ kiếp')),
 tamma:()=>open('Tâm Ma',`<div style="height:180px">${hero({...H,horns:1,mask:'#000'})}</div><p>Ma tu lấy tâm ma làm sức mạnh. Tâm ma càng cao, sát thương càng lớn nhưng dễ tẩu hỏa.</p>`,`<button class="btn d" onclick="closeD();itemD('Phá Chướng Đan')">Phá Chướng Đan</button><button class="btn" onclick="closeD();go('chiendau')">Trấn áp</button>`),
 trong:s=>open(s,`<p>Ô ${s} đang trống.</p>`,`<button class="btn" onclick="closeD();go('dongphu')">Đến Luyện Khí Thất</button>`),
 phangiai:()=>open('Phân giải',`<p>Phân giải toàn bộ trang bị Phàm & Lương phẩm?</p>`,ok('Đã phân giải','Phân giải')),
 nangky:()=>open('Nâng bậc tọa kỵ',`<p>Cần Lông Tiên Hạc x5.</p>`,ok('Đã nâng bậc','Nâng')),
 cachnhan:i=>open(MOUNTS[i].n,`<p>${MOUNTS[i].d}</p>`),
 build:i=>{const b=BUILD[i];open(b.n,`<div style="width:140px;height:140px;margin:0 auto">${pagoda(b.c,'#3a2a24',3)}</div><p>${b.d}</p><br><div class="kv"><span>Cấp</span><b>${b.lv}</b></div><div class="kv"><span>Trạng thái</span><b>${b.t}</b></div>`,`<button class="btn d" onclick="closeD();toast('Đã thu hoạch')">Thu hoạch</button><button class="btn" onclick="closeD();toast('Bắt đầu nâng cấp')">Nâng cấp</button>`)},
 sect:i=>open(SECT[i].n,`<p>${SECT[i].d}</p>`,ok('Đã vào '+SECT[i].n,'Vào')),
 member:n=>open(n,`<div style="height:180px">${hero({...H,robe:'#3a2a24'})}</div>`,`<button class="btn d" onclick="closeD();toast('Đã kết bạn')">Kết bạn</button><button class="btn" onclick="closeD();go('chiendau')">Tỉ thí</button>`)
};
function D(k,a){DD[k](a)}
// COMBAT
let eh=ENEMY.hp,ph=84598,rd=1;
function combatUI(){eh=ENEMY.hp;ph=84598;rd=1;return `<div class="arena">${scenery(['#2a1a14','#1a0d0b','#0d0a0b'],'#c8252c')}<div class="turn" id="turn">Lượt 1</div>
 <div class="ft p">${hero(H)}<div class="hp"><b>${P.name}</b> <span style="color:var(--mut)">HP <span id="phv">${fmt(ph)}</span></span><div class="t"><i id="ph" style="width:100%"></i></div></div></div>
 <div class="ft e" id="fe">${hero({robe:'#3a0a3a',robe2:'#000',hair:'#5a0a5a',aura:'#9c4fe0',orb:'#9c4fe0',horns:1,mask:'#111'})}<div class="hp"><b>${ENEMY.n}</b> <span style="color:var(--mut)">${ENEMY.realm}</span><div class="t"><i id="eh" style="width:100%"></i></div></div></div></div>
 <div class="cmd"><div class="menu">${[['Tấn công','atk()'],['Pháp thuật','sub("skill")'],['Vật phẩm','sub("item")'],['Phòng thủ','defend()'],['Bỏ chạy','go("bicanh")']].map(m=>`<button onclick='${m[1]}'>${m[0]}</button>`).join('')}</div>
 <div class="card"><div id="subm"></div><div class="clog" id="clog">Huyết Ma Lão Tổ xuất hiện! Lựa chọn hành động.</div></div></div>`}
function sub(t){$('subm').innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${t==='skill'?SKILLS.filter(s=>s.on).map(s=>`<button class="btn d" style="display:flex;gap:6px;align-items:center" onclick="atk('${s.n}')"><i style="width:18px;height:18px;display:block">${icon(s.i,s.c)}</i>${s.n}</button>`).join(''):ITEMS.filter(x=>x.t==='pill').slice(0,4).map(x=>`<button class="btn d" onclick="ph=Math.min(84598,ph+20000);upd();log('Dùng <b>${x.n}</b>, hồi 20.000 HP');$('subm').innerHTML=''">${x.n} x${x.q}</button>`).join('')}</div>`}
function defend(){toast('Phòng thủ: giảm 50% sát thương');enemyT()}
function upd(){if(!$('eh'))return;$('eh').style.width=eh/ENEMY.hp*100+'%';$('ph').style.width=ph/84598*100+'%';$('phv').textContent=fmt(ph)}
function log(s){$('clog').insertAdjacentHTML('afterbegin',`<div>[Lượt ${rd}] ${s}</div>`)}
function enemyT(){if(!$("clog"))return;const r=Math.round(2000+Math.random()*5000);ph=Math.max(1,ph-r);upd();log(`${ENEMY.n} tung <b>Huyết Hải Ma Công</b>, gây ${fmt(r)} sát thương.`);rd++;$('turn').textContent='Lượt '+rd}
function atk(n){if(eh<=0)return;$('subm').innerHTML='';const d=Math.round((n?22000:12000)+Math.random()*12000);eh=Math.max(0,eh-d);upd();
 const fe=$('fe');fe.classList.remove('hitfx');void fe.offsetWidth;fe.classList.add('hitfx');fe.insertAdjacentHTML('beforeend',`<div class="dmg">-${fmt(d)}</div>`);setTimeout(()=>fe.querySelector('.dmg')?.remove(),900);
 log(`<u>${P.name}</u> ${n?'thi triển <b>'+n+'</b>':'tấn công thường'}, gây ${fmt(d)} sát thương.`);
 if(eh<=0)return setTimeout(()=>open('Chiến thắng',`<p>Đánh bại ${ENEMY.n} sau ${rd} lượt.</p><br><div class="h">Chiến lợi phẩm</div><div style="display:flex;gap:8px">${[ITEMS[2],ITEMS[13],ITEMS[29],ITEMS[31]].map(x=>ib(x)).join('')}</div>`,`<button class="btn d" onclick="closeD();go('chiendau')">Đánh lại</button><button class="btn" onclick="closeD();go('bicanh')">Về bí cảnh</button>`),500);
 setTimeout(enemyT,400)}
go('tongquan');
</script></body></html>
